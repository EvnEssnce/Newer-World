; Rules shared by every weapon mastery tree (data/mastery_<weapon>.cfg).
; Server and clients both read this file.

[rules]

; Most points one weapon tree can spend: 1.5 branches (a branch costs about 20
; to max: max one, go halfway down the other). The points themselves come from
; the character level's pool (data/progression.cfg [points]), shared by the
; Wing tree and every weapon tree.
points=30
; Points that must already be spent in a branch (on nodes of lower tiers) before
; each tier of that branch opens: tier 1, tier 2, tier 3, capstone (tier 4).
; (Wing trees use these too.)
tier_requirements=[0, 4, 8, 12]
