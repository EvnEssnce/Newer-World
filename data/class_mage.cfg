; Mage class: ranged damage and healing at range. The Great Staff deals damage,
; the Gauntlet heals and drains, the Wings add power and lockdowns. No mana:
; Mage weapon abilities cost Ember. Picked per character with the --class=mage
; launch flag (or run_local_test.ps1 -Class mage) and fixed. The server only
; lets a Mage equip the weapons listed here. Server and clients both read this
; file.

[class]

; Shown in the UI.
name="Mage"
; Every weapon this class can equip (ids of data/weapon_<id>.cfg). No other
; class can use them.
weapons=["great_staff", "gauntlet"]
; The two weapons a new character starts with equipped, in slot order (the first
; one is out at spawn; X swaps to the second).
default_loadout=["great_staff", "gauntlet"]
; Multiplies every Ember gain (damage dealt or taken, healing): Mage abilities
; cost Ember, so Mages gain it twice as fast.
ember_gain=2.0
