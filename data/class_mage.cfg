; Mage class: ranged damage and healing at range. The Great Staff deals damage,
; the Gauntlet heals and drains, the Wings add power and lockdowns. No mana:
; Mage weapon abilities cost Ember. Picked per character with the --class=mage
; launch flag (or run_local_test.ps1 -Class mage) and fixed. The server only
; lets a Mage equip the weapons listed here. Server and clients both read this
; file.

[class]

; Shown in the UI.
name="Mage"
; Every weapon this class can equip (ids of data/weapon_<id>.cfg). No other
; class can use them.
weapons=["great_staff", "gauntlet"]
; The two weapons a new character starts with equipped, in slot order (the first
; one is out at spawn; X swaps to the second).
default_loadout=["great_staff", "gauntlet"]
; Max health before gear and the level bonus (health points; a ranged class: a bit less than the shared 1000).
base_health=900.0
; Multiplies every Ember gain (damage dealt or taken, healing): Mage abilities
; cost Ember, so Mages gain it twice as fast.
ember_gain=2.0

[level_bonus]

; Each character level past a full Wing tree (levels 21-30: the Wing points the
; level gives beyond the tree's [tree] points, data/progression.cfg) is one
; bonus point for this stat. Server decides; the K panel's Wings tab shows it.
; stat: one of max_health, damage, move_speed, dodge_cost, ember_cost, healing.
stat="ember_cost"
; Fraction less Ember per ability (weapon and Wing) per point (0.02: -20% at level 30).
per_point=0.02

[gathering]

; Gathering passive: this class is better at one gathering tradeskill (every
; node of it, whatever the resource: mining = all ores, logging = all wood,
; harvesting = all plants), the one its weapons use most (the Great Staff is mostly planks).
; Tradeskill id (data/tradeskills.cfg); "" = none.
skill="logging"
; Shown in the P panel.
name="Emberwood Sense"
; Fraction of the gather time it takes (0.85 = 15% faster), times the level's.
time_multiplier=0.85
; Added to the level's chance of bonus units on each gather (0.10 = +10%).
bonus_chance=0.10
