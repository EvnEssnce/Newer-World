; Gauntlet, a Mage weapon. Life magic at mid range: healing, shielding and
; draining, with some damage of its own.
; The Mage has no mana: abilities cost Ember (ember_cost), and the Mage gains
; Ember twice as fast (data/class_mage.cfg ember_gain). The server and the
; client's own prediction both read this file: restart the server AND clients
; after editing. Times are in seconds (rounded to physics ticks, 60 per second),
; distances in meters. See data/weapon_broadsword.cfg for what every key means,
; data/weapon_spear.cfg for projectiles, data/zones.cfg for zones.
;
; Mage keys (server):
;   window_ramp   each hit window after the first deals this fraction more
;                 (window i: 1 + window_ramp x i): a ramping channel
;   lifesteal     fraction of the damage it deals that heals you
;   ally_heal     allies its hitbox touches are healed this much per window
;   ally_shield   you and the allies its hitbox touches get Ward (absorbs this
;                 much damage; data/status_effects.cfg)
;   allies_only   true = its hitbox never touches enemies

[weapon]

; Shown on the HUD and in the mastery panel.
name="Gauntlet"
; Placeholder model to draw (cosmetic only).
model="gauntlet"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.4
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_gauntlet.cfg.
abilities=["mending_beam", "renewal_pulse", "siphon", "ward", "life_spore", "withering_touch"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A bolt of life energy.
damage=35.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.15
active=0.05
recovery=0.22
move_multiplier=0.65
shape="none"
range=0.0
width=0.0
height=0.0
projectile="life_bolt"
projectile_time=0.13

[heavy]

; A draining blast in front of you: heals you for part of the damage.
damage=90.0
stagger=0.2
block_stamina_damage=20.0
breaks_block=false
windup=0.4
active=0.1
recovery=0.35
move_multiplier=0.4
shape="box"
range=3.0
width=2.5
height=2.0
lifesteal=0.3

; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---

[ability_mending_beam]

; A channeled beam that heals the allies it touches (not you, not
; enemies): 30 per pulse, six pulses.
name="Mending Beam"
; Ember spent when it starts (Mages have no mana).
ember_cost=15.0
cooldown=10.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.15
active=0.12
recovery=0.3
move_multiplier=0.4
turn_speed=540.0
shape="box"
range=10.0
width=1.4
height=2.2
windows=6
window_interval=0.3
ally_heal=30.0
allies_only=true

[ability_renewal_pulse]

; A burst of healing on a circle 6 m ahead (you and allies in it;
; data/zones.cfg [zone_renewal_pulse]).
name="Renewal Pulse"
; Ember spent when it starts (Mages have no mana).
ember_cost=25.0
cooldown=14.0
damage=0.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.3
active=0.05
recovery=0.3
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
; The zone (data/zones.cfg), placed zone_time s after the start, zone_distance m ahead.
zone="renewal_pulse"
zone_time=0.3
zone_distance=6.0

