; Tradeskills (TradeskillDefs, World/Tradeskills): levels and XP per skill. The
; server decides all of it; clients only draw the Tradeskills panel (P) from what
; the server sends. Restart the server and clients after editing.
;
; Every character starts each skill at level 1 with 0 XP. A skill levels up when
; its XP reaches the XP to the next level; leftover XP carries over.

[tradeskills]

; Highest level any tradeskill reaches. XP earned at the cap is dropped.
level_cap=100
; Every skill id, in the order the panel lists them (within its category). Each
; one needs a [skill_<id>] section below.
order=["mining", "logging", "harvesting", "smelting", "timbercraft", "spinning", "weaponsmithing", "armoring"]

[xp_curve]

; XP needed to go from level L to L + 1 = round(base * L ^ exponent).
; With base 100 and exponent 1.5: level 1 -> 2 takes 100 XP, 10 -> 11 about
; 3,160, 50 -> 51 about 35,400, 99 -> 100 about 98,500 (about 3.9 million in all).
; XP points (base) and a unitless power (exponent).
base=100.0
exponent=1.5

[gathering]

; Effects of a gathering skill's level (category "gathering"), shared by every
; gathering skill. Level 1 has no bonus.
;
; Gather time multiplier = 1 - time_reduction_per_level * (level - 1), never below
; time_floor. Fraction of the node's gather time per level (0.004 = 0.4% faster per
; level: level 100 gathers in about 60% of the time).
time_reduction_per_level=0.004
; Lowest gather time multiplier (fraction of the node's gather time).
time_floor=0.6
; Chance of bonus units on each gather = bonus_chance_per_level * (level - 1),
; capped at bonus_chance_max. Fraction (0..1) per level (0.005 = +0.5% per level:
; level 100 has a 49.5% chance).
bonus_chance_per_level=0.005
; Highest bonus chance (fraction, 0..1).
bonus_chance_max=0.5
; Units added to a gather when the bonus roll succeeds (whole units).
bonus_units=1

[crafting]

; Effects of refining and crafting skills' levels (maybe bonus output later) go
; here. Recipe level requirements and XP per craft are in data/recipes.cfg.
; Nothing reads this section yet.

; --- Skills ---
; name: shown in the panel. category: "gathering", "refining" or "crafting"
; (the panel's groups; only gathering skills have gathering effects).
; Gathering skills only (World/Tradeskills.on_gathered): XP per gather =
; (xp_per_gather + xp_per_unit * units gathered) * node_xp[node kind] (XP points;
; a node kind not in node_xp counts 1.0, so higher tier nodes can give more).
; Refining and crafting skills get XP from their recipes (data/recipes.cfg
; xp), so they have no XP keys here.

[skill_mining]

name="Mining"
category="gathering"
; XP for each gather from an ore node, however many units it gave (XP points).
xp_per_gather=10
; XP per unit gathered, bonus units included (XP points).
xp_per_unit=5
; Node kind -> XP multiplier (unitless). Empty = every node gives 1.0.
node_xp={}

[skill_logging]

name="Logging"
category="gathering"
; XP for each gather from a tree, however many units it gave (XP points).
xp_per_gather=10
; XP per unit gathered, bonus units included (XP points).
xp_per_unit=5
; Node kind -> XP multiplier (unitless). Empty = every node gives 1.0.
node_xp={}

[skill_harvesting]

name="Harvesting"
category="gathering"
; XP for each gather from a plant, however many units it gave (XP points).
xp_per_gather=10
; XP per unit gathered, bonus units included (XP points).
xp_per_unit=5
; Node kind -> XP multiplier (unitless). Empty = every node gives 1.0.
node_xp={}

[skill_smelting]

; Ore -> ingots.
name="Smelting"
category="refining"

[skill_timbercraft]

; Logs -> planks.
name="Timbercraft"
category="refining"

[skill_spinning]

; Fibers -> cloth.
name="Spinning"
category="refining"

[skill_weaponsmithing]

; Weapons.
name="Weaponforging"
category="crafting"

[skill_armoring]

; Armor.
name="Armorcraft"
category="crafting"
