; Crafting stations (RecipeDefs, World/Crafting). Placed in the level by
; Marker3D children of World/Stations (metadata/kind = the part after
; "station_" below). F next to one (when no loot or gathering node is in
; reach) opens the crafting panel with that station's recipes (data/recipes.cfg
; recipes whose station is this kind). Players walk through stations.

; One section per station kind: [station_<kind>].
; name: shown in the prompt and the panel title ("[F] Use Forge").
; action: the prompt's verb.
; range: meters (horizontal) from the station's center you can use it from;
;   walking farther closes the panel and cancels a craft in progress
;   (plus [crafting] range_tolerance in data/recipes.cfg on the server).
; visual: the client look ("forge").

[station_forge]
name="Forge"
action="Use"
range=3.0
visual="forge"
