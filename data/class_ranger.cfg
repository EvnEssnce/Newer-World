; Ranger class: ranged damage. Wants space and has tools to keep it; their Wings
; mostly upgrade the roll. Picked per character with the --class=ranger launch
; flag (or run_local_test.ps1 -Class ranger) and fixed. The server only lets a
; Ranger equip the weapons listed here. Server and clients both read this file.

[class]

; Shown in the UI.
name="Ranger"
; Every weapon this class can equip (ids of data/weapon_<id>.cfg). No other
; class can use them.
weapons=["longbow", "crossbow", "firebolts"]
; The two weapons a new character starts with equipped, in slot order (the first
; one is out at spawn; X swaps to the second).
default_loadout=["longbow", "firebolts"]
