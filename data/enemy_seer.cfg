; Cinder Seer: a ranged caster. It throws a slow ember orb (data/projectiles.cfg
; [projectile_cinder_orb]) from long range and backs away from players who get
; close between casts. Server only (clients just draw it), so editing this file
; only needs a server restart. Times are in seconds.

[stats]

; Name shown over it.
name="Cinder Seer"
; Health points.
max_health=420.0
; Chasing speed, meters per second.
move_speed=3.2
; Wandering speed around its camp, meters per second.
wander_speed=1.2
; Speed when walking back to its camp after being pulled too far, m/s.
return_speed=6.0
; Degrees per second it turns toward its target (also while winding up a cast,
; so the orb follows a target who strafes during the windup).
turn_speed=240.0
; Multiplies the stagger time of hits it takes. 0 = never staggered.
stagger_multiplier=1.0
; Seconds after dying before it respawns at its camp.
respawn_time=15.0
; Seconds without taking damage before it heals to full and goes back to its
; camp. 0 = never (it heals when it walks home after leashing instead).
reset_time=0.0
; Its "weapon" gear score: how well its orbs get through players' armor
; (data/gear.cfg [armor]). Doesn't change its damage.
gear_score=135

[ai]

; Notices players within this many meters while idle. Keep at most 12 so a camp
; doesn't pull players walking past the middle of the test map.
aggro_range=10.0
; Gives up and walks home if it gets this far from its camp (meters).
leash_range=20.0
; Starts a cast when its target is this close (meters) and the way to it is
; direct (nothing in between on its path).
attack_range=13.0
; Seconds between the end of one cast and the start of the next.
attack_cooldown=2.2
; Wanders within this many meters of its camp while idle.
wander_radius=3.0
; Seconds it pauses between wandering moves (random, up to this long).
wander_pause=3.0
; true = never moves, turns or swings (the training dummy). false for real enemies.
stationary=false
; Between casts (while attack_cooldown runs) it backs away from a target nearer
; than this many meters, still facing it. 0 = stands its ground.
keep_distance=7.0
; Speed while backing away, meters per second.
retreat_speed=3.0
; Its orbs aim at this many meters above the target's feet (about chest height).
aim_height=1.0

[navigation]

; Walking around obstacles (crates, a Shield Wall) on the server's navigation
; mesh (map-wide settings in data/navigation.cfg). false = walks straight at
; its target and stalls against whatever is in the way.
enabled=true
; Seconds between asking for a new path while walking somewhere.
repath_interval=0.5
; Also asks for a new path when its target has moved this many meters from
; where the current path ends.
repath_distance=1.0
; Meters from a path corner at which it counts as reached (heads for the next).
waypoint_reach=0.3

[loot]

; Loot table it drops from (a [table_<id>] in data/loot.cfg). Every player who
; damaged it gets their own roll when it dies (personal loot). "" = no loot.
table="seer"

[progression]

; Character XP every player who damaged it gets when it dies (XP points; each
; contributor gets the whole amount). Character level 1 -> 2 takes 400
; (data/progression.cfg).
kill_xp=70
; Weapon mastery XP every contributor gets when it dies (XP points), split over
; the weapons that dealt their damage by how much each dealt (Wing abilities
; count for no weapon). Mastery level 1 -> 2 takes 200.
mastery_xp=55

[threat]

; Who it fights: the player with the highest threat, switching only when
; someone has more than switch_ratio x its current target's (see enemy_husk.cfg).
; Threat per point of damage a player deals to it (hits, projectiles, bleed).
per_damage=1.0
; Threat per point of health a player heals onto someone it already has
; threat on (the healer draws aggro).
per_heal=0.5
; Threat a player gets the first time they come within aggro_range, so it
; notices players who haven't hit it yet. Ties go to whoever came close first.
proximity=10.0
; A challenger takes its attention only with more than this many times the
; current target's threat (1.1 = 10% more). At least 1.
switch_ratio=1.1
; Fraction of every player's threat lost per second (0 = never fades).
decay_per_second=0.02

[attack]

; The cast: it winds up (glowing red: the cue to dodge or step aside), then
; throws one ember orb at its target at projectile_time. The orb's hit does
; the damage, stagger, block cost and status below.
; Damage of an orb that hits (before armor).
damage=70.0
; Seconds the player is staggered when hit. 0 = no stagger.
stagger=0.0
; Stamina a blocked orb costs the blocker (a guard facing it stops the orb).
block_stamina_damage=25.0
; true = an orb breaks a guard (heavy-style). false = a guard holds.
breaks_block=false
; Seconds of windup (the telegraph; it turns to track its target meanwhile).
windup=0.8
; Seconds of the "active" part (no hitbox: the orb leaves at its start).
active=0.1
; Seconds of recovery after the throw before its cooldown starts.
recovery=0.5
; Movement speed while casting, as a fraction of move_speed. 0 = stands still.
move_multiplier=0.0
; No melee hitbox: "none" (the orb is the only thing that hits).
shape="none"
; Hitbox size, meters (unused with shape="none").
range=0.0
width=0.0
height=0.0
; Projectile kind it throws (a [projectile_<id>] in data/projectiles.cfg).
projectile="cinder_orb"
; Seconds from the start of the cast when the orb leaves: the end of the windup.
projectile_time=0.8
; Status put on a player the orb damages: an id from data/status_effects.cfg,
; "" = none. Burn: 6 damage per second per stack.
applies_status="burn"
; Burn stacks per orb.
status_stacks=1
; Seconds the Burn lasts (shorter than a cast cycle of ~3.6 s, so one Seer's
; Burns don't pile up: about 12 extra damage per orb that lands).
status_duration=2.0
