; Dual Talons, an Assassin weapon: phoenix-claw fist weapons. The fastest
; attacks in the game, built around combos and hits from behind (backstabs:
; data/combat.cfg [backstab]). The server and the client's own prediction both
; read this file: restart the server AND clients after editing. Times are in
; seconds (rounded to physics ticks, 60 per second), distances in meters. See
; data/weapon_broadsword.cfg for what every key means.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Dual Talons"
; Placeholder model to draw (cosmetic only): a claw on each fist.
model="dual_talons"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; Claws make a poor guard.
block_stamina_multiplier=1.8
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_dual_talons.cfg.
abilities=["pounce", "rending_talons", "eviscerate", "talon_spin", "feint", "hook_talon"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack (faster
; than the Fighter's 720: quick hands).
turn_speed=900.0

[light]

; A quick claw swipe: weaker than any other light, but the fastest (0.28 s).
damage=38.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.06
active=0.08
recovery=0.14
; Movement speed while attacking, as a fraction of normal speed.
move_multiplier=0.75
range=1.5
width=1.5
height=2.0

[heavy]

; Both claws raked down together.
damage=120.0
stagger=0.3
block_stamina_damage=30.0
breaks_block=true
windup=0.25
active=0.1
recovery=0.3
move_multiplier=0.35
range=1.8
width=1.8
height=2.2
; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---

[ability_pounce]

; Leap onto a target: a short hop forward, raking it as you land.
name="Pounce"
cooldown=9.0
damage=110.0
stagger=0.3
block_stamina_damage=30.0
breaks_block=false
windup=0.4
active=0.12
recovery=0.35
move_multiplier=0.0
turn_speed=0.0
shape="box"
range=2.0
width=2.0
height=2.2
; Meters leapt forward, from dash_start to dash_end (seconds from the start).
dash_distance=5.0
dash_start=0.05
dash_end=0.35
; Peak height of the hop, meters. Cosmetic only.
leap_height=1.0

[ability_rending_talons]

; A cross-slash that tears: the target bleeds (data/status_effects.cfg).
name="Rending Talons"
cooldown=8.0
damage=70.0
stagger=0.0
block_stamina_damage=20.0
breaks_block=false
windup=0.15
active=0.1
recovery=0.25
move_multiplier=0.5
turn_speed=720.0
shape="box"
range=1.7
width=2.0
height=2.0
applies_status="bleed"
status_stacks=2

[ability_eviscerate]

; A finisher: deals more damage the lower the target's health.
name="Eviscerate"
cooldown=10.0
damage=130.0
stagger=0.2
block_stamina_damage=30.0
breaks_block=false
windup=0.3
active=0.12
recovery=0.35
move_multiplier=0.3
turn_speed=540.0
shape="box"
range=1.8
width=1.6
height=2.0
; Below execute_threshold of the target's max health (fraction) this hit
; deals more damage, growing linearly from 0 at the threshold to
; execute_damage (fraction, 1.0 = +100%) at 0 health. Server only.
execute_damage=1.0
execute_threshold=0.35

[ability_talon_spin]

; A spinning flurry around you: three hits, each its own window, so a target
; next to you can be hit by all three.
name="Talon Spin"
cooldown=9.0
; Damage per spin.
damage=40.0
stagger=0.0
block_stamina_damage=12.0
breaks_block=false
windup=0.12
active=0.08
recovery=0.3
windows=3
window_interval=0.18
move_multiplier=0.6
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=2.4
width=0.0
height=2.0

[ability_feint]

; A fake attack. If the target blocks or dodges it (or it lands on an enemy
; in the middle of its own swing), you're Primed (data/status_effects.cfg):
; your next hit is a guaranteed crit. Otherwise it's just a light poke.
name="Feint"
cooldown=7.0
damage=25.0
stagger=0.0
block_stamina_damage=5.0
breaks_block=false
windup=0.12
active=0.15
recovery=0.15
move_multiplier=0.7
turn_speed=720.0
shape="box"
range=1.8
width=1.8
height=2.0
; Status you get when it reads the target (server).
read_status="primed"

[ability_hook_talon]

; A short grapple: hooks the first target in a line and pulls it a step
; toward you (stops [force] pull_gap short of you, data/combat.cfg).
name="Hook Talon"
cooldown=9.0
damage=50.0
stagger=0.2
block_stamina_damage=15.0
breaks_block=false
windup=0.2
active=0.1
recovery=0.3
move_multiplier=0.3
turn_speed=540.0
shape="box"
range=3.5
width=1.0
height=2.0
; Only the first target it touches.
max_targets=1
; Pulled up to this many meters toward you, over this many seconds.
force_direction="toward"
force_distance=2.0
force_duration=0.25
