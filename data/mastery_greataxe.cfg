; Greataxe mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.

[tree]

; Branch ids, in display order, and their names.
branches=["maelstrom", "bloodied"]
branch_names=["Maelstrom", "Bloodied"]

[default]

; What a new character starts with (must follow the rules).
nodes=["vortex", "grounding_blow", "broad_swing", "iron_hide", "charging_chop", "hurl", "executioners_swing"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["vortex", "charging_chop", "grounding_blow"]

; --- Maelstrom: gathers enemies together ---

[node_vortex]

name="Vortex"
branch="maelstrom"
tier=1
kind="active"
cost=1
ability="vortex"
description="Spin with the axe out: three hits on everything around you, each pulling it in."

[node_grounding_blow]

name="Grounding Blow"
branch="maelstrom"
tier=1
kind="active"
cost=1
ability="grounding_blow"
description="Slam the ground: hits everything around you and slows it for 3 seconds."

[node_broad_swing]

name="Broad Swing"
branch="maelstrom"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_iron_hide]

name="Iron Hide"
branch="maelstrom"
tier=2
kind="active"
cost=1
ability="iron_hide"
description="For 6 seconds, take 8% less damage for each enemy within 5 meters (up to 40%)."

[node_undertow]

name="Undertow"
branch="maelstrom"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="vortex"
amount=0.25
description="Vortex deals 25% more damage."

[node_aftershock]

name="Aftershock"
branch="maelstrom"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="grounding_blow"
amount=0.3
description="Grounding Blow deals 30% more damage."

[node_eye_of_the_storm]

name="Eye of the Storm"
branch="maelstrom"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Greataxe abilities deal 10% more damage."

[node_heavy_footing]

name="Heavy Footing"
branch="maelstrom"
tier=3
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.1
description="Heavy attacks deal 10% more damage."

[node_maelstrom]

name="Maelstrom"
branch="maelstrom"
tier=4
kind="passive"
cost=2
effect="ability_range"
; The ability whose reach it multiplies...
applies_to="vortex"
; ...by this much (2 = twice as far; the pull reaches with it).
amount=2.0
description="Vortex reaches and pulls from twice as far."

; --- Bloodied: damage that ramps over a fight ---

[node_charging_chop]

name="Charging Chop"
branch="bloodied"
tier=1
kind="active"
cost=1
ability="charging_chop"
description="Run 6 meters forward and finish with a heavy chop."

[node_hurl]

name="Hurl"
branch="bloodied"
tier=1
kind="active"
cost=1
ability="hurl"
description="Throw the greataxe (about 15 meters): it slows the target for 5 seconds."

[node_blood_price]

name="Blood Price"
branch="bloodied"
tier=1
kind="passive"
cost=1
effect="low_health_damage"
amount=0.15
; Applies below this fraction of your max health.
threshold=0.5
description="Below half health, deal 15% more damage."

[node_executioners_swing]

name="Executioner's Swing"
branch="bloodied"
tier=2
kind="active"
cost=1
ability="executioners_swing"
description="A heavy swing that deals more damage to targets below 30% health, up to 150% more as they near death."

[node_rending_chop]

name="Rending Chop"
branch="bloodied"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="charging_chop"
amount=0.3
description="Charging Chop deals 30% more damage."

[node_battle_fever]

name="Battle Fever"
branch="bloodied"
tier=2
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your Greataxe attacks and abilities deal 5% more damage."

[node_butchers_edge]

name="Butcher's Edge"
branch="bloodied"
tier=3
kind="upgrade"
cost=1
effect="damage"
applies_to="executioners_swing"
amount=0.25
description="Executioner's Swing deals 25% more damage."

[node_heavy_hand]

name="Heavy Hand"
branch="bloodied"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="heavy"
amount=0.15
description="Heavy attacks deal 15% more damage."

[node_red_tide]

name="Red Tide"
branch="bloodied"
tier=4
kind="passive"
cost=2
effect="ramp_on_hit"
; The stacking buff each hit adds (data/status_effects.cfg: per-stack damage,
; most stacks, how long it lasts without a hit).
applies_to="bloodied"
description="Each hit you land gives 3% more damage (up to 24%) until you stop hitting for 2.5 seconds."
