; Projectiles (the PROJ tag): one [projectile_<id>] section per kind. An attack or
; ability throws one with its `projectile` key (see data/weapon_spear.cfg's
; Javelin Cast); its damage, stagger, statuses and force_* ride on the hit.
; The server flies them and decides every hit; clients fly a copy with the same
; math for the visuals. The server and clients both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second), distances in meters.

[projectile_javelin]

; Javelin Cast (Spear): a conjured, feather-styled spear.
; Meters per second when thrown.
speed=28.0
; Downward pull, meters per second squared. 0 = flies straight.
gravity=3.0
; Degrees above horizontal it's thrown at (the aim has no pitch yet).
pitch=2.0
; Seconds before it disappears if it hit nothing (28 m/s x 0.8 s = 22 m range).
lifetime=0.8
; Radius of the projectile for hit tests, meters (added to the target's body).
hit_radius=0.25
; How many targets it passes through before stopping. 0 = stops at the first.
pierce=0
; true = the world (walls, crates, the ground) stops it.
walls=true
; true = a blocked or parried hit stops it (a guard catches it), even with pierce.
stopped_by_guard=true
; Release point: meters above the thrower's feet.
release_height=1.3
; Release point: meters in front of the thrower's center.
release_forward=0.3
; Look (cosmetic): "feather" (a tapered quill with a vane) or "axe" (a spinning
; hand axe). Length in meters, color of the vane / blade.
visual="feather"
length=1.5
color=Color(0.55, 0.85, 1.0, 1.0)
; Degrees per second the visual spins around the vertical axis (0 = none).
spin=0.0

[projectile_boomerang_axe]

; Boomerang Axe (Dual Axes): flies out, then comes back to the thrower, hitting
; on the way out and again on the way back (each target once per leg). Keys
; not explained here are explained in [projectile_javelin] above.
speed=20.0
gravity=0.0
pitch=0.0
; Safety limit for the whole round trip, seconds.
lifetime=3.0
hit_radius=0.45
; Targets passed through per leg before it turns back early. High = cuts
; through a whole group.
pierce=20
walls=true
; false = a guard takes the hit (stamina) but the axe flies on.
stopped_by_guard=false
release_height=1.2
release_forward=0.3
; true = it comes back. Seconds of the way out before it turns (20 m/s x 0.45 s
; = 9 m out). Hitting a wall on the way out turns it back early; on the way back
; it passes through the world.
returns=true
return_after=0.45
; Meters per second on the way back. It steers toward the thrower's current
; position (where it fell, if the thrower is gone or dead).
return_speed=22.0
; Caught (disappears) within this many meters of the thrower's hands.
catch_radius=0.8
visual="axe"
length=0.8
color=Color(1.0, 0.55, 0.2, 1.0)
spin=1080.0

[projectile_greataxe]

; Hurl (Greataxe): the whole greataxe thrown end over end. Stops at the first
; target (or a guard). Keys are explained in [projectile_javelin] above.
speed=20.0
gravity=4.0
pitch=4.0
; Seconds before it disappears if it hit nothing (20 m/s x 0.75 s = 15 m).
lifetime=0.75
hit_radius=0.5
pierce=0
walls=true
stopped_by_guard=true
release_height=1.4
release_forward=0.3
visual="axe"
; A big axe: longer than the Dual Axes' 0.8.
length=1.4
color=Color(0.7, 0.72, 0.76, 1.0)
spin=720.0
