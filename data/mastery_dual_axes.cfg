; Dual Axes mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.

[tree]

; Branch ids, in display order, and their names.
branches=["berserker", "reaver"]
branch_names=["Berserker", "Reaver"]

[default]

; What a new character starts with (must follow the rules).
nodes=["frenzy", "blood_rush", "crashing_leap", "cleaver", "hamstring", "bloodlust"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["frenzy", "crashing_leap", "hamstring"]

; --- Berserker: fight harder when hurt ---

[node_frenzy]

name="Frenzy"
branch="berserker"
tier=1
kind="active"
cost=1
ability="frenzy"
description="A flurry of four quick chops. Each one can hit."

[node_blood_rush]

name="Blood Rush"
branch="berserker"
tier=1
kind="passive"
cost=1
effect="low_health_damage"
amount=0.25
; Fraction of max health.
threshold=0.5
description="Deal 25% more damage while below half health."

[node_savage_chops]

name="Savage Chops"
branch="berserker"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="frenzy"
amount=0.2
description="Frenzy deals 20% more damage."

[node_battle_hunger]

name="Battle Hunger"
branch="berserker"
tier=2
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_relentless]

name="Relentless"
branch="berserker"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your attacks deal 5% more damage."

[node_last_stand]

name="Last Stand"
branch="berserker"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): once per fight, dropping below 20% health grants heavy lifesteal."

; --- Reaver: cleave ---

[node_crashing_leap]

name="Crashing Leap"
branch="reaver"
tier=1
kind="active"
cost=1
ability="crashing_leap"
description="Leap forward and slam the ground, hitting everything around the landing."

[node_cleaver]

name="Cleaver"
branch="reaver"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.1
description="Heavy attacks deal 10% more damage."

[node_earthsplitter]

name="Earthsplitter"
branch="reaver"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="crashing_leap"
amount=0.3
description="Crashing Leap deals 30% more damage."

[node_reaping_edge]

name="Reaping Edge"
branch="reaver"
tier=2
kind="passive"
cost=1
effect="damage"
applies_to="abilities"
amount=0.1
description="Abilities deal 10% more damage."

[node_rending_force]

name="Rending Force"
branch="reaver"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Abilities deal a further 10% more damage."

[node_spreading_wounds]

name="Spreading Wounds"
branch="reaver"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): bleeds spread to nearby enemies when the target dies."

; --- Status abilities ---

[node_hamstring]

name="Hamstring"
branch="berserker"
tier=2
kind="active"
cost=1
ability="hamstring"
description="A quick low chop that slows the target for 3 seconds."

[node_bloodlust]

name="Bloodlust"
branch="reaver"
tier=2
kind="active"
cost=1
ability="bloodlust"
description="A war cry: your next 4 hits within 8 seconds each apply a stack of Bleed."
