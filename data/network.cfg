; Network tuning. Restart the server and clients after editing.

[server]

; UDP port the dedicated server listens on.
port=24565
max_players=50
; World snapshots sent to each client per second. Must divide 60 evenly-ish
; (60 physics ticks per second); 20 means one snapshot every 3 ticks.
snapshot_rate=20
; Inputs a player may have queued on the server. Extra (oldest) inputs are dropped.
max_input_buffer=8
; Inputs simulated per player per server tick. 2 lets the server catch up after
; network jitter without letting a client move faster by flooding inputs.
max_inputs_per_tick=2
; Seconds a new connection has to say which code version it runs (VersionCheck)
; before it's disconnected. A build from before the check never says, so it gets
; "Disconnected from server." after this long.
version_timeout=10.0

[client]

; Address the connect screen starts with. Accepts "host" or "host:port".
default_address="127.0.0.1"
; Seconds to wait for the server before giving up.
connect_timeout=5.0
; How far in the past other players are drawn, in seconds. Higher is smoother
; on bad connections, lower is more up to date.
interpolation_delay=0.1
; How many of the latest unacknowledged inputs are sent in every input packet,
; so a single lost packet doesn't lose an input.
input_redundancy=3
; Seconds the local player's model and camera take to glide to where the
; server says it is after a prediction correction, instead of snapping (95% of
; the way by then). 0 = snap. Only the drawing moves; the sim position is exact.
correction_smoothing=0.12
; Meters: a correction moving the player further than this snaps (a respawn,
; a server teleport).
correction_snap_distance=1.0

[lag_compensation]

; Each client draws everyone else in the past (interpolation_delay plus the trip
; from the server). With this on, the server tests a player's melee and beam hits
; against where the targets stood on the tick that player's screen showed, so
; what you see hit is what hits. Blocks, parries and dodges still use the
; target's own, current state. Projectiles aren't rewound (they fly on the server).
enabled=true
; The furthest back (seconds) a hit is tested. Covers a ~250 ms round trip plus
; interpolation_delay; anyone laggier gets their hits tested at that limit.
max_rewind=0.35
; Meters a body moving in one tick counts as a teleport (a respawn, Blink,
; Shadow Swap): hits are never tested where someone stood before one.
teleport_distance=1.5
