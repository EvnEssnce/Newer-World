; Network tuning. Restart the server and clients after editing.

[server]

; UDP port the dedicated server listens on.
port=24565
max_players=50
; World snapshots sent to each client per second. Must divide 60 evenly-ish
; (60 physics ticks per second); 20 means one snapshot every 3 ticks.
snapshot_rate=20
; Inputs a player may have queued on the server. Extra (oldest) inputs are dropped.
max_input_buffer=8
; Inputs simulated per player per server tick. 2 lets the server catch up after
; network jitter without letting a client move faster by flooding inputs.
max_inputs_per_tick=2

[client]

; Address the connect screen starts with. Accepts "host" or "host:port".
default_address="127.0.0.1"
; Seconds to wait for the server before giving up.
connect_timeout=5.0
; How far in the past other players are drawn, in seconds. Higher is smoother
; on bad connections, lower is more up to date.
interpolation_delay=0.1
; How many of the latest unacknowledged inputs are sent in every input packet,
; so a single lost packet doesn't lose an input.
input_redundancy=3
