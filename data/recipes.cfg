; Crafting recipes (RecipeDefs, World/Crafting). The server decides every craft:
; it checks you're at a station of the recipe's kind (data/stations.cfg), have
; the materials, the tradeskill level and room in your bag for the output, then
; runs the walk-only lock (like gathering) and only then takes the materials and
; gives the output. Nothing is taken if a craft fails or is interrupted.
; Restart the server and clients after editing (the server's values win).

[crafting]

; Most items one Craft press can queue (whole crafts; the panel's "Max" button
; never goes above it). A batch is one long lock: craft_time * quantity.
max_batch=50
; Extra meters the server allows past a station's range, both to start and to
; keep crafting: the server's copy of you trails your screen by your ping.
range_tolerance=0.75

; --- Recipes: one [recipe_<id>] each (the id is what the client asks for) ---
; name: shown in the crafting panel ("" = the output item's name).
; tradeskill: the skill it needs and levels (data/tradeskills.cfg; refining
;   recipes use smelting, timbercraft or spinning).
; level: the tradeskill level needed to craft it (1 = anyone).
; station: the station kind that crafts it (a [station_<kind>] of data/stations.cfg).
; craft_time: seconds one craft takes (the walk-only lock; a batch of N takes N times as long).
; xp: tradeskill XP per craft (XP points; a batch of N gives N times this).
; inputs: item id -> how many one craft uses (whole items, from your bag's stacks).
; output_kind: "item" = a fixed item (resources: output x output_count per
;   craft). "gear" = a gear item rolled through the loot roller (gear score
;   from the skill level, a rarity chance): Milestone 3 item 4, not built yet,
;   so validation refuses it for now.
; output: the item id it makes (data/items.cfg).
; output_count: how many one craft makes (whole items; "item" recipes only).

; --- Refining (forge) ---

[recipe_rustvein_ingot]
name=""
tradeskill="smelting"
level=1
station="forge"
craft_time=2.0
xp=30
inputs={"rustvein_ore": 3}
output_kind="item"
output="rustvein_ingot"
output_count=1

