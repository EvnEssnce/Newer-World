; Mage Wing tree. Server and clients both read this file. Same node keys as the
; weapon trees (explained in data/mastery_broadsword.cfg) and the same tier
; gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_mage.cfg for the Z and C slots. Respecs are free. Effects as in
; data/mastery_wings_fighter.cfg, plus (server):
;   aura_refund   the Wing ability `applies_to` (Phoenix Aura) cuts what's left
;                 of your weapon ability cooldowns by amount (fraction)
;   bind_silence  the zone `applies_to` (Binding Embers) also gives `status`

[tree]

; Branch ids, in display order, and their names.
branches=["ascendant", "binder"]
branch_names=["Ascendant", "Binder"]
; Points this tree can spend (a flat budget, like the other Wing trees).
points=12

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["phoenix_aura", "wingfall", "binding_embers", "searing_glare"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["phoenix_aura", "binding_embers"]

; --- Ascendant: spell power ---

[node_phoenix_aura]

name="Phoenix Aura"
branch="ascendant"
tier=1
kind="active"
cost=1
ability="phoenix_aura"
description="Your spells deal 20% more damage and heal 20% more for 6 s. Costs 25 Ember."

[node_wingfall]

name="Wingfall"
branch="ascendant"
tier=1
kind="active"
cost=1
ability="wingfall"
description="Push everything in a wide arc in front of you 4 m back. Costs 20 Ember."

[node_radiance]

name="Radiance"
branch="ascendant"
tier=2
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your attacks deal 5% more damage."

[node_ember_soul]

name="Ember Soul"
branch="ascendant"
tier=3
kind="passive"
cost=2
effect="damage_taken"
amount=-0.06
description="Take 6% less damage."

[node_rekindle]

name="Rekindle"
branch="ascendant"
tier=4
kind="passive"
cost=2
effect="aura_refund"
applies_to="phoenix_aura"
amount=0.5
description="Capstone: Phoenix Aura also halves what's left of your ability cooldowns."

; --- Binder: lockdown ---

[node_binding_embers]

name="Binding Embers"
branch="binder"
tier=1
kind="active"
cost=1
ability="binding_embers"
description="Root everything in a circle 8 m ahead for 2 s. Costs 25 Ember."

[node_searing_glare]

name="Searing Glare"
branch="binder"
tier=1
kind="active"
cost=1
ability="searing_glare"
description="Silence the targets in a 10 m line for 3 s (no abilities). Costs 20 Ember."

[node_tight_bonds]

name="Tight Bonds"
branch="binder"
tier=2
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_warden_flame]

name="Warden Flame"
branch="binder"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.08
description="Abilities deal 8% more damage."

[node_hushing_embers]

name="Hushing Embers"
branch="binder"
tier=4
kind="passive"
cost=2
effect="bind_silence"
applies_to="binding_embers"
status="silenced"
description="Capstone: Binding Embers also silence."
