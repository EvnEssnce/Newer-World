; Dual Axes, a Fighter weapon: fast and aggressive, weak defense. The server and
; the client's own prediction both read this file: restart the server AND
; clients after editing. Times are in seconds and are rounded to physics ticks
; (60 per second). See data/weapon_broadsword.cfg for what every key means.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Dual Axes"
; Placeholder model to draw: "sword_shield" or "dual_axes" (cosmetic only).
model="dual_axes"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; Above 1.0: no shield, so guarding with two axes is costly.
block_stamina_multiplier=1.6
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["frenzy", "crashing_leap", "bloodlust", "hamstring", "boomerang_axe", "rampage"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; Faster and weaker than the Broadsword's light attack.
damage=55.0
; Seconds the target is staggered. 0 = no stagger.
stagger=0.0
; Stamina a blocking target loses when this attack hits their guard.
block_stamina_damage=15.0
; true = always breaks a block.
breaks_block=false
windup=0.1
active=0.1
recovery=0.2
; Movement speed while attacking, as a fraction of normal speed.
move_multiplier=0.55
; Box hitbox: meters forward, wide, and tall from the feet.
range=1.6
width=1.6
height=2.0

[heavy]

damage=160.0
stagger=0.35
block_stamina_damage=35.0
breaks_block=true
windup=0.3
active=0.12
recovery=0.4
move_multiplier=0.25
range=1.8
width=1.8
height=2.2
; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---

[ability_frenzy]

; Four quick chops. Each chop is its own hit window, so a target can be hit by
; every one of them.
name="Frenzy"
cooldown=7.0
; Damage per chop.
damage=45.0
stagger=0.0
block_stamina_damage=15.0
breaks_block=false
windup=0.1
; Seconds each chop's hitbox is live.
active=0.08
recovery=0.3
; Number of chops, and seconds from the start of one chop to the next.
windows=4
window_interval=0.16
move_multiplier=0.5
turn_speed=540.0
shape="box"
range=1.7
width=1.6
height=2.0

[ability_crashing_leap]

; Leaps forward during the windup (shorter the higher you look), then slams
; the ground around the landing spot.
name="Crashing Leap"
cooldown=10.0
damage=140.0
stagger=0.5
block_stamina_damage=40.0
breaks_block=false
windup=0.5
active=0.12
recovery=0.45
move_multiplier=0.0
turn_speed=0.0
shape="radial"
; Slam radius around you, meters.
range=2.5
width=0.0
height=2.0
; Leap: meters forward, between dash_start and dash_end (seconds). With the
; 2.5 m slam radius it lands on targets from about 1 m to 7 m ahead.
dash_distance=4.0
dash_start=0.05
dash_end=0.5
; Aimed by the camera's pitch as it starts: looking at or below aim_full_pitch
; leaps the full dash_distance, at or above aim_zero_pitch straight up (0 m),
; shorter in between. Degrees, up = positive; level = 0. data/camera.cfg's
; max_pitch is how far up the camera can look.
dash_aim_pitch=true
aim_full_pitch=0.0
aim_zero_pitch=35.0
; Peak height of the leap, meters. Cosmetic only (the body itself stays on its
; ground path).
leap_height=1.5

; --- Status abilities ---
; Status keys (applies_status, status_stacks, status_duration, self_status,
; self_status_stacks) are explained at the end of data/weapon_broadsword.cfg.

[ability_bloodlust]

; A war cry: no hit of its own. Your next hits (self_status_stacks of them,
; within the buff's duration) each apply a stack of bleed.
name="Bloodlust"
cooldown=14.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.15
move_multiplier=0.6
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="bloodlust"
; Hits charged: each damaging hit uses one (capped by the status's max_stacks).
self_status_stacks=4

[ability_hamstring]

; A quick low chop that slows the target.
name="Hamstring"
cooldown=9.0
damage=60.0
stagger=0.0
block_stamina_damage=15.0
breaks_block=false
windup=0.15
active=0.12
recovery=0.3
move_multiplier=0.5
turn_speed=720.0
shape="box"
range=1.7
width=1.6
height=2.0
applies_status="slow"
status_stacks=1
; Seconds the slow lasts (instead of the status's own duration).
status_duration=3.0

; --- Projectile abilities ---
; projectile / projectile_time are explained at the end of data/weapon_spear.cfg.

[ability_boomerang_axe]

; Throws one axe that flies out and comes back: it hits on the way out and
; again on the way back (each target once per leg). Its range and return are
; [projectile_boomerang_axe] in data/projectiles.cfg.
name="Boomerang Axe"
cooldown=8.0
; Damage per hit (out and back are separate hits).
damage=65.0
stagger=0.0
block_stamina_damage=15.0
breaks_block=false
windup=0.2
active=0.05
recovery=0.3
move_multiplier=0.5
turn_speed=540.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="boomerang_axe"
projectile_time=0.18

[ability_rampage]

; A battle roar: no hit of its own. Gives you Rampage (data/status_effects.cfg):
; faster light and heavy attacks while your stamina is at least half.
name="Rampage"
cooldown=18.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.15
move_multiplier=0.6
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="rampage"
