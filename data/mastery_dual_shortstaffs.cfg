; Dual Shortstaffs mastery tree. Server and clients both read this file. Rules
; (point budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (server):
;   hit_pulse_heal  every `count`-th of your attacks with this weapon that
;                   connects heals you and allies within `threshold` m by amount
;   parry_heal      a successful parry with this weapon heals you and your
;                   nearest ally (within 15 m) by amount

[tree]

; Branch ids, in display order, and their names.
branches=["devotion", "discipline"]
branch_names=["Devotion", "Discipline"]

[default]

; What a new character starts with (must follow the rules).
nodes=["consecrating_strikes", "healing_hands", "uplifting_blow", "rush_to_aid", "twin_guard", "steady_staves", "spinning_staves", "rebuke"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["consecrating_strikes", "uplifting_blow", "twin_guard"]

; --- Devotion: healing through hits ---

[node_consecrating_strikes]

name="Consecrating Strikes"
branch="devotion"
tier=1
kind="active"
cost=1
ability="consecrating_strikes"
description="For 6 s your hits heal you and allies within 6 m."

[node_healing_hands]

name="Healing Hands"
branch="devotion"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light strikes deal 10% more damage."

[node_uplifting_blow]

name="Uplifting Blow"
branch="devotion"
tier=2
kind="active"
cost=1
ability="uplifting_blow"
description="A strike that heals the lowest-health ally within 10 m for 80."

[node_rush_to_aid]

name="Rush to Aid"
branch="devotion"
tier=2
kind="active"
cost=1
ability="rush_to_aid"
description="Dash 7 m and shield everyone on your side around you."

[node_faithful]

name="Faithful"
branch="devotion"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Shortstaff abilities deal (and heal) 10% more."

[node_zealous]

name="Zealous"
branch="devotion"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your Shortstaff attacks deal 5% more damage."

[node_radiant_rhythm]

name="Radiant Rhythm"
branch="devotion"
tier=4
kind="passive"
cost=2
effect="hit_pulse_heal"
; Every count-th attack that connects.
count=4
amount=50
; Meters around you.
threshold=6.0
description="Capstone: every 4th attack that connects pulses a 50 heal on you and allies within 6 m."

; --- Discipline: parries and defense ---

[node_twin_guard]

name="Twin Guard"
branch="discipline"
tier=1
kind="active"
cost=1
ability="twin_guard"
description="A parry stance: a frontal hit is negated and answered with a counter."

[node_steady_staves]

name="Steady Staves"
branch="discipline"
tier=1
kind="passive"
cost=1
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina with the shortstaffs out."

[node_spinning_staves]

name="Spinning Staves"
branch="discipline"
tier=2
kind="active"
cost=1
ability="spinning_staves"
description="Spin, hitting everything around you three times and deflecting projectiles."

[node_rebuke]

name="Rebuke"
branch="discipline"
tier=2
kind="active"
cost=1
ability="rebuke"
description="A sharp strike that staggers for 0.8 s."

[node_counterweight]

name="Counterweight"
branch="discipline"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="twin_guard_counter"
amount=0.3
description="Twin Guard's counter deals 30% more damage."

[node_iron_discipline]

name="Iron Discipline"
branch="discipline"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="heavy"
amount=0.15
description="Heavy strikes deal 15% more damage."

[node_guarded_grace]

name="Guarded Grace"
branch="discipline"
tier=4
kind="passive"
cost=2
effect="parry_heal"
amount=120
description="Capstone: a successful parry heals you and your nearest ally for 120."
