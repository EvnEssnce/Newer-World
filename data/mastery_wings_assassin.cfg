; Assassin Wing tree. Server and clients both read this file. Same node keys
; as the weapon trees (explained in data/mastery_broadsword.cfg) and the same
; tier gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_assassin.cfg for the Z and C slots. Respecs are free. Effects as
; in data/mastery_wings_fighter.cfg, plus:
;   decoy_burst  (server) your decoy bursts as it ends: `amount` damage and
;                `status` to every hostile within `threshold` m
;   extra_charge (sim, through the server) the Wing ability `applies_to` (or "roll")
;                gets a second charge

[tree]

; Branch ids, in display order, and their names.
branches=["phantom", "trickster"]
branch_names=["Phantom", "Trickster"]
; Most points this tree can spend (like the Fighter's). Shadow Swap
; (Trickster tier 3: 10 points) and Second Step (the Phantom capstone: 16) don't
; fit together; Shadow Swap and Mirror Image do.
points=24

[default]

; What a new character starts with (must follow the rules): every Wing
; ability learned (Shadow Swap is Trickster tier 3, so Misdirection opens it).
nodes=["ashstep", "ember_soles", "plumage_flash", "sleight", "ember_double", "misdirection", "shadow_swap"]
; Abilities in slots Z and C ("" = empty). Each must be unlocked by `nodes`.
slots=["ashstep", "plumage_flash"]

; --- Phantom: blinks and positioning ---

[node_ashstep]

name="Ashstep"
branch="phantom"
tier=1
kind="active"
cost=2
ability="ashstep"
description="Blink 4.5 m the way you're moving, untouchable while it lasts. Costs 15 Ember."

[node_ember_soles]

name="Ember Soles"
branch="phantom"
tier=1
kind="passive"
cost=2
effect="damage_taken"
amount=-0.05
description="Take 5% less damage."

[node_slipstream]

name="Slipstream"
branch="phantom"
tier=2
kind="passive"
cost=4
effect="damage"
applies_to="all"
amount=0.05
description="All your attacks deal 5% more damage."

[node_phantom_edge]

name="Phantom Edge"
branch="phantom"
tier=2
kind="passive"
cost=4
effect="damage"
applies_to="abilities"
amount=0.08
description="Abilities deal 8% more damage."

[node_shade]

name="Shade"
branch="phantom"
tier=3
kind="passive"
cost=4
effect="damage_taken"
amount=-0.08
description="Take 8% less damage."

[node_second_step]

name="Second Step"
branch="phantom"
tier=4
kind="passive"
cost=4
requires=["ashstep"]
effect="extra_charge"
applies_to="ashstep"
description="Capstone: Ashstep gets a second charge."

; --- Trickster: decoys and confusion ---

[node_plumage_flash]

name="Plumage Flash"
branch="trickster"
tier=1
kind="active"
cost=2
ability="plumage_flash"
description="A cone of burning feathers 6 m ahead: Dazzled (25% less damage dealt) and Slowed. Costs 20 Ember."

[node_sleight]

name="Sleight of Hand"
branch="trickster"
tier=1
kind="passive"
cost=2
effect="damage"
applies_to="light"
amount=0.08
description="Light attacks deal 8% more damage."

[node_misdirection]

name="Misdirection"
branch="trickster"
tier=2
kind="passive"
cost=4
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_ember_double]

name="Ember Double"
branch="trickster"
tier=2
kind="active"
cost=2
ability="ember_double"
description="Leave a burning decoy: enemies attack it instead of you for 4 s, and you're hard to see. Costs 20 Ember."

[node_shadow_swap]

name="Shadow Swap"
branch="trickster"
tier=3
kind="active"
cost=2
; Swaps with your decoy, so it needs Ember Double.
requires=["ember_double"]
ability="shadow_swap"
description="Trade places with your Ember Double (only while it's out). Costs 15 Ember."

[node_mirror_image]

name="Mirror Image"
branch="trickster"
tier=4
kind="passive"
cost=4
requires=["ember_double"]
effect="decoy_burst"
; Damage, radius (m) and status of the burst.
amount=80
threshold=3.0
status="dazzled"
description="Capstone: when your Ember Double ends it bursts, dealing 80 damage and Dazzling everything within 3 m."
