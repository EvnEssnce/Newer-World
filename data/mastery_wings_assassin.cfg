; Assassin Wing tree. Server and clients both read this file. Same node keys
; as the weapon trees (explained in data/mastery_broadsword.cfg) and the same
; tier gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_assassin.cfg for the Z and C slots. Respecs are free. Effects as
; in data/mastery_wings_fighter.cfg. Both capstones wait on systems that
; aren't built yet (charges, decoys), so they do nothing yet.

[tree]

; Branch ids, in display order, and their names.
branches=["phantom", "trickster"]
branch_names=["Phantom", "Trickster"]
; Points this tree can spend (a flat budget, like the Fighter's).
points=12

[default]

; What a new character starts with (must follow the rules): both Wing
; abilities learned.
nodes=["ashstep", "ember_soles", "plumage_flash", "sleight"]
; Abilities in slots Z and C ("" = empty). Each must be unlocked by `nodes`.
slots=["ashstep", "plumage_flash"]

; --- Phantom: blinks and positioning ---

[node_ashstep]

name="Ashstep"
branch="phantom"
tier=1
kind="active"
cost=1
ability="ashstep"
description="Blink 4.5 m the way you're moving, untouchable while it lasts. Costs 15 Ember."

[node_ember_soles]

name="Ember Soles"
branch="phantom"
tier=1
kind="passive"
cost=1
effect="damage_taken"
amount=-0.05
description="Take 5% less damage."

[node_slipstream]

name="Slipstream"
branch="phantom"
tier=2
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your attacks deal 5% more damage."

[node_shade]

name="Shade"
branch="phantom"
tier=3
kind="passive"
cost=2
effect="damage_taken"
amount=-0.08
description="Take 8% less damage."

[node_second_step]

name="Second Step"
branch="phantom"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): Ashstep gets a second charge."

; --- Trickster: decoys and confusion ---

[node_plumage_flash]

name="Plumage Flash"
branch="trickster"
tier=1
kind="active"
cost=1
ability="plumage_flash"
description="A cone of burning feathers 6 m ahead: Dazzled (25% less damage dealt) and Slowed. Costs 20 Ember."

[node_sleight]

name="Sleight of Hand"
branch="trickster"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.08
description="Light attacks deal 8% more damage."

[node_misdirection]

name="Misdirection"
branch="trickster"
tier=2
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_cruel_tricks]

name="Cruel Tricks"
branch="trickster"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.08
description="Abilities deal 8% more damage."

[node_mirror_image]

name="Mirror Image"
branch="trickster"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): decoys copy your last attack when they're hit."
