; Gauntlet mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (server):
;   overheal_shield  healing you do past a target's max health becomes Ward
;                    (absorb) of amount x the excess
;   siphon_share     your lifesteal heals also reach allies within `threshold` m

[tree]

; Branch ids, in display order, and their names.
branches=["lifeweaver", "siphon"]
branch_names=["Lifeweaver", "Siphon"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["mending_beam", "gentle_hands", "ward", "renewal_pulse", "siphon", "hungering_grasp", "withering_touch", "life_spore"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["mending_beam", "siphon", "ward"]

; --- Lifeweaver: heals and shields ---

[node_mending_beam]

name="Mending Beam"
branch="lifeweaver"
tier=1
kind="active"
cost=1
ability="mending_beam"
description="A channeled beam that heals the allies it touches: 30 per pulse."

[node_gentle_hands]

name="Gentle Hands"
branch="lifeweaver"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="mending_beam"
amount=0.2
description="Mending Beam heals 20% more."

[node_ward]

name="Ward"
branch="lifeweaver"
tier=2
kind="active"
cost=1
ability="ward"
description="Shield yourself and allies in front of you: absorbs 150 damage."

[node_renewal_pulse]

name="Renewal Pulse"
branch="lifeweaver"
tier=2
kind="active"
cost=1
ability="renewal_pulse"
description="Heal everyone on your side in a circle 6 m ahead for 160."

[node_lifebloom]

name="Lifebloom"
branch="lifeweaver"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Gauntlet abilities heal and deal 10% more."

[node_steadfast_grip]

name="Steadfast Grip"
branch="lifeweaver"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina while the gauntlet is out."

[node_overflowing_life]

name="Overflowing Life"
branch="lifeweaver"
tier=4
kind="passive"
cost=2
effect="overheal_shield"
amount=1.0
description="Capstone: healing past full health becomes a Ward shield."

; --- Siphon: damage that heals ---

[node_siphon]

name="Siphon"
branch="siphon"
tier=1
kind="active"
cost=1
ability="siphon"
description="A channeled drain: half its damage heals you."

[node_hungering_grasp]

name="Hungering Grasp"
branch="siphon"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.15
description="The draining blast (heavy) deals 15% more damage."

[node_withering_touch]

name="Withering Touch"
branch="siphon"
tier=2
kind="active"
cost=1
ability="withering_touch"
description="A close blast that halves the healing its target receives for 5 s."

[node_life_spore]

name="Life Spore"
branch="siphon"
tier=2
kind="active"
cost=1
ability="life_spore"
description="Place an orb that heals the first ally to touch it for 200."

[node_leeching_bolts]

name="Leeching Bolts"
branch="siphon"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="light"
amount=0.1
description="Life bolts deal 10% more damage."

[node_dark_bounty]

name="Dark Bounty"
branch="siphon"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="siphon"
amount=0.2
description="Siphon deals (and drains) 20% more."

[node_shared_vitality]

name="Shared Vitality"
branch="siphon"
tier=4
kind="passive"
cost=2
effect="siphon_share"
; Meters from you.
threshold=8.0
description="Capstone: Siphon's healing also reaches allies within 8 m."
