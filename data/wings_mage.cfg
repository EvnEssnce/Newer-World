recovery=0.25
move_multiplier=0.4
turn_speed=720.0
shape="box"
range=10.0
width=1.5
height=2.0
applies_status="silenced"

[ability_wingfall]

; A sweep of the wings pushes everything in a wide arc in front of you back.
name="Wingfall"
; Ember spent when it starts (Mages have no mana).
ember_cost=20.0
cooldown=12.0
damage=50.0
