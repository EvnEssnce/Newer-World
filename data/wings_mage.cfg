; Mage Wing abilities: magic power and crowd control. Two Wing slots, on Z and C,
; that stay the same when you swap weapons. Which abilities are learned and
; slotted comes from the Wing tree (data/mastery_wings_mage.cfg). The server and
; the client's own prediction both read this file: restart the server AND
; clients after editing. Times are in seconds (60 ticks per second).
;
; Same keys as data/wings_fighter.cfg (ember_cost), the weapon abilities
; (data/weapon_broadsword.cfg) and zones (data/zones.cfg).

[wings]

; Shown in the mastery panel's Wings tab.
name="Mage Wings"
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["phoenix_aura", "binding_embers", "searing_glare", "wingfall"]

[ability_phoenix_aura]

; Your spells deal 20% more damage and heal 20% more for 6 s (Phoenix
; Aura, data/status_effects.cfg). No hit of its own.
name="Phoenix Aura"
; Ember spent when it starts (Mages have no mana).
ember_cost=25.0
cooldown=18.0
damage=0.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.15
move_multiplier=0.7
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="phoenix_aura"

[ability_binding_embers]

; Embers rain on a circle 8 m ahead: everything in it is rooted
; (data/zones.cfg [zone_binding_embers]).
name="Binding Embers"
; Ember spent when it starts (Mages have no mana).
ember_cost=25.0
cooldown=16.0
damage=0.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.25
active=0.05
recovery=0.3
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
; The zone (data/zones.cfg), placed zone_time s after the start, zone_distance m ahead.
zone="binding_embers"
zone_time=0.25
zone_distance=8.0

[ability_searing_glare]

; A searing look down a 10 m line: Silenced (no abilities) for 3 s.
name="Searing Glare"
; Ember spent when it starts (Mages have no mana).
ember_cost=20.0
cooldown=14.0
damage=40.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.2
