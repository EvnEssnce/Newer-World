; When the server saves characters to the database (World/Saves, SaveService).
; A save holds a character's build (weapons, mastery and Wing trees, slots),
; bag, equipped gear and tradeskills. Characters are also saved the moment they
; disconnect and when the server shuts down (--quit-after or closing it).
; Restart the server after editing.

[save]

; Seconds between saves of everyone online (one transaction for all of them).
; What a server crash can lose at most. 0 = no periodic save.
interval=60.0
; Seconds from a character's first unsaved change (a respec, equip, pickup,
; discard, gather or craft) to its save; changes in between go in the same
; write. 0 = save on the next tick after any change.
after_change=3.0
