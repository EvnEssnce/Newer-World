; Party tuning. The server enforces all of it; clients only use invite_range to
; pick who the invite key targets. Restart the server and clients after editing.

[party]

; Most players in one party, leader included. Pending invites count toward it.
max_size=5
; Seconds an invite waits for an answer before it expires.
invite_expiry=30.0
; Metres: the player you invite must be at most this far from you when you send
; the invite (checked by the server against its own positions).
invite_range=20.0
