; Words character and account names can't contain (AccountRules.blocked_name).
; The server decides; clients use it only to explain a refusal sooner. Restart
; the server after editing. A refused name only says "That name isn't allowed."
;
; How a name is checked: lower-cased; look-alike digits and symbols read as
; letters (0 o, 1 i, 3 e, 4 a, 5 s, 7 t, 8 b, 9 g, @ a, $ s, ! i); everything
; that isn't a letter dropped; the allowed words below cut out. Then it's refused
; if it contains a `contains` word (also with repeated letters squeezed, for
; words still 4 letters or more once squeezed: "fuuuck"), or is exactly a
; `whole` word.
; Words: lower case, letters only.

[filter]

; Refused anywhere in a name.
contains=["fuck", "fck", "phuck", "shit", "cunt", "bitch", "biatch", "whore", "slut", "dick", "cock", "pussy", "penis", "vagina", "asshole", "arsehole", "bastard", "nigger", "nigga", "niggr", "faggot", "fagot", "retard", "rape", "rapist", "nazi", "hitler", "porn", "wank", "twat", "jizz", "dildo", "tranny", "kike", "beaner", "wetback", "dyke", "molest", "pedophile", "paedo", "boob", "titty", "titties", "piss", "killyourself", "kys", "testicle", "scrotum", "blowjob", "handjob", "anal", "orgasm", "sexy", "horny", "cocaine", "heroin", "meth", "kkk", "jihad", "genocide", "holocaust"]
; Refused only as the whole name (short words that hide inside ordinary ones).
whole=["isis", "ass", "arse", "anus", "cum", "tit", "tits", "fag", "gook", "coon", "spic", "chink", "paki", "homo", "pedo", "semen", "hoe", "sex", "poop", "butt", "nut", "nuts", "balls"]
; Ordinary words that contain a `contains` word; cut out of a name before it's
; checked ("Peacock", "Dickens", "Therapist", "Grapevine").
allowed=["annal", "heroine", "peacock", "hancock", "babcock", "woodcock", "cockatoo", "cockatiel", "dickens", "benedick", "therapist", "grape", "drape", "scrape", "rapeseed", "canal", "banal", "analog", "analys", "method", "methane", "methyl", "something", "shitake", "shiitake", "sussex", "essex", "middlesex", "documentary", "cumulus", "cumber"]
