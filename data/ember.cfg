; Ember (the phoenix resource, every class) and Rebirth. The server and the
; client's own prediction both read this file: restart the server AND clients
; after editing. Times are in seconds and are rounded to physics ticks (60 per
; second).
;
; Ember is a 0..cap meter. Out of combat it settles toward its resting level
; (refills if below, drains if above), so every fight starts at the resting
; level. The server adds Ember for damage dealt, damage taken and healing; Wing
; abilities spend it (their ember_cost, data/wings_<class>.cfg). Dying with
; enough Ember and Rebirth off cooldown starts a Rebirth instead of the
; respawn timer.

[ember]

; Most Ember you can hold. Progression upgrades will raise it later
; (PlayerState.ember_cap is the one place that reads it).
cap=100.0
; Out of combat, Ember settles toward this level. Also what you spawn and
; respawn with.
resting=50.0
; Ember per second it moves toward the resting level while out of combat.
settle_per_second=4.0
; Seconds after last dealing or taking damage that you still count as in
; combat (no settling while in combat).
combat_time=6.0
; Ember gained per point of damage you deal (hits and damage over time).
; A 75-damage light attack gives 6.
per_damage_dealt=0.08
; Ember gained per point of damage you take (after reductions).
per_damage_taken=0.05
; Ember gained per point of health healed, by whoever did the healing.
per_heal=0.05

[rebirth]

; Dying with at least this much Ember (and Rebirth off cooldown) starts a
; Rebirth instead of the respawn timer.
threshold=50.0
; Ember a Rebirth spends.
cost=50.0
; Seconds the rebirth takes before you rise again where you fell.
duration=5.0
; Health you come back with, as a fraction of max health.
health_fraction=0.3
; Seconds before you can Rebirth again (starts when you rise).
cooldown=300.0
