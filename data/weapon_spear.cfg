; Spear, a Fighter weapon: reach and control. Fights at the end of its range
; and pushes enemies back out of it. The server and the client's own prediction
; both read this file: restart the server AND clients after editing. Times are
; in seconds and are rounded to physics ticks (60 per second). See
; data/weapon_broadsword.cfg for what every key means (including the force_*
; keys for knockback).

[weapon]

; Shown on the HUD and in the mastery panel.
name="Spear"
; Placeholder model to draw: "sword_shield", "dual_axes" or "spear" (cosmetic only).
model="spear"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; Above 1.0: no shield, but the long haft guards better than two axes.
block_stamina_multiplier=1.3
; Ability pool, in order.
abilities=["lunge", "low_sweep", "vault", "javelin_cast", "skewer", "perforate", "line_poke"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A quick thrust: much longer and narrower than the Broadsword's swing.
damage=75.0
stagger=0.0
block_stamina_damage=18.0
breaks_block=false
windup=0.18
active=0.12
recovery=0.35
move_multiplier=0.4
; Meters forward from your center, meters wide, meters tall.
range=2.8
width=0.8
height=2.0

[heavy]

; A two-handed driving thrust with the longest reach.
damage=190.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=true
windup=0.45
active=0.15
recovery=0.55
move_multiplier=0.15
range=3.2
; Same width as the light thrust.
width=0.8
height=2.2
; Meters the thrust drives the target back (keeps it at the end of your
; reach). 0 = no push.
force_direction="away"
force_distance=0.0
force_duration=0.2

; --- Abilities ---

[ability_lunge]

; Dashes forward, then thrusts at the end of the dash.
name="Lunge"
cooldown=9.0
damage=140.0
stagger=0.3
block_stamina_damage=30.0
breaks_block=false
; The thrust comes as the dash ends (the dash runs during the windup).
windup=0.25
active=0.15
recovery=0.4
move_multiplier=0.2
turn_speed=0.0
shape="box"
range=3.0
width=1.0
height=2.0
; Meters dashed forward, between these seconds from the start.
dash_distance=4.5
dash_start=0.05
dash_end=0.3
; Meters the thrust drives what it hits back. 0 = no push.
force_direction="away"
force_distance=0.0
force_duration=0.2

[ability_low_sweep]

; A wide, low sweep in front of you that knocks everything it hits back and
; down.
name="Low Sweep"
cooldown=10.0
damage=100.0
; Knocked down (staggered) this long; overlaps the knockback.
stagger=0.5
block_stamina_damage=30.0
breaks_block=false
windup=0.3
active=0.2
recovery=0.45
move_multiplier=0.2
turn_speed=180.0
shape="box"
; Hitbox: 3 m forward, 4 m wide (a wide arc in front), only 1 m tall (low).
range=3.0
width=4.0
height=1.0
; Knocked back 3 m away from you over 0.35 s.
force_direction="away"
force_distance=3.0
force_duration=0.35
; Also launched this high, meters (0 = stays on the ground).
force_height=0.0

[ability_vault]

; Plants the spear and vaults the way you're moving (backward with no movement
; input), evading hits on the way. No hitbox.
name="Vault"
cooldown=8.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.35
recovery=0.2
move_multiplier=0.3
turn_speed=0.0
shape="none"
range=0.0
width=0.0
height=0.0
; Meters moved between these seconds from the start. dash_direction: "input" =
; the way your movement keys point when it starts (backward with none), "back" =
; away from where you face; leave it out for forward.
dash_distance=5.0
dash_direction="input"
dash_start=0.05
dash_end=0.4
; I-frames (hits can't land, like a dodge's), seconds from the start.
iframe_start=0.05
iframe_end=0.4
; Peak height of the vault, meters. Cosmetic only (the body doesn't rise).
leap_height=1.6

; --- Projectile abilities ---
; projectile: an id from data/projectiles.cfg (speed, gravity, range, pierce,
; look). projectile_time: seconds from the start when it's released (inside the
; windup/active timeline). Optional projectile_count (how many, default 1) and
; projectile_spread (degrees the fan covers when more than one). The damage,
; stagger, block and status keys are what its hit does; shape="none" because
; the throw itself has no melee hitbox.

[ability_javelin_cast]

; Throws a conjured, feather-styled spear that slows what it hits.
name="Javelin Cast"
cooldown=9.0
damage=110.0
stagger=0.0
block_stamina_damage=25.0
breaks_block=false
windup=0.3
active=0.05
recovery=0.35
move_multiplier=0.3
turn_speed=540.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="javelin"
projectile_time=0.28
applies_status="slow"
status_stacks=1
; Seconds the slow lasts (instead of the status's own duration).
status_duration=3.0

; --- Status abilities ---
; Status keys (applies_status, status_stacks, status_duration) are explained at
; the end of data/weapon_broadsword.cfg.

[ability_skewer]

; A hard, narrow thrust that pins the target in place (root): it can still
; attack, block and turn, but can't walk, dodge, jump or dash.
name="Skewer"
cooldown=12.0
damage=90.0
stagger=0.0
block_stamina_damage=25.0
breaks_block=false
windup=0.3
active=0.12
recovery=0.4
move_multiplier=0.2
turn_speed=540.0
shape="box"
range=3.0
width=0.7
height=2.0
applies_status="root"
status_stacks=1
; Seconds the root lasts (instead of the status's own duration).
status_duration=1.5

[ability_perforate]

; A burst of quick thrusts. Each thrust is its own hit window and adds a
; stack of bleed to what it hits (bleed's duration and stack cap are in
; data/status_effects.cfg).
name="Perforate"
cooldown=11.0
; Damage per thrust.
damage=30.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.15
; Seconds each thrust's hitbox is live.
active=0.07
recovery=0.35
; Number of thrusts, and seconds from the start of one thrust to the next.
windows=5
window_interval=0.13
move_multiplier=0.3
turn_speed=540.0
shape="box"
range=2.8
width=0.9
height=2.0
applies_status="bleed"
status_stacks=1

[ability_line_poke]

; Hold the Line (Lancer capstone, data/mastery_spear.cfg): while you hold
; block with the Spear out, a hostile player or enemy that steps into this box
; in front of you is poked and slowed (server only, no animation of its own).
; It's not on your attack timeline: the phase times below are unused.
; Blocks, i-frames and allies work as for any hit.
name="Line Poke"
internal=true
; Seconds before the same target can be poked again (per target, not a normal
; cooldown).
cooldown=2.0
damage=40.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.0
active=0.1
recovery=0.0
move_multiplier=1.0
turn_speed=0.0
shape="box"
; The reach that triggers it: meters in front, wide, tall.
range=2.6
width=1.4
height=2.0
applies_status="slow"
status_stacks=1
; Seconds the slow lasts (instead of the status's own duration).
status_duration=2.0
