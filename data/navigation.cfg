; Enemy navigation: the walkable area the server bakes from the map's static
; geometry (ground, crates) when it starts, and bakes again in the background
; whenever a wall that blocks enemies (Shield Wall) goes up or comes down.
; Server only: editing this file needs a server restart. Per-enemy path
; following is in data/enemy_<kind>.cfg [navigation]. Distances in meters.

[navmesh]

; How far the walkable area stays from walls and crate sides: at least the
; enemy's body radius (0.5), plus a little so it doesn't scrape corners.
; Rounded up to whole cells of the navigation map (0.25 m): 0.6 would act as 0.75.
agent_radius=0.75
; Height an enemy needs to walk under something (rounded up to 0.25 m cells).
agent_height=2.0
; Highest step it can walk up (rounded down to 0.25 m cells). Crates (2 m) and
; walls are never climbable.
agent_max_climb=0.25
; Steepest slope it can walk, in degrees.
agent_max_slope=45.0
; A wall that blocks enemies is cut out of the walkable area this much bigger
; than its box on every side (meters), on top of agent_radius.
wall_padding=0.0

[enemies]

; An enemy that falls below this height (meters; the ground is at 0) is put
; back at its camp at full health, as if it had respawned (it fell off the map).
fall_reset_height=-20.0
