; Player movement tuning. The server and the client's own prediction both read
; this file, so they must match: restart the server AND clients after editing.

[player]

; Top running speed, meters per second.
move_speed=6.0
; How quickly the player reaches top speed on the ground, m/s^2.
ground_acceleration=60.0
; How quickly the player stops on the ground with no input, m/s^2.
ground_deceleration=50.0
; Steering control while airborne, m/s^2.
air_acceleration=12.0
; Upward speed when jumping, m/s.
jump_velocity=5.5
; Downward acceleration, m/s^2. Higher than real gravity feels snappier.
gravity=18.0
; How fast the character turns to face its movement direction, degrees per second.
turn_speed=720.0
