; Fighter Wing tree. Server and clients both read this file. Same node keys as
; the weapon trees (explained in data/mastery_broadsword.cfg) and the same tier
; gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_fighter.cfg for the Z and C slots. Respecs are free.
;
; Wing-tree effects besides "damage", "low_health_damage" and "block_stamina"
; (all server-side, never in the predicted simulation):
;   damage_taken   amount = fraction more damage taken (-0.05 = 5% less).
;   mantle_heal    while the self-buff of the ability in applies_to is on,
;                  heal amount x the damage that buff prevented.
;   surge_stagger  while the self-buff of the ability in applies_to is on,
;                  your hits stagger for at least amount seconds.

[tree]

; Branch ids, in display order, and their names.
branches=["bulwark", "fury"]
branch_names=["Bulwark", "Fury"]
; Points this tree can spend. There's no character level yet, so this is a
; flat budget (each branch costs 8 to max: max one, dip into the other).
points=12

[default]

; What a new character starts with (must follow the rules): every Wing
; ability learned.
nodes=["ember_mantle", "emberhide", "wingbeat_surge", "searing_wrath", "pyre_heart", "diving_strike"]
; Abilities in slots Z and C ("" = empty). Each must be unlocked by `nodes`.
slots=["ember_mantle", "wingbeat_surge"]

; --- Bulwark: survivability ---

[node_ember_mantle]

name="Ember Mantle"
branch="bulwark"
tier=1
kind="active"
cost=1
ability="ember_mantle"
description="Wings wrap around you: take 40% less damage for 4 seconds. Costs 25 Ember."

[node_emberhide]

name="Emberhide"
branch="bulwark"
tier=1
kind="passive"
cost=1
effect="damage_taken"
amount=-0.05
description="Take 5% less damage."

[node_pyre_heart]

name="Pyre Heart"
branch="bulwark"
tier=2
kind="active"
cost=1
ability="pyre_heart"
description="Burn 30 Ember to heal 200 health over 5 seconds."

[node_steady_wings]

name="Steady Wings"
branch="bulwark"
tier=2
kind="passive"
cost=1
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_phoenix_resolve]

name="Phoenix Resolve"
branch="bulwark"
tier=3
kind="passive"
cost=2
effect="damage_taken"
amount=-0.08
description="Take a further 8% less damage."

[node_mantle_of_renewal]

name="Mantle of Renewal"
branch="bulwark"
tier=4
kind="passive"
cost=2
effect="mantle_heal"
applies_to="ember_mantle"
; Fraction of the damage Ember Mantle prevented that heals you.
amount=0.5
description="Capstone: while Ember Mantle is on, heal for half the damage it prevents."

; --- Fury: raw force ---

[node_wingbeat_surge]

name="Wingbeat Surge"
branch="fury"
tier=1
kind="active"
cost=1
ability="wingbeat_surge"
description="Your attacks deal 20% more damage for 6 seconds. Costs 25 Ember."

[node_searing_wrath]

name="Searing Wrath"
branch="fury"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="all"
amount=0.05
description="All your attacks deal 5% more damage."

[node_diving_strike]

name="Diving Strike"
branch="fury"
tier=2
kind="active"
cost=1
ability="diving_strike"
description="Leap 5 m forward on your wings and slam down, hitting everything around the landing. Costs 20 Ember."

[node_talon_dive]

name="Talon Dive"
branch="fury"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="diving_strike"
amount=0.25
description="Diving Strike deals 25% more damage."

[node_blazing_fury]

name="Blazing Fury"
branch="fury"
tier=3
kind="passive"
cost=2
effect="low_health_damage"
amount=0.2
; Fraction of max health.
threshold=0.5
description="Deal 20% more damage while below half health."

[node_crushing_wingbeat]

name="Crushing Wingbeat"
branch="fury"
tier=4
kind="passive"
cost=2
effect="surge_stagger"
applies_to="wingbeat_surge"
; Seconds each hit staggers for while Wingbeat Surge is on.
amount=0.3
description="Capstone: while Wingbeat Surge is on, your hits also stagger."
