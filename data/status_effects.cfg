; Status effects: buffs and debuffs with a duration. The server and the client's
; own prediction both read this file: restart the server AND clients after
; editing. Times are in seconds and are rounded to physics ticks (60 per second).
;
; Attacks and abilities apply them with keys in the weapon files
; (applies_status, status_stacks, status_duration, self_status,
; self_status_stacks; see data/weapon_broadsword.cfg).
;
; Each [status_<id>] section is one effect:
;   name        shown on the HUD and over heads
;   category    "debuff" (bad for whoever has it; never applied by an ally,
;               removed by a cleanse) or "buff" (good for whoever has it)
;   affects     "sim": changes movement or actions, so the client predicts it
;               (slow, root, stun). "damage": only changes damage or healing
;               numbers, which the server works out (bleed, exposed, damage
;               up/down, Pyre Heart's healing).
;   duration    seconds it lasts. Applying it again resets the time left to
;               the full duration (it never shortens it).
;   max_stacks  applying it again adds stacks up to this many. Stack effects
;               below are "per stack".
; and only the keys for what it does (left out = no effect):
;   move_multiplier    walking speed while it lasts, fraction of normal (the
;                      strongest one counts; stacks don't change it)
;   stops_movement     true = can't walk, dodge, jump or dash; can still attack,
;                      block and use abilities in place (root)
;   stuns              true = a stun: staggers for its whole duration
;                      (interrupts the current action; can't act). Stun and
;                      stagger are the same thing; stun is the named,
;                      cleansable version with its own duration.
;   attack_speed       light and heavy attacks play this many times faster
;                      (1 to 2; abilities don't change). Only windup and
;                      recovery get shorter, never the hit windows. Needs
;                      affects="sim". The fastest status counts.
;   attack_speed_min_stamina  ...only while stamina is at least this
;                      fraction of max (0 = always).
;   cover_depth, cover_width  meters: while the owner holds block, allies
;                      inside a box this deep straight behind them and this
;                      wide are covered: a hit on them from within the
;                      owner's block arc is blocked by the owner instead
;                      (server; Shield Wall).
;   damage_taken       per stack, fraction more damage taken (0.2 = +20%;
;                      negative = less). All statuses add up, then multiply.
;   damage_dealt       per stack, fraction more damage dealt. Adds up like
;                      damage_taken.
;   damage_per_second  per stack, damage over time (server only), dealt every
;                      tick_interval seconds. Goes through the normal death path.
;   heal_per_second    per stack, healing over time (server only, capped at max
;                      health), every tick_interval seconds. Healing gives the
;                      healer Ember (data/ember.cfg per_heal).
;   tick_interval      seconds between damage-over-time (or healing) ticks.
;   on_hit_status      the owner's damaging hits apply this status (by id)...
;   on_hit_stacks      ...with this many stacks each...
;   consume_on_hit     ...and true = each such hit uses up one stack of this
;                      status ("your next N hits").

[status_bleed]

name="Bleed"
category="debuff"
affects="damage"
duration=5.0
max_stacks=5
; Damage per second per stack: 5 stacks = 50 per second.
damage_per_second=10.0
tick_interval=0.5

[status_slow]

name="Slow"
category="debuff"
affects="sim"
duration=3.0
max_stacks=1
; Walking speed while slowed, fraction of normal.
move_multiplier=0.6

[status_root]

name="Root"
category="debuff"
affects="sim"
duration=1.5
max_stacks=1
stops_movement=true

[status_stun]

name="Stun"
category="debuff"
affects="sim"
duration=1.0
max_stacks=1
stuns=true

[status_exposed]

name="Exposed"
category="debuff"
affects="damage"
duration=6.0
max_stacks=1
; Takes 25% more damage from everything (hits and bleeds).
damage_taken=0.25

[status_damage_up]

name="Empowered"
category="buff"
affects="damage"
duration=6.0
max_stacks=1
; Deals 20% more damage.
damage_dealt=0.2

[status_damage_reduction]

name="Warded"
category="buff"
affects="damage"
duration=4.0
max_stacks=1
; Takes 40% less damage.
damage_taken=-0.4

[status_bloodlust]

; Dual Axes' Bloodlust: the next hits (one stack each) apply bleed.
name="Bloodlust"
category="buff"
affects="damage"
duration=8.0
; Most hits it can be charged with (the ability sets how many it gives).
max_stacks=4
on_hit_status="bleed"
on_hit_stacks=1
consume_on_hit=true

[status_pyre_heart]

; Fighter Wing ability Pyre Heart: burns Ember to heal over time.
name="Pyre Heart"
category="buff"
affects="damage"
duration=5.0
max_stacks=1
; Health per second per stack: 5 s = 200 health (20% of the default 1000).
heal_per_second=40.0
tick_interval=0.5

[status_rampage]

; Dual Axes' Rampage: faster light and heavy attacks (not abilities) while
; your stamina stays high. Only windup and recovery get shorter: hit windows
; keep their full length.
name="Rampage"
category="buff"
affects="sim"
duration=8.0
max_stacks=1
; Attack speed while it lasts: 1.25 = attacks take about 1/1.25 of the time
; (1 to 2).
attack_speed=1.25
; Only while stamina is at least this fraction of max (0.5 = half).
attack_speed_min_stamina=0.5

[status_shield_wall]

; Broadsword's Shield Wall: while you hold block, allies right behind you are
; covered. Hits on them from within your block arc are blocked by you (your
; stamina, can break your guard); they take nothing.
name="Shield Wall"
category="buff"
affects="damage"
duration=6.0
max_stacks=1
; Meters behind you (from your center) an ally can stand and still be covered.
cover_depth=2.5
; Meters wide the covered area is, centered on you.
cover_width=1.8
