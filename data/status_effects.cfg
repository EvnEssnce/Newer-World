; Status effects: buffs and debuffs with a duration. The server and the client's
; own prediction both read this file: restart the server AND clients after
; editing. Times are in seconds and are rounded to physics ticks (60 per second).
;
; Attacks and abilities apply them with keys in the weapon files
; (applies_status, status_stacks, status_duration, self_status,
; self_status_stacks; see data/weapon_broadsword.cfg).
;
; Each [status_<id>] section is one effect:
;   name        shown on the HUD and over heads
;   category    "debuff" (bad for whoever has it; never applied by an ally,
;               removed by a cleanse) or "buff" (good for whoever has it)
;   affects     "sim": changes movement or actions, so the client predicts it
;               (slow, root, stun). "damage": only changes damage numbers,
;               which the server works out (bleed, exposed, damage up/down).
;   duration    seconds it lasts. Applying it again resets the time left to
;               the full duration (it never shortens it).
;   max_stacks  applying it again adds stacks up to this many. Stack effects
;               below are "per stack".
; and only the keys for what it does (left out = no effect):
;   move_multiplier    walking speed while it lasts, fraction of normal (the
;                      strongest one counts; stacks don't change it)
;   stops_movement     true = can't walk, dodge, jump or dash; can still attack,
;                      block and use abilities in place (root)
;   stuns              true = a stun: staggers for its whole duration
;                      (interrupts the current action; can't act). Stun and
;                      stagger are the same thing; stun is the named,
;                      cleansable version with its own duration.
;   damage_taken       per stack, fraction more damage taken (0.2 = +20%;
;                      negative = less). All statuses add up, then multiply.
;   damage_dealt       per stack, fraction more damage dealt. Adds up like
;                      damage_taken.
;   damage_per_second  per stack, damage over time (server only), dealt every
;                      tick_interval seconds. Goes through the normal death path.
;   tick_interval      seconds between damage-over-time ticks.
;   on_hit_status      the owner's damaging hits apply this status (by id)...
;   on_hit_stacks      ...with this many stacks each...
;   consume_on_hit     ...and true = each such hit uses up one stack of this
;                      status ("your next N hits").

[status_bleed]

name="Bleed"
category="debuff"
affects="damage"
duration=5.0
max_stacks=5
; Damage per second per stack: 5 stacks = 50 per second.
damage_per_second=10.0
tick_interval=0.5

[status_slow]

name="Slow"
category="debuff"
affects="sim"
duration=3.0
max_stacks=1
; Walking speed while slowed, fraction of normal.
move_multiplier=0.6

[status_root]

name="Root"
category="debuff"
affects="sim"
duration=1.5
max_stacks=1
stops_movement=true

[status_stun]

name="Stun"
category="debuff"
affects="sim"
duration=1.0
max_stacks=1
stuns=true

[status_exposed]

name="Exposed"
category="debuff"
affects="damage"
duration=6.0
max_stacks=1
; Takes 25% more damage from everything (hits and bleeds).
damage_taken=0.25

[status_damage_up]

name="Empowered"
category="buff"
affects="damage"
duration=6.0
max_stacks=1
; Deals 20% more damage.
damage_dealt=0.2

[status_damage_reduction]

name="Warded"
category="buff"
affects="damage"
duration=4.0
max_stacks=1
; Takes 40% less damage.
damage_taken=-0.4

[status_bloodlust]

; Dual Axes' Bloodlust: the next hits (one stack each) apply bleed.
name="Bloodlust"
category="buff"
affects="damage"
duration=8.0
; Most hits it can be charged with (the ability sets how many it gives).
max_stacks=4
on_hit_status="bleed"
on_hit_stacks=1
consume_on_hit=true
