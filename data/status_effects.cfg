; Status effects: buffs and debuffs with a duration. The server and the client's
; own prediction both read this file: restart the server AND clients after
; editing. Times are in seconds and are rounded to physics ticks (60 per second).
;
; Attacks and abilities apply them with keys in the weapon files
; (applies_status, status_stacks, status_duration, self_status,
; self_status_stacks; see data/weapon_broadsword.cfg).
;
; Each [status_<id>] section is one effect:
;   name        shown on the HUD and over heads
;   category    "debuff" (bad for whoever has it; never applied by an ally,
;               removed by a cleanse) or "buff" (good for whoever has it)
;   affects     "sim": changes movement or actions, so the client predicts it
;               (slow, root, stun). "damage": only changes what the server
;               works out: damage or healing numbers (bleed, exposed, damage
;               up/down, Pyre Heart's healing), immunities, taunts.
;   duration    seconds it lasts. Applying it again resets the time left to
;               the full duration (it never shortens it).
;   max_stacks  applying it again adds stacks up to this many. Stack effects
;               below are "per stack".
; and only the keys for what it does (left out = no effect):
;   move_multiplier    walking speed while it lasts, fraction of normal (the
;                      strongest one counts; stacks don't change it)
;   stops_movement     true = can't walk, dodge, jump or dash; can still attack,
;                      block and use abilities in place (root)
;   stuns              true = a stun: staggers for its whole duration
;                      (interrupts the current action; can't act). Stun and
;                      stagger are the same thing; stun is the named,
;                      cleansable version with its own duration.
;   attack_speed       light and heavy attacks play this many times faster
;                      (1 to 2; abilities don't change). Only windup and
;                      recovery get shorter, never the hit windows. Needs
;                      affects="sim". The fastest status counts; with several
;                      stacks each adds attack_speed - 1 (1.04 x 5 stacks =
;                      1.2), at most 2 in all.
;   attack_speed_min_stamina  ...only while stamina is at least this
;                      fraction of max (0 = always).
;   cover_depth, cover_width  meters: while the owner holds block, allies
;                      inside a box this deep straight behind them and this
;                      wide are covered: a hit on them from within the
;                      owner's block arc is blocked by the owner instead
;                      (server; Shield Wall).
;   damage_taken       per stack, fraction more damage taken (0.2 = +20%;
;                      negative = less). All statuses add up, then multiply.
;   damage_dealt       per stack, fraction more damage dealt. Adds up like
;                      damage_taken.
;   damage_per_second  per stack, damage over time (server only), dealt every
;                      tick_interval seconds. Goes through the normal death path.
;   heal_per_second    per stack, healing over time (server only, capped at max
;                      health), every tick_interval seconds. Healing gives the
;                      healer Ember (data/ember.cfg per_heal).
;   tick_interval      seconds between damage-over-time (or healing) ticks.
;   on_hit_status      the owner's damaging hits apply this status (by id)...
;   on_hit_stacks      ...with this many stacks each...
;   consume_on_hit     ...and true = each such hit uses up one stack of this
;                      status ("your next N hits").
;   forces_target      true = a taunt (debuff only): an enemy with it targets
;                      whoever applied it while it lasts, and applying it lifts
;                      the taunter's threat to the top (data/enemy_<kind>.cfg
;                      [threat] switch_ratio x the highest), so the enemy stays
;                      on them after it ends. No effect on players.
; Immunities (server-decided: they refuse what would be applied, they don't
; remove what's already there):
;   force_immune       true = can't be knocked back, pulled or launched
;   stagger_immune     true = can't be staggered (hits, guard breaks) or stunned
;   cc_immune          true = refuses crowd-control debuffs being applied: slow,
;                      root, stun, taunt
; Juggernaut effects (server):
;   charge_stagger     seconds: an enemy or player whose melee hit lands on the
;                      owner while it charges is staggered this long (Brace).
;                      A charge = the attacker was mid-dash (an ability's dash),
;                      or the hit landed within charge_window...
;   charge_window      ...seconds of the status starting (the plant).
;   crowd_damage_taken per stack, fraction more damage taken for every hostile
;                      (enemy, or player not in your party) within crowd_radius
;                      meters, counting at most crowd_max of them (negative =
;                      less: Iron Hide). Multiplies with damage_taken.
;   crowd_radius       meters (see crowd_damage_taken).
;   crowd_max          most hostiles that count.
; Assassin effects (server):
;   next_hit_crits     true = the owner's next hit crits (data/combat.cfg
;                      [crit]) and uses the status up (Primed, from Feint).
;   blind              0 to 1: a player gets a white haze this opaque over the
;                      screen (fading out over the last 30% of the duration);
;                      an enemy's swings miss with this chance (Dazzled).
;   marked_bonus       fraction: the next melee hit (not a projectile) on the
;                      owner by whoever applied it deals this much more damage
;                      and uses the status up (Marked, from Marked Blade).

[status_bleed]

name="Bleed"
category="debuff"
affects="damage"
duration=5.0
max_stacks=5
; Damage per second per stack: 5 stacks = 50 per second.
damage_per_second=10.0
tick_interval=0.5

[status_slow]

name="Slow"
category="debuff"
affects="sim"
duration=3.0
max_stacks=1
; Walking speed while slowed, fraction of normal.
move_multiplier=0.6

[status_root]

name="Root"
category="debuff"
affects="sim"
duration=1.5
max_stacks=1
stops_movement=true

[status_stun]

name="Stun"
category="debuff"
affects="sim"
duration=1.0
max_stacks=1
stuns=true

[status_exposed]

name="Exposed"
category="debuff"
affects="damage"
duration=6.0
max_stacks=1
; Takes 25% more damage from everything (hits and bleeds).
damage_taken=0.25

[status_damage_up]

name="Empowered"
category="buff"
affects="damage"
duration=6.0
max_stacks=1
; Deals 20% more damage.
damage_dealt=0.2

[status_damage_reduction]

name="Warded"
category="buff"
affects="damage"
duration=4.0
max_stacks=1
; Takes 40% less damage.
damage_taken=-0.4

[status_bloodlust]

; Dual Axes' Bloodlust: the next hits (one stack each) apply bleed.
name="Bloodlust"
category="buff"
affects="damage"
duration=8.0
; Most hits it can be charged with (the ability sets how many it gives).
max_stacks=4
on_hit_status="bleed"
on_hit_stacks=1
consume_on_hit=true

[status_pyre_heart]

; Fighter Wing ability Pyre Heart: burns Ember to heal over time.
name="Pyre Heart"
category="buff"
affects="damage"
duration=5.0
max_stacks=1
; Health per second per stack: 5 s = 200 health (20% of the default 1000).
heal_per_second=40.0
tick_interval=0.5

[status_taunted]

; A taunt (the Juggernaut's Challenger's Roar Wing ability): the enemy fights
; whoever applied it until it ends, and keeps at them after (the taunt puts
; the taunter at the top of its threat).
name="Taunted"
category="debuff"
affects="damage"
; Seconds the enemy is forced onto the taunter.
duration=4.0
max_stacks=1
forces_target=true

[status_braced]

; Halberd Brace: can't be knocked back, pulled or launched, and staggers
; whoever charges in (see charge_stagger above).
name="Braced"
category="buff"
affects="damage"
; Seconds of immunity.
duration=3.0
max_stacks=1
force_immune=true
; Seconds a charging attacker is staggered.
charge_stagger=1.0
; Seconds after planting during which any melee hit counts as a charge (after
; that only a dashing attacker's does).
charge_window=1.0

[status_hooked]

; Halberd Hooking Pull marks its target. No effect of its own: with the Warden
; capstone (data/mastery_halberd.cfg "hook_stagger"), the hooker's next hit on
; it staggers it and uses the mark up.
name="Hooked"
category="debuff"
affects="damage"
; Seconds the mark lasts.
duration=2.5
max_stacks=1

[status_iron_hide]

; Greataxe Iron Hide: less damage taken the more enemies are around you.
name="Iron Hide"
category="buff"
affects="damage"
duration=6.0
max_stacks=1
; 8% less damage taken per hostile within crowd_radius...
crowd_damage_taken=-0.08
; ...meters...
crowd_radius=5.0
; ...counting at most this many (5 = -40%).
crowd_max=5

[status_bloodied]

; Greataxe Bloodied capstone ("ramp_on_hit" in data/mastery_greataxe.cfg):
; every hit you land adds a stack and resets the time, so it builds while you
; keep hitting and falls off soon after you stop.
name="Bloodied"
category="buff"
affects="damage"
; Seconds without landing a hit before every stack is gone.
duration=2.5
; Most stacks (8 x 3% = +24%).
max_stacks=8
; Per stack: 3% more damage dealt.
damage_dealt=0.03

[status_steadfast]

; War Hammer's Steadfast: can't be moved, staggered or stunned.
name="Steadfast"
category="buff"
affects="damage"
; Seconds of immunity.
duration=4.0
max_stacks=1
force_immune=true
stagger_immune=true

[status_unbowed]

; Juggernaut Wing ability Unbowed: immune to all crowd control: can't be moved,
; staggered, stunned, slowed, rooted or taunted.
name="Unbowed"
category="buff"
affects="damage"
; Seconds of immunity.
duration=4.0
max_stacks=1
force_immune=true
stagger_immune=true
cc_immune=true

[status_rampage]

; Dual Axes' Rampage: faster light and heavy attacks (not abilities) while
; your stamina stays high. Only windup and recovery get shorter: hit windows
; keep their full length.
name="Rampage"
category="buff"
affects="sim"
duration=8.0
max_stacks=1
; Attack speed while it lasts: 1.25 = attacks take about 1/1.25 of the time
; (1 to 2).
attack_speed=1.25
; Only while stamina is at least this fraction of max (0.5 = half).
attack_speed_min_stamina=0.5

[status_shield_wall]

; Broadsword's Shield Wall: while you hold block, allies right behind you are
; covered. Hits on them from within your block arc are blocked by you (your
; stamina, can break your guard); they take nothing.
name="Shield Wall"
category="buff"
affects="damage"
duration=6.0
max_stacks=1
; Meters behind you (from your center) an ally can stand and still be covered.
cover_depth=2.5
; Meters wide the covered area is, centered on you.
cover_width=1.8

[status_shattered]

; War Hammer's Shatter: armor broken, takes more damage from everything (hits
; and bleeds). Reapplying adds a stack.
name="Shattered"
category="debuff"
affects="damage"
duration=8.0
max_stacks=2
; Per stack: 15% more damage taken (2 stacks = 30%).
damage_taken=0.15

[status_defiant]

; The Juggernaut's Anchor capstone: Challenger's Roar gives a stack for each
; enemy it taunts (data/mastery_wings_juggernaut.cfg).
name="Defiant"
category="buff"
affects="damage"
; Seconds it lasts (each new stack resets it).
duration=6.0
max_stacks=5
; Per stack: 6% less damage taken (5 stacks = 30% less).
damage_taken=-0.06

[status_primed]

; Dual Talons' Feint: when a target blocks or dodges the Feint (or it lands on
; an enemy mid-swing), your next hit within the time is a guaranteed crit.
name="Primed"
category="buff"
affects="damage"
duration=4.0
max_stacks=1
next_hit_crits=true

[status_talon_storm]

; Dual Talons' Tempest capstone ("ramp_on_hit" in data/mastery_dual_talons.cfg):
; every step one of your Talon attacks connects adds a stack and resets the
; time, so a long unbroken combo gets faster and faster.
name="Talon Storm"
category="buff"
affects="sim"
; Seconds without landing a hit before every stack is gone (the combo breaks).
duration=1.5
; Most stacks (8 x 4% = 1.32x attack speed).
max_stacks=8
; Per stack: 4% faster light and heavy attacks.
attack_speed=1.04

[status_poison]

; Throwing Knives' Venom Coat: damage over time, weaker per stack than bleed
; but it lasts longer. With the Venom capstone the poisoner's poison also cuts
; the healing its target receives (data/mastery_throwing_knives.cfg).
name="Poison"
category="debuff"
affects="damage"
duration=6.0
max_stacks=5
; Damage per second per stack: 5 stacks = 40 per second.
damage_per_second=8.0
tick_interval=1.0

[status_venom_coat]

; Throwing Knives' Venom Coat: each damaging hit poisons the target and uses a
; stack (5 coated hits).
name="Venom Coat"
category="buff"
affects="damage"
duration=10.0
max_stacks=5
on_hit_status="poison"
on_hit_stacks=1
consume_on_hit=true

[status_marked]

; Throwing Knives' Marked Blade: the marker's next melee hit on the target deals
; more damage and uses the mark up.
name="Marked"
category="debuff"
affects="damage"
duration=6.0
max_stacks=1
marked_bonus=0.5

[status_dazzled]

; Assassin Wings' Plumage Flash: blinded by burning feathers, so its hits land
; poorly and (players) it can barely see.
name="Dazzled"
category="debuff"
affects="damage"
duration=4.0
max_stacks=1
; Per stack: 25% less damage dealt.
damage_dealt=-0.25
; Partly blinded: players see a 60% white haze; an enemy's swings miss 60% of
; the time.
blind=0.6

