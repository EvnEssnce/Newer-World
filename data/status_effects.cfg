; Status effects: buffs and debuffs with a duration. The server and the client's
; own prediction both read this file: restart the server AND clients after
; editing. Times are in seconds and are rounded to physics ticks (60 per second).
;
; Attacks and abilities apply them with keys in the weapon files
; (applies_status, status_stacks, status_duration, self_status,
; self_status_stacks; see data/weapon_broadsword.cfg).
;
; Each [status_<id>] section is one effect:
;   name        shown on the HUD and over heads
;   category    "debuff" (bad for whoever has it; never applied by an ally,
;               removed by a cleanse) or "buff" (good for whoever has it)
;   affects     "sim": changes movement or actions, so the client predicts it
;               (slow, root, stun). "damage": only changes what the server
;               works out: damage or healing numbers (bleed, exposed, damage
;               up/down, Pyre Heart's healing), immunities, taunts.
;   duration    seconds it lasts. Applying it again resets the time left to
;               the full duration (it never shortens it).
;   max_stacks  applying it again adds stacks up to this many. Stack effects
;               below are "per stack".
; and only the keys for what it does (left out = no effect):
;   move_multiplier    walking speed while it lasts, fraction of normal (the
;                      strongest slow times the strongest haste above 1;
;                      stacks don't change it)
;   dodge_speed_multiplier  rolls are this many times faster, so they go that
;                      much farther (the strongest counts)
;   dodge_cost_multiplier   rolls cost this fraction of their stamina (the
;                      cheapest counts)
;   fall_gravity_multiplier gravity while falling, fraction of normal (a slow
;                      descent; the gentlest counts)
;   max_fall_speed     m/s: falling is capped at this (a hover; the slowest
;                      counts)
;   stops_movement     true = can't walk, dodge, jump or dash; can still attack,
;                      block and use abilities in place (root)
;   silences           true = a silence: no weapon or Wing abilities (light,
;                      heavy and block still work). Needs affects="sim".
;   stuns              true = a stun: staggers for its whole duration
;                      (interrupts the current action; can't act). Stun and
;                      stagger are the same thing; stun is the named,
;                      cleansable version with its own duration.
;   attack_speed       light and heavy attacks play this many times faster
;                      (1 to 2; abilities don't change). Only windup and
;                      recovery get shorter, never the hit windows. Needs
;                      affects="sim". The fastest status counts; with several
;                      stacks each adds attack_speed - 1 (1.04 x 5 stacks =
;                      1.2), at most 2 in all.
;   attack_speed_min_stamina  ...only while stamina is at least this
;                      fraction of max (0 = always).
;   cover_depth, cover_width  meters: while the owner holds block, allies
;                      inside a box this deep straight behind them and this
;                      wide are covered: a hit on them from within the
;                      owner's block arc is blocked by the owner instead
;                      (server; Shield Wall).
;   damage_taken       per stack, fraction more damage taken (0.2 = +20%;
;                      negative = less). All statuses add up, then multiply.
;   damage_dealt       per stack, fraction more damage dealt. Adds up like
;                      damage_taken.
;   damage_per_second  per stack, damage over time (server only), dealt every
;                      tick_interval seconds. Goes through the normal death path.
;   heal_per_second    per stack, healing over time (server only, capped at max
;                      health), every tick_interval seconds. Healing gives the
;                      healer Ember (data/ember.cfg per_heal).
;   tick_interval      seconds between damage-over-time (or healing) ticks.
;   on_hit_status      the owner's damaging hits apply this status (by id)...
;   on_hit_stacks      ...with this many stacks each...
;   consume_on_hit     ...and true = each such hit uses up one stack of this
;                      status ("your next N hits"). Without on_hit_status: a
;                      one-hit buff (its damage_dealt counts on that hit).
;   forces_target      true = a taunt (debuff only): an enemy with it targets
;                      whoever applied it while it lasts, and applying it lifts
;                      the taunter's threat to the top (data/enemy_<kind>.cfg
;                      [threat] switch_ratio x the highest), so the enemy stays
;                      on them after it ends. No effect on players.
; Immunities (server-decided: they refuse what would be applied, they don't
; remove what's already there):
;   force_immune       true = can't be knocked back, pulled or launched
;   stagger_immune     true = can't be staggered (hits, guard breaks) or stunned
;   cc_immune          true = refuses crowd-control debuffs being applied: slow,
;                      root, stun, taunt
; Juggernaut effects (server):
;   charge_stagger     seconds: an enemy or player whose melee hit lands on the
;                      owner while it charges is staggered this long (Brace).
;                      A charge = the attacker was mid-dash (an ability's dash),
;                      or the hit landed within charge_window...
;   charge_window      ...seconds of the status starting (the plant).
;   crowd_damage_taken per stack, fraction more damage taken for every hostile
;                      (enemy, or player not in your party) within crowd_radius
;                      meters, counting at most crowd_max of them (negative =
;                      less: Iron Hide). Multiplies with damage_taken.
;   crowd_radius       meters (see crowd_damage_taken).
;   crowd_max          most hostiles that count.
; Assassin effects (server):
;   next_hit_crits     true = the owner's next hit crits (data/combat.cfg
;                      [crit]) and uses the status up (Primed, from Feint).
;   damage_taken_from_source  per stack, fraction more damage taken from
;                      whoever applied it (Hunter's Mark)
;   blind              0 to 1: a player gets a white haze this opaque over the
;                      screen (fading out over the last 30% of the duration);
;                      an enemy's swings miss with this chance (Dazzled).
;   healing_taken      per stack, fraction more healing received (negative =
;                      less: Withered)
;   healing_dealt      per stack, fraction more healing done (Phoenix Aura)
;   absorbs            true = a damage-absorbing shield while it lasts (Ward);
;                      the amount comes from what gave it
;   hit_heal           Consecrating: each step the owner's attack connects heals
;                      the owner and allies within hit_heal_radius m this much
;   damage_share       Guardian Link: this fraction of the damage hits deal the
;                      owner goes to whoever applied it (while it lives)
;   roll_zone          each roll places this zone (data/zones.cfg) where it
;                      starts and uses up a stack (Fire Trail)
;   veils              true = stealth, visual only for now: other players see
;                      the owner faint and without a nameplate (Veiled)
;   marked_bonus       fraction: the next melee hit (not a projectile) on the
;                      owner by whoever applied it deals this much more damage
;                      and uses the status up (Marked, from Marked Blade).

