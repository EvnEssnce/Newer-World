; Gear score and equipping. Gear score follows New World's (community-datamined)
; curves: weapon damage and armor grow by a compounding step per 5 gear score,
; slower above a soft cap; armor's damage reduction depends on the attacker's
; weapon gear score. Server and clients both read this file (clients show the
; numbers in the inventory); restart both after editing.

[gear_score]

; Gear score where an item's main stat equals its base in data/items.cfg (and
; the gear score of a weapon slot with no item in it: the class's plain weapon).
base=100
; The main stat grows once per this many gear score (rounded down)...
step=5
; ...by this fraction, compounding: x 1.0112 per step (+1.12%).
growth=0.0112
; Above this gear score each step only gives growth x above_cap_fraction.
soft_cap=500
above_cap_fraction=0.6667

[armor]

; Damage reduction from armor against a hit = armor / (armor + attacker_gs ^ this),
; where attacker_gs is the gear score of the attacker's weapon (an enemy's
; [stats] gear_score). Higher-gear-score attackers punch through more armor.
gs_exponent=1.2
; The inventory shows your reduction against an attacker of this gear score.
ui_attacker_gear_score=120

[equip]

; Seconds it takes to equip or take off a piece of gear (or a weapon). You can
; walk, but not attack, block, dodge, swap or use abilities meanwhile.
time=1.0

[average]

; Your average gear score (shown in the inventory) weighs each equip slot by
; these; an empty weapon slot counts as the base gear score (the plain weapon),
; other empty slots as 0.
weights={"weapon_1": 0.2, "weapon_2": 0.2, "head": 0.15, "chest": 0.2, "legs": 0.15, "wings": 0.1}
