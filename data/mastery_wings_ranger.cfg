; Ranger Wing tree. Server and clients both read this file. Same node keys as
; the weapon trees (explained in data/mastery_broadsword.cfg) and the same tier
; gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_ranger.cfg for the Z and C slots. Respecs are free. Effects as in
; data/mastery_wings_fighter.cfg, plus:
;   roll_empower  (server) every roll gives you `status` (Parting Shot: more
;                 damage on your next hit)
;   extra_charge  rolls (applies_to "roll") or the Wing ability `applies_to` get
;                 a second charge: use it again while the cooldown runs; the
;                 spare comes back when the cooldown is over

[tree]

; Branch ids, in display order, and their names.
branches=["windrider", "parting_shot"]
branch_names=["Windrider", "Parting Shot"]
; Points this tree can spend (a flat budget, like the other Wing trees).
points=12

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["gust_roll", "tailwind", "backdraft", "updraft"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["gust_roll", "backdraft"]

; --- Windrider: roll range and stamina ---

[node_gust_roll]

name="Gust Roll"
branch="windrider"
tier=1
kind="active"
cost=1
ability="gust_roll"
description="For 5 s your rolls become long glides (1.8x as far). Costs 15 Ember."

[node_tailwind]

name="Tailwind"
branch="windrider"
tier=1
kind="active"
cost=1
ability="tailwind"
description="30% faster walking and half-price rolls for 6 s. Costs 20 Ember."

[node_light_step]

name="Light Step"
branch="windrider"
tier=2
kind="passive"
cost=2
effect="damage_taken"
amount=-0.05
description="Take 5% less damage."

[node_featherweight]

name="Featherweight"
branch="windrider"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_second_wind]

name="Second Wind"
branch="windrider"
tier=4
kind="passive"
cost=2
effect="extra_charge"
applies_to="roll"
description="Capstone: a second roll charge: roll again right away, then wait out the cooldown for both."

; --- Parting Shot: rewards rolling away ---

[node_backdraft]

name="Backdraft"
branch="parting_shot"
tier=1
kind="active"
cost=1
ability="backdraft"
description="A wing blast: everything within 4 m is knocked 3 m away. Costs 20 Ember."

[node_updraft]

name="Updraft"
branch="parting_shot"
tier=1
kind="active"
cost=1
ability="updraft"
description="Launch 3.5 m up and float down slowly, shooting as you fall. Costs 25 Ember."

[node_sharp_retreat]

name="Sharp Retreat"
branch="parting_shot"
tier=2
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your attacks deal 5% more damage."

[node_hunters_focus]

name="Hunter's Focus"
branch="parting_shot"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.08
description="Abilities deal 8% more damage."

[node_parting_gift]

name="Parting Gift"
branch="parting_shot"
tier=4
kind="passive"
cost=2
effect="roll_empower"
status="parting_shot"
description="Capstone: every roll makes your next hit within 3 s deal 30% more damage."
