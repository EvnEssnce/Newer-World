; Crossbow mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (server):
;   loaded_chamber  a light or heavy shot with this weapon fired at least
;                   `threshold` seconds after your previous one (a reloaded
;                   crossbow) deals amount (fraction) more damage
;
; Not built yet (design/classes.md): Tripwire (a trap) and Smoke Bolt (a cloud),
; and the Trapper capstone (traps re-arm).

[tree]

; Branch ids, in display order, and their names.
branches=["siege", "trapper"]
branch_names=["Siege", "Trapper"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["concussive_bolt", "heavy_bolts", "bolt_barrage", "scatter_bolt", "close_quarters", "quick_reload"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["concussive_bolt", "bolt_barrage", "scatter_bolt"]

; --- Siege: big bolts and knockback ---

[node_concussive_bolt]

name="Concussive Bolt"
branch="siege"
tier=1
kind="active"
cost=1
ability="concussive_bolt"
description="A blunt bolt that knocks the target back 3 m."

[node_heavy_bolts]

name="Heavy Bolts"
branch="siege"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.15
description="Heavy bolts deal 15% more damage."

[node_bolt_barrage]

name="Bolt Barrage"
branch="siege"
tier=2
kind="active"
cost=1
ability="bolt_barrage"
description="Four bolts at once in a tight spread."

[node_armor_piercer]

name="Armor Piercer"
branch="siege"
tier=2
kind="passive"
cost=1
effect="damage"
applies_to="abilities"
amount=0.1
description="Crossbow abilities deal 10% more damage."

[node_siege_engineer]

name="Siege Engineer"
branch="siege"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.06
description="All your Crossbow shots deal 6% more damage."

[node_braced_stock]

name="Braced Stock"
branch="siege"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina while the Crossbow is out."

[node_loaded_chamber]

name="Loaded Chamber"
branch="siege"
tier=4
kind="passive"
cost=2
effect="loaded_chamber"
amount=1.0
; Seconds since your previous shot.
threshold=2.0
description="Capstone: a shot fired at least 2 s after your previous one deals double damage."

