[node_wide_reap]

name="Wide Reap"
branch="headsman"
tier=2
kind="active"
cost=1
ability="wide_reap"
description="A huge horizontal sweep, 6 meters wide."

[node_pole_vault]

name="Pole Vault"
branch="headsman"
tier=2
kind="active"
cost=1
