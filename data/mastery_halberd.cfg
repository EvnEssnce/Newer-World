; Halberd mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.

[tree]

; Branch ids, in display order, and their names.
branches=["warden", "headsman"]
branch_names=["Warden", "Headsman"]

[default]

; What a new character starts with (must follow the rules).
nodes=["hooking_pull", "crowd_sweep", "long_reach", "brace", "cleaving_arc", "heavy_haft", "wide_reap", "pole_vault"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["hooking_pull", "wide_reap", "crowd_sweep"]

; --- Warden: pulls and zone control ---

[node_hooking_pull]

name="Hooking Pull"
branch="warden"
tier=1
kind="active"
cost=1
ability="hooking_pull"
description="Hook the first enemy in a long line and drag it to you."

[node_crowd_sweep]

name="Crowd Sweep"
branch="warden"
tier=1
kind="active"
cost=1
ability="crowd_sweep"
description="A wide shove with the haft that pushes everything in front of you back 4 meters."

[node_long_reach]

name="Long Reach"
branch="warden"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_brace]

name="Brace"
branch="warden"
tier=2
kind="active"
cost=1
ability="brace"
description="Plant the halberd: 3 seconds without being knocked back, and anyone who charges into you is staggered."

[node_barbed_hook]

name="Barbed Hook"
branch="warden"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="hooking_pull"
amount=0.3
description="Hooking Pull deals 30% more damage."

[node_planted_stance]

name="Planted Stance"
branch="warden"
tier=2
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_sweeping_haft]

name="Sweeping Haft"
branch="warden"
tier=3
kind="upgrade"
cost=1
effect="damage"
applies_to="crowd_sweep"
amount=0.3
description="Crowd Sweep deals 30% more damage."

[node_wardens_vigil]

name="Warden's Vigil"
branch="warden"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Halberd abilities deal 10% more damage."

[node_caught_on_the_hook]

name="Caught on the Hook"
branch="warden"
tier=4
kind="passive"
cost=2
effect="hook_stagger"
; The mark Hooking Pull leaves (data/status_effects.cfg).
applies_to="hooked"
; Seconds your next hit on a target you've hooked staggers it (at least).
amount=0.8
description="Your next hit on a target you've hooked staggers it."

; --- Headsman: big overhead finishers ---

[node_cleaving_arc]

name="Cleaving Arc"
branch="headsman"
tier=1
kind="active"
cost=1
