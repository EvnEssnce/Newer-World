description="A big overhead chop that leaves the target Exposed (takes 25% more damage) for 6 seconds."

[node_heavy_haft]

name="Heavy Haft"
branch="headsman"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
