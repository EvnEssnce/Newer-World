; Ground zones and summons (the AREA and SUMMON tags): things an ability puts
; down that last a while. Server only (data the client also reads to draw
; them): restart the server AND clients after editing. Times are in seconds
; (rounded to physics ticks, 60 per second), distances in meters.
;
; Placed by an attack or ability (zone, zone_time, zone_distance keys in the
; weapon or Wing file), by a projectile where it stops (zone_on_impact), or by
; rolls (a status with roll_zone, data/status_effects.cfg).
;
; Each [zone_<id>] section is one kind:
;   radius        meters around its center that count as inside
;   height        meters above or below the center a target's feet may be
;                 (walls: how tall they are)
;   duration      seconds it lasts
;   trigger       "pulse": every `interval` seconds (the first `first_pulse`
;                 seconds after it's placed) its effect reaches everything of
;                 the `affects` side inside; "trap": once armed (`arm_time`
;                 seconds), the first target of its `affects` side inside (an
;                 enemy first) sets it off, then it re-arms (`rearms` times) or
;                 ends; "none": no effect of its own
;   affects       "hostile" (enemies, and players not in the owner's party) or
;                 "ally" (the owner and its party)
;   damage        per pulse/trigger, like damage over time (no block, crit or
;                 armor; damage-taken statuses count)
;   heal          per pulse, healing (allies)
;   applies_status, status_stacks, status_duration  a status per pulse/trigger
;   decoy         true = while it lasts, enemies see its owner standing here
;   wall          true = the area is a box `width` x `depth` x `height` across
;                 the owner's facing instead of a circle
;   solid         (with wall) true = enemies can't walk through it and
;                 projectiles from outside the owner's party stop at it (the
;                 owner and allies walk through it)
;   visual        look on clients: "disc", "cloud", "rain", "trap", "decoy",
;                 "wall"; color its color (alpha is set by the look)

[zone_arrow_rain]

; Longbow's Arrow Rain: arrows keep falling on a circle 12 m ahead.
radius=3.0
height=2.0
duration=2.5
trigger="pulse"
interval=0.5
; The first arrows take this long to come down.
first_pulse=0.3
affects="hostile"
damage=35.0
visual="rain"
color=Color(0.95, 0.85, 0.55, 1.0)

[zone_smoke]

; Crossbow's Smoke Bolt: a cloud where the bolt stops. Hostiles inside are
; Smoked (blinded) for as long as they stay in it.
radius=3.5
height=2.5
duration=5.0
trigger="pulse"
interval=0.25
affects="hostile"
applies_status="smoked"
; Seconds Smoked lasts after each pulse (a little longer than the interval).
status_duration=0.6
visual="cloud"
color=Color(0.55, 0.57, 0.6, 1.0)

[zone_tripwire]

; Crossbow's Tripwire: a trap at your feet. The first hostile to cross it is
; rooted and cut. Re-arms once with the Trapper capstone.
radius=1.4
height=1.5
duration=30.0
trigger="trap"
; Seconds before it can be set off (so it doesn't fire on what you're fighting).
arm_time=1.0
rearms=0
affects="hostile"
damage=30.0
applies_status="root"
status_duration=2.0
visual="trap"
color=Color(0.85, 0.75, 0.4, 1.0)

[zone_fire_trail]

; Firebolts' Fire Trail: burning ground where you roll. Hostiles standing in it
; burn.
radius=1.6
height=1.5
duration=4.0
trigger="pulse"
interval=0.5
affects="hostile"
applies_status="burn"
status_stacks=1
visual="disc"
color=Color(1.0, 0.4, 0.1, 1.0)

[zone_ember_double]

; Assassin Wings' Ember Double: a burning copy of you where you stood. While it
; lasts enemies go for it instead of you, and it scorches what's next to it.
radius=1.5
height=2.0
duration=4.0
trigger="pulse"
interval=0.5
affects="hostile"
damage=15.0
decoy=true
visual="decoy"
color=Color(1.0, 0.5, 0.15, 1.0)

[zone_shield_wall]

; Broadsword's Shield Wall: three tall shields planted in a row in front of
; you. Enemies can't walk through; hostile projectiles stop at it; you and your
; party walk through it. Not breakable yet (it will be).
radius=2.3
; Meters tall.
height=2.5
duration=8.0
trigger="none"
affects="hostile"
wall=true
solid=true
; Meters across, and meters thick.
width=4.5
depth=0.5
visual="wall"
color=Color(0.72, 0.74, 0.8, 1.0)

; --- Mage ---

[zone_meteor]

; Great Staff's Meteor Fall: a glowing warning circle, then one big blast.
radius=3.5
height=2.5
; Lasts just past the blast.
duration=1.3
trigger="pulse"
; The blast comes this long after it's placed, once (interval longer than the
; rest of its life).
first_pulse=1.2
interval=5.0
affects="hostile"
damage=220.0
visual="disc"
color=Color(1.0, 0.3, 0.05, 1.0)

[zone_flame_wall]

; Great Staff's Flame Wall: a line of fire across your facing. Not solid: things
; walk through it and burn.
radius=3.0
height=2.0
duration=5.0
trigger="pulse"
interval=0.5
affects="hostile"
damage=20.0
applies_status="burn"
status_stacks=1
wall=true
solid=false
width=6.0
depth=1.2
visual="firewall"
color=Color(1.0, 0.45, 0.1, 1.0)

[zone_renewal_pulse]

; Gauntlet's Renewal Pulse: one burst of healing for everyone on your side in it.
radius=3.0
height=2.0
duration=0.3
trigger="pulse"
interval=5.0
affects="ally"
heal=160.0
visual="disc"
color=Color(0.45, 1.0, 0.5, 1.0)

[zone_life_spore]

; Gauntlet's Life Spore: a floating orb that heals the first ally (its owner
; too) to touch it, then pops.
radius=1.2
height=1.5
duration=20.0
trigger="trap"
; Seconds before it can be picked up (so it isn't used up at once by you).
arm_time=0.5
rearms=0
affects="ally"
heal=200.0
visual="orb"
color=Color(0.45, 1.0, 0.5, 1.0)

[zone_binding_embers]

; Mage Wings' Binding Embers: one rain of embers that roots everything in it.
radius=3.5
height=2.0
duration=0.6
trigger="pulse"
first_pulse=0.3
interval=5.0
affects="hostile"
applies_status="root"
status_duration=2.0
visual="disc"
color=Color(1.0, 0.6, 0.2, 1.0)

