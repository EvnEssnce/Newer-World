; Broadsword (one-hand sword + shield), a Fighter weapon. The server and the
; client's own prediction both read this file: restart the server AND clients
; after editing. Times are in seconds and are rounded to physics ticks (60 per
; second).
;
; Tap left click = light attack (fires on release), hold left click = heavy attack.
; Every attack has three phases: windup (no hit yet), active (hitbox is live),
; recovery (a dodge can cancel this part). Abilities (Q / E / R) use the same
; phases, plus a cooldown.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Broadsword"
; Placeholder model to draw: "sword_shield" or "dual_axes" (cosmetic only).
model="sword_shield"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; 1.0 = the attack's block_stamina_damage as is; higher = weaker guard.
block_stamina_multiplier=1.0
; Ability pool, in order (ids of the [ability_<id>] sections below). Which ones
; a player can slot is decided by data/mastery_broadsword.cfg. At most 8.
abilities=["whirlwind_edge", "shield_charge", "riposte", "riposte_counter"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible (mid-attack or
; mid-roll) still happens as soon as it becomes possible.
buffer=0.3
; During an attack the character (and hitbox) turns toward where the camera
; looks at up to this many degrees per second. Very high = follows instantly.
turn_speed=720.0

[light]

damage=80.0
; Seconds the target is staggered (interrupted, can't act). 0 = no stagger.
stagger=0.0
; Stamina a blocking target loses when this attack hits their guard.
block_stamina_damage=20.0
; true = always breaks a block (guard break), regardless of stamina.
breaks_block=false
windup=0.15
active=0.12
recovery=0.3
; Movement speed while attacking, as a fraction of normal speed.
move_multiplier=0.4
; Hitbox: a box that starts at the attacker's center and reaches `range` meters
; forward, `width` meters wide, from the feet up to `height` meters.
range=1.8
width=1.6
height=2.0

[heavy]

damage=200.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=true
windup=0.4
active=0.15
recovery=0.5
move_multiplier=0.15
range=2.0
width=1.4
height=2.2

; --- Abilities ---
; Each ability has the attack keys above plus:
;   name          shown on the HUD and in the mastery panel
;   cooldown      seconds before it can be used again (counted from its start;
;                 keeps counting while the weapon is holstered)
;   turn_speed    degrees per second the facing follows the camera during it;
;                 0 = locked to the direction it started in
;   shape         hitbox shape: "box" (range/width/height as above), "radial"
;                 (a circle of radius `range` around you, `height` tall) or
;                 "none" (no hitbox)
; and optionally:
;   dash_distance meters it moves you forward, between dash_start and dash_end
;                 (seconds from the ability's start). Movement input is ignored
;                 while dashing.
;   max_targets   it stops (skips to recovery) after hitting this many targets
;   parry_arc     degrees in front of you: during the active phase a hit from
;                 inside this arc is negated and answered with `counter`
;   internal      true = not slottable (only triggered by another ability)

[ability_whirlwind_edge]

name="Whirlwind Edge"
cooldown=8.0
damage=120.0
stagger=0.0
block_stamina_damage=30.0
breaks_block=false
windup=0.2
active=0.25
recovery=0.35
move_multiplier=0.3
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=2.4
width=0.0
height=2.0

[ability_shield_charge]

name="Shield Charge"
cooldown=10.0
damage=60.0
; The first target hit is staggered this long, then the charge stops.
stagger=0.8
block_stamina_damage=35.0
breaks_block=false
windup=0.15
active=0.35
recovery=0.4
move_multiplier=0.2
turn_speed=0.0
shape="box"
range=1.4
width=1.4
height=2.0
dash_distance=6.0
dash_start=0.15
dash_end=0.5
max_targets=1

[ability_riposte]

name="Riposte"
cooldown=9.0
; The stance itself does no damage; the counter below does.
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
; The active phase is the parry window.
windup=0.0
active=0.6
recovery=0.35
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
parry_arc=120.0
; The ability that answers a parried hit.
counter="riposte_counter"

[ability_riposte_counter]

; The counter strike after a successful Riposte parry. Turns to face whoever
; was parried. Not slottable, no cooldown.
name="Riposte Counter"
internal=true
cooldown=0.0
damage=180.0
stagger=0.6
block_stamina_damage=40.0
breaks_block=true
windup=0.1
active=0.15
recovery=0.35
move_multiplier=0.2
turn_speed=720.0
shape="box"
range=2.2
width=1.6
height=2.2
