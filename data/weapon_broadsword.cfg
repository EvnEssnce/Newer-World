; Broadsword (one-hand sword + shield), a Fighter weapon. The server and the
; client's own prediction both read this file: restart the server AND clients
; after editing. Times are in seconds and are rounded to physics ticks (60 per
; second).
;
; Tap left click = light attack (fires on release), hold left click = heavy attack.
; Every attack has three phases: windup (no hit yet), active (hitbox is live),
; recovery (a dodge can cancel this part). Abilities (Q / E / R) use the same
; phases, plus a cooldown.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Broadsword"
; Placeholder model to draw: "sword_shield" or "dual_axes" (cosmetic only).
model="sword_shield"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; 1.0 = the attack's block_stamina_damage as is; higher = weaker guard.
block_stamina_multiplier=1.0
; Ability pool, in order (ids of the [ability_<id>] sections below). Which ones
; a player can slot is decided by data/mastery_broadsword.cfg. At most 8.
abilities=["whirlwind_edge", "shield_charge", "riposte", "riposte_counter", "opening_strike", "rising_cut", "shield_wall"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible (mid-attack or
; mid-roll) still happens as soon as it becomes possible.
buffer=0.3
; During an attack the character (and hitbox) turns toward where the camera
; looks at up to this many degrees per second. Very high = follows instantly.
turn_speed=720.0

[light]

damage=80.0
; Seconds the target is staggered (interrupted, can't act). 0 = no stagger.
stagger=0.0
; Stamina a blocking target loses when this attack hits their guard.
block_stamina_damage=20.0
; true = always breaks a block (guard break), regardless of stamina.
breaks_block=false
windup=0.15
active=0.12
recovery=0.3
; Movement speed while attacking, as a fraction of normal speed.
move_multiplier=0.4
; Hitbox: a box that starts at the attacker's center and reaches `range` meters
; forward, `width` meters wide, from the feet up to `height` meters.
range=1.8
width=1.6
height=2.0

[heavy]

damage=200.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=true
windup=0.4
active=0.15
recovery=0.5
move_multiplier=0.15
range=2.0
width=1.4
height=2.2
; Knockback on whoever it damages or guard-breaks, meters away (0 = none; see
; "Forced movement keys" below). The smoke test turns it on so Husks get moved
; every run.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---
; Each ability has the attack keys above plus:
;   name          shown on the HUD and in the mastery panel
;   cooldown      seconds before it can be used again (counted from its start;
;                 keeps counting while the weapon is holstered)
;   turn_speed    degrees per second the facing follows the camera during it;
;                 0 = locked to the direction it started in
;   shape         hitbox shape: "box" (range/width/height as above), "radial"
;                 (a circle of radius `range` around you, `height` tall) or
;                 "none" (no hitbox)
; and optionally:
;   dash_distance meters it moves you forward, between dash_start and dash_end
;                 (seconds from the ability's start). Movement input is ignored
;                 while dashing.
;   dash_direction "forward" (default), "back" (away from your facing) or
;                 "input" (the way your movement keys point as it starts;
;                 backward with none)
;   dash_ease     "none" (default, constant speed) or "in" (speeds up over the
;                 dash; same distance)
;   dash_aim_pitch, aim_full_pitch, aim_zero_pitch  the dash is shortened by
;                 looking up (see Crashing Leap in data/weapon_dual_axes.cfg)
;   leap_height, leap_peak  a cosmetic leap during the dash: peak height in
;                 meters, reached at leap_peak (fraction of the dash, 0.5 default)
;   iframe_start, iframe_end  seconds from the ability's start during which
;                 hits can't land (like a dodge's i-frames)
;   max_targets   it stops (skips to recovery) after hitting this many targets;
;                 everything its hitbox touches on that same tick is still hit
;   impact_radius with max_targets: when it stops, everything within this many
;                 meters of you is hit too
;   parry_arc     degrees in front of you: during the active phase a hit from
;                 inside this arc is negated and answered with `counter`
;   internal      true = not slottable (only triggered by another ability)

[ability_whirlwind_edge]

name="Whirlwind Edge"
cooldown=8.0
damage=120.0
stagger=0.0
block_stamina_damage=30.0
breaks_block=false
windup=0.2
active=0.25
recovery=0.35
move_multiplier=0.3
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=2.4
width=0.0
height=2.0

[ability_shield_charge]

name="Shield Charge"
cooldown=10.0
damage=60.0
; Everything hit is staggered this long; the charge stops at its first contact
; and hits everything around you there (see impact_radius below).
stagger=0.8
block_stamina_damage=35.0
breaks_block=false
windup=0.15
active=0.35
recovery=0.4
move_multiplier=0.2
turn_speed=0.0
shape="box"
range=1.4
; Wide enough to catch two targets standing side by side (was 1.4).
width=2.2
height=2.0
dash_distance=6.0
dash_start=0.15
dash_end=0.5
max_targets=1
; When it stops on contact, everything within this many meters of you is hit
; too (the impact), so charging into a group hits the group.
impact_radius=2.5

[ability_riposte]

name="Riposte"
cooldown=9.0
; The stance itself does no damage; the counter below does.
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
; The active phase is the parry window.
windup=0.0
active=0.6
recovery=0.35
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
parry_arc=120.0
; The ability that answers a parried hit.
counter="riposte_counter"

[ability_riposte_counter]

; The counter strike after a successful Riposte parry. Turns to face whoever
; was parried. Not slottable, no cooldown.
name="Riposte Counter"
internal=true
cooldown=0.0
damage=180.0
stagger=0.6
block_stamina_damage=40.0
breaks_block=true
windup=0.1
active=0.15
recovery=0.35
move_multiplier=0.2
turn_speed=720.0
shape="box"
range=2.2
width=1.6
height=2.2

; --- Status abilities ---
; Any attack or ability can also have (statuses are in data/status_effects.cfg):
;   applies_status      status id applied to whoever it damages (not on a
;                       blocked, evaded or parried hit; never on an ally)
;   status_stacks       stacks it applies (default 1)
;   status_duration     seconds, instead of the status's own duration
;   self_status         status id applied to yourself when it starts (a buff)
;   self_status_stacks  stacks of it (default 1)

[ability_opening_strike]

; A slow, heavy thrust that leaves the target Exposed (takes more damage).
name="Opening Strike"
cooldown=12.0
damage=150.0
stagger=0.3
block_stamina_damage=40.0
breaks_block=false
windup=0.45
active=0.15
recovery=0.45
move_multiplier=0.15
turn_speed=360.0
shape="box"
; A narrow thrust with a little more reach than the heavy attack.
range=2.4
width=1.0
height=2.2
applies_status="exposed"
status_stacks=1
; --- Forced movement keys (any attack or ability, optional) ---
;   force_distance       meters the target is pushed or pulled (0 = none)
;   force_direction      "away" (knockback, from the attacker), "toward" (pull;
;                        stops [force] pull_gap short of the attacker, see
;                        data/combat.cfg) or "forward" (along the attacker's facing)
;   force_height         launch: peak height in meters (0 = none)
;   force_duration       seconds the push lasts (a launch lasts at least its
;                        airtime); the target can't act meanwhile
;   force_needs_stagger  true = only moves a target that was already staggered
;                        before this hit
; Limits for all of them are in data/combat.cfg [force].

[ability_rising_cut]

; Upward slash. Staggers; a target that was already staggered (after a guard
; break, Shield Charge or Riposte's counter, for example) is also knocked up
; and back a little.
name="Rising Cut"
cooldown=8.0
damage=110.0
stagger=0.5
block_stamina_damage=30.0
breaks_block=false
windup=0.2
active=0.15
recovery=0.4
move_multiplier=0.2
turn_speed=360.0
shape="box"
range=2.0
width=1.4
height=2.4
; Knocked back 0.8 m and up 0.9 m (only if already staggered, see above).
force_direction="away"
force_distance=0.8
force_height=0.9
; Seconds the push lasts (the launch's airtime is longer, so that decides).
force_duration=0.3
force_needs_stagger=true

[ability_shield_wall]

; Plant the shield: no hit of its own. Gives you Shield Wall
; (data/status_effects.cfg): while it lasts and you hold block, allies right
; behind you are covered by your guard (the box's size is in that file).
name="Shield Wall"
cooldown=16.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.2
move_multiplier=0.4
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="shield_wall"
