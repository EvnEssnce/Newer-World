; Training dummy: a punching bag for testing builds and tuning damage. Never
; moves, turns or swings. Above it, each player sees their own damage on it,
; DPS and fight length. Server only except the readout (clients read
; reset_time), so editing this file needs a server restart (and a client
; restart for reset_time). Times are in seconds.

[stats]

max_health=6000.0
; It never walks (stationary), so these stay 0.
move_speed=0.0
wander_speed=0.0
return_speed=0.0
turn_speed=0.0
; Multiplies the stagger time of hits it takes (it shows the stagger tilt).
; 0 = never staggered.
stagger_multiplier=1.0
; Seconds after dying before it stands back up.
respawn_time=3.0
; Seconds without taking damage (from anyone) before it heals to full and goes
; back to its spot (if a knockback moved it). Also how long a pause ends a
; fight on the DPS readout (the next hit starts a new one).
reset_time=4.0

[ai]

; true = never moves, turns or swings (only staggers). Hits, statuses and
; forced movement still work on it.
stationary=true
; Unused while stationary.
aggro_range=0.0
leash_range=1000.0
attack_range=0.0
attack_cooldown=1.0
wander_radius=0.0
wander_pause=1.0

[threat]

; Unused while stationary (it never picks a target). Same meaning as in
; data/enemy_husk.cfg.
per_damage=1.0
per_heal=0.0
proximity=0.0
switch_ratio=1.1
decay_per_second=0.0

[attack]

; Unused: it never swings. Every enemy file needs this section.
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=1.0
active=0.1
recovery=0.1
move_multiplier=0.0
range=0.0
width=0.0
height=0.0
