; Firebolts mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (server):
;   status_cap    the status `applies_to` you apply (Burn) stacks up to amount
;                 times its max_stacks, whichever of your weapons is out
;   ignite_ember  each stack an Ignite (detonates_status) uses up gives you
;                 amount Ember

[tree]

; Branch ids, in display order, and their names.
branches=["kindling", "flashfire"]
branch_names=["Kindling", "Flashfire"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["scatterflame", "kindle", "overheat", "fire_trail", "ignite", "searing", "flare", "seeker_spark"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["scatterflame", "ignite", "flare"]

; --- Kindling: building Burn ---

[node_scatterflame]

name="Scatterflame"
branch="kindling"
tier=1
kind="active"
cost=1
ability="scatterflame"
description="A short cone of five firebolts, each adding Burn."

[node_kindle]

name="Kindle"
branch="kindling"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light firebolts deal 10% more damage."

[node_overheat]

name="Overheat"
branch="kindling"
tier=2
kind="active"
cost=1
ability="overheat"
description="Fire much faster for 4 s."

[node_stoke]

name="Stoke"
branch="kindling"
tier=2
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.15
description="Heavy volleys deal 15% more damage."

[node_fire_trail]

name="Fire Trail"
branch="kindling"
tier=2
kind="active"
cost=1
ability="fire_trail"
description="Your next 3 rolls leave burning ground."

[node_wildfire]

name="Wildfire"
branch="kindling"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.06
description="All your Firebolts deal 6% more damage."

[node_ash_ward]

name="Ash Ward"
branch="kindling"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina while Firebolts are out."

[node_inferno]

name="Inferno"
branch="kindling"
tier=4
kind="passive"
cost=2
effect="status_cap"
applies_to="burn"
amount=2.0
description="Capstone: your Burn stacks twice as high (12)."

; --- Flashfire: cashing Burn in ---

[node_ignite]

name="Ignite"
branch="flashfire"
tier=1
kind="active"
cost=1
ability="ignite"
description="Detonate every Burn stack on the target: 35 more damage per stack."

[node_searing]

name="Searing"
branch="flashfire"
tier=1
kind="upgrade"
cost=1
effect="damage"
applies_to="ignite"
amount=0.2
description="Ignite deals 20% more damage."

[node_flare]

name="Flare"
branch="flashfire"
tier=2
kind="active"
cost=1
ability="flare"
description="A bright bolt that blinds: enemies' swings mostly miss for 2 s."

[node_quick_fuse]

name="Quick Fuse"
branch="flashfire"
tier=2
kind="passive"
cost=1
effect="damage"
applies_to="abilities"
amount=0.1
description="Firebolt abilities deal 10% more damage."

[node_seeker_spark]

name="Seeker Spark"
branch="flashfire"
tier=2
kind="active"
cost=1
ability="seeker_spark"
description="A slow spark that homes in on the nearest hostile in front and burns it."

[node_flashpoint]

name="Flashpoint"
branch="flashfire"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="heavy"
amount=0.1
description="Heavy volleys deal another 10% more damage."

[node_blaze]

name="Blaze"
branch="flashfire"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="light"
amount=0.05
description="Light firebolts deal another 5% more damage."

[node_cinder_return]

name="Cinder Return"
branch="flashfire"
tier=4
kind="passive"
cost=2
effect="ignite_ember"
amount=3.0
description="Capstone: Ignite refunds 3 Ember for each Burn stack it consumes."
