; Gathering nodes (game/gathering/). The server owns every node: how many
; gathers it has left and when a depleted one grows back. F next to a node
; (when none of your loot is in reach) gathers it: a walk-only lock like
; equipping gear (no attacks, block, dodge, swap or abilities), then the
; resources go into your bag (stacks; data/items.cfg). Walking within range is
; fine; leaving range, taking damage, a stagger/stun or being knocked around
; cancels it (nothing gathered, the node keeps its charge).
; Nodes are placed in the level by Marker3D children of World/GatherNodes
; (metadata/kind = the part after "node_" below).

[gather]
; Extra meters the server allows past a node's range, both to start and to keep
; gathering: the server's copy of you trails your screen by your ping.
range_tolerance=0.75

; One section per node kind: [node_<kind>].
; name: shown in the prompt ("[F] Mine Rustvein Deposit").
; action: the prompt's verb.
; resource: the item it gives (a slot="resource" item in data/items.cfg).
; tradeskill: the skill a gather counts toward (mining, logging, harvesting).
; yield_min / yield_max: resources per gather (whole items, both included).
; charges: gathers before the node is depleted.
; gather_time: seconds one gather takes (the walk-only lock).
; respawn_time: seconds a depleted node takes to grow back (all charges).
; range: meters (horizontal) from the node's center you can gather it from.
; visual: the client look ("ore", "wood" or "fiber").

[node_ore]
name="Rustvein Deposit"
action="Mine"
resource="rustvein_ore"
tradeskill="mining"
yield_min=2
yield_max=4
charges=3
gather_time=2.5
respawn_time=60.0
range=2.5
visual="ore"

[node_wood]
name="Windbent Pine"
action="Chop"
resource="pine_log"
tradeskill="logging"
yield_min=2
yield_max=4
charges=3
gather_time=2.5
respawn_time=60.0
range=2.5
visual="wood"

[node_fiber]
name="Thistlebrush"
action="Harvest"
resource="thistle_fiber"
tradeskill="harvesting"
yield_min=2
yield_max=5
charges=2
gather_time=1.5
respawn_time=45.0
range=2.2
visual="fiber"
