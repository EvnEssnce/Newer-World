; Assassin Wing abilities: distraction and repositioning. Two Wing slots, on Z
; and C, that stay the same when you swap weapons. Which abilities are learned
; and slotted comes from the Wing tree (data/mastery_wings_assassin.cfg). The
; server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds and are rounded to
; physics ticks (60 per second).
;
; Same keys as data/wings_fighter.cfg (ember_cost) and the weapon abilities
; (data/weapon_broadsword.cfg; applies_status_2 in data/wings_juggernaut.cfg).

[wings]

; Shown in the mastery panel's Wings tab.
name="Assassin Wings"
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["ashstep", "plumage_flash", "ember_double", "shadow_swap"]

[ability_ashstep]

; A short blink in your movement direction (backward with no movement input),
; untouchable while it lasts. No hit of its own.
name="Ashstep"
ember_cost=15.0
cooldown=6.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.05
recovery=0.15
move_multiplier=0.0
turn_speed=0.0
shape="none"
range=0.0
width=0.0
height=0.0
; Meters moved between these seconds from the start. "input" = the way the
; movement keys point (backward with none).
dash_distance=4.5
dash_direction="input"
dash_start=0.03
dash_end=0.2
; Untouchable (i-frames) between these seconds.
iframe_start=0.03
iframe_end=0.22

[ability_plumage_flash]

; A burst of burning feathers in a cone in front of you: everything it hits is
; Dazzled (deals less damage, data/status_effects.cfg) and Slowed.
name="Plumage Flash"
ember_cost=20.0
cooldown=12.0
damage=20.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.15
active=0.1
recovery=0.25
move_multiplier=0.4
turn_speed=720.0
shape="radial"
; A cone: range meters out, arc degrees wide.
range=6.0
arc=70.0
width=0.0
height=2.2
applies_status="dazzled"
applies_status_2="slow"
status_stacks_2=1
; Seconds the slow lasts (instead of the status's own duration).
status_duration_2=2.5

[ability_ember_double]

; Leave a burning copy of yourself where you stand (data/zones.cfg
; [zone_ember_double]): enemies go for it instead of you while it lasts, and
; you're Veiled (hard to see) for a moment.
name="Ember Double"
ember_cost=20.0
cooldown=14.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.05
recovery=0.1
move_multiplier=1.0
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
zone="ember_double"
zone_time=0.0
zone_distance=0.0
self_status="veiled"

[ability_shadow_swap]

; Trade places with your Ember Double, or (with none out) with the nearest
; target you Marked (Throwing Knives' Marked Blade) within swap_range meters.
name="Shadow Swap"
ember_cost=15.0
cooldown=10.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.05
recovery=0.15
move_multiplier=0.0
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
swap_places=true
swap_range=15.0
