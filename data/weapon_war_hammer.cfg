; War Hammer, a Juggernaut weapon. STUB (scaffolding): light/heavy copied from
; the Spear and no abilities yet; the Juggernaut build replaces this file.
; See data/weapon_broadsword.cfg for what every key means.

[weapon]

; Shown on the HUD and in the mastery panel.
name="War Hammer"
; Placeholder model to draw (cosmetic only).
model="sword_shield"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.0
; Ability pool, in order.
abilities=[]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A quick thrust: much longer and narrower than the Broadsword's swing.
damage=75.0
stagger=0.0
block_stamina_damage=18.0
breaks_block=false
windup=0.18
active=0.12
recovery=0.35
move_multiplier=0.4
; Meters forward from your center, meters wide, meters tall.
range=2.8
width=0.8
height=2.0

[heavy]

; A two-handed driving thrust with the longest reach.
damage=190.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=true
windup=0.45
active=0.15
recovery=0.55
move_multiplier=0.15
range=3.2
; Same width as the light thrust.
width=0.8
height=2.2
; Meters the thrust drives the target back (keeps it at the end of your
; reach). 0 = no push.
force_direction="away"
force_distance=0.0
force_duration=0.2

