; War Hammer (two-handed), a Juggernaut weapon: slow, crushing, the best
; stagger and stun weapon. The server and the client's own prediction both read
; this file: restart the server AND clients after editing. Times are in seconds
; and are rounded to physics ticks (60 per second). See
; data/weapon_broadsword.cfg for what every key means (ability, status and
; force keys are explained there too).

[weapon]

; Shown on the HUD and in the mastery panel.
name="War Hammer"
; Placeholder model to draw (cosmetic only): a two-handed hammer.
model="war_hammer"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; 1.0 = the attack's block_stamina_damage as is.
block_stamina_multiplier=1.0
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_war_hammer.cfg. At most 8.
abilities=["seismic_slam", "clout", "shatter", "upheaval", "shockwave", "steadfast", "aftershock"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack. Slower
; than the Fighter's weapons (720): a hammer swing is hard to steer.
turn_speed=420.0

[light]

; A heavy diagonal swing: slower than a sword, hits harder, staggers briefly.
damage=95.0
; Seconds the target is staggered.
stagger=0.2
; Stamina a blocking target loses.
block_stamina_damage=25.0
breaks_block=false
windup=0.28
active=0.12
recovery=0.45
; Movement speed while attacking, fraction of normal.
move_multiplier=0.35
; Meters forward, meters wide, meters tall.
range=2.1
width=1.6
height=2.0

[heavy]

; An overhead slam: very slow, crushing, long stagger.
damage=240.0
stagger=0.7
block_stamina_damage=55.0
; false: the Breaker capstone (data/mastery_war_hammer.cfg) makes heavies
; break blocks.
breaks_block=false
windup=0.6
active=0.15
recovery=0.7
move_multiplier=0.1
range=2.3
width=1.6
height=2.2
; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---

[ability_seismic_slam]

; Slams the ground: a cone in front knocks everything in it down (a long
; stagger) and back.
name="Seismic Slam"
cooldown=12.0
damage=140.0
; Seconds everything hit is knocked down (staggered).
stagger=0.8
block_stamina_damage=45.0
breaks_block=false
windup=0.45
active=0.15
recovery=0.5
move_multiplier=0.1
turn_speed=180.0
; A cone: a circle of `range` meters cut to `arc` degrees in front of you.
shape="radial"
range=4.0
arc=90.0
width=0.0
height=2.0
; Knocked back this many meters over force_duration seconds.
force_direction="away"
force_distance=2.0
force_duration=0.35

[ability_clout]

; A short, brutal blow to one target: stuns it (Stun, data/status_effects.cfg).
name="Clout"
cooldown=14.0
damage=110.0
; The stun does the staggering (status_duration below).
stagger=0.0
block_stamina_damage=40.0
breaks_block=false
windup=0.3
active=0.15
recovery=0.4
move_multiplier=0.2
turn_speed=360.0
shape="box"
range=2.2
width=1.2
height=2.2
; Only the first target hit.
max_targets=1
applies_status="stun"
; Seconds the target is stunned.
status_duration=1.5

[ability_shatter]

; An armor-breaking blow: the target is Shattered (takes more damage; stacks
; twice, data/status_effects.cfg). Heavy on a guard too.
name="Shatter"
cooldown=12.0
damage=130.0
stagger=0.3
block_stamina_damage=60.0
breaks_block=false
windup=0.4
active=0.15
recovery=0.45
move_multiplier=0.15
turn_speed=360.0
shape="box"
range=2.2
width=1.4
height=2.2
applies_status="shattered"
status_stacks=1

[ability_upheaval]

; Drives the hammer into the ground: everything around you is thrown up into
; the air (a launch) and a little back.
name="Upheaval"
cooldown=14.0
damage=120.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=false
windup=0.35
active=0.15
recovery=0.5
move_multiplier=0.1
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=3.0
width=0.0
height=2.0
; Launch: peak height in meters, plus this much knockback.
force_direction="away"
force_distance=1.0
force_height=1.5
force_duration=0.3

[ability_shockwave]

; Slams the ground and sends a wave rolling along it in front of you
; (projectile "shockwave", data/projectiles.cfg): it passes through
; everything in its path and staggers what it hits.
name="Shockwave"
cooldown=10.0
damage=100.0
stagger=0.6
block_stamina_damage=30.0
breaks_block=false
windup=0.45
active=0.1
recovery=0.45
move_multiplier=0.1
turn_speed=360.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="shockwave"
; Seconds from the ability's start that the wave leaves (the slam lands).
projectile_time=0.45

[ability_steadfast]

; Plants your feet: Steadfast (data/status_effects.cfg), immune to being
; staggered, stunned, knocked back, pulled or launched for a few seconds.
name="Steadfast"
cooldown=18.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.2
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="steadfast"

[ability_aftershock]

; The Earthshaker capstone's shockwave (data/mastery_war_hammer.cfg), sent out
; by every 3rd heavy attack: its hit is this ability's damage and stagger.
; Internal: never slotted or run, only its projectile and hit are used.
name="Aftershock"
internal=true
cooldown=0.0
damage=70.0
stagger=0.4
block_stamina_damage=25.0
breaks_block=false
windup=0.0
active=0.1
recovery=0.0
move_multiplier=0.0
turn_speed=0.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="shockwave"
projectile_time=0.0
