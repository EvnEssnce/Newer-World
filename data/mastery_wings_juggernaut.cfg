; Juggernaut Wing tree. Server and clients both read this file. Same node keys
; as the weapon trees (explained in data/mastery_broadsword.cfg) and the same
; tier gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_juggernaut.cfg for the Z and C slots. Respecs are free.
;
; Effects besides those of data/mastery_wings_fighter.cfg (all server-side,
; never in the predicted simulation):
;   force_distance  your knockbacks and shoves (force_direction "away" or
;                   "forward", any attack or ability) move targets amount
;                   (fraction) farther, up to data/combat.cfg [force]
;                   max_distance. Pulls don't change.
;   wall_stun       a target one of your knockbacks drives into a wall gets
;                   `status` (a stun) for amount seconds (players and enemies;
;                   once per knockback).
;   roar_guard      each enemy the ability in applies_to taunts gives you
;                   amount stacks of `status` (a stacking damage reduction).

[tree]

; Branch ids, in display order, and their names.
branches=["tempest_wings", "anchor"]
branch_names=["Tempest Wings", "Anchor"]
; Points this tree can spend (a flat budget, like the Fighter's: each branch
; costs 8 to max: max one, dip into the other).
points=12

[default]

; What a new character starts with (must follow the rules): every Wing
; ability learned.
nodes=["gale_burst", "strong_gusts", "challengers_roar", "thick_hide", "meteor_drop", "unbowed"]
; Abilities in slots Z and C ("" = empty). Each must be unlocked by `nodes`.
slots=["gale_burst", "challengers_roar"]

; --- Tempest Wings: knockback strength and range ---

[node_gale_burst]

name="Gale Burst"
branch="tempest_wings"
tier=1
kind="active"
cost=1
ability="gale_burst"
description="Your wings beat outward: everything within 4 m is knocked back 3.5 m. Costs 20 Ember."

[node_strong_gusts]

name="Strong Gusts"
branch="tempest_wings"
tier=1
kind="passive"
cost=1
effect="force_distance"
amount=0.2
description="Your knockbacks push 20% farther."

[node_meteor_drop]

name="Meteor Drop"
branch="tempest_wings"
tier=2
kind="active"
cost=1
ability="meteor_drop"
description="Leap high and crash down 6 m ahead, launching everything around the landing. Costs 30 Ember."

[node_heavy_landing]

name="Heavy Landing"
branch="tempest_wings"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="meteor_drop"
amount=0.25
description="Meteor Drop deals 25% more damage."

[node_hurricane]

name="Hurricane"
branch="tempest_wings"
tier=3
kind="passive"
cost=2
effect="force_distance"
amount=0.2
description="Your knockbacks push a further 20% farther."

[node_tempest_wings]

name="Tempest Wings"
branch="tempest_wings"
tier=4
kind="passive"
cost=2
effect="wall_stun"
; The status given (data/status_effects.cfg) and its seconds.
status="stun"
amount=1.5
description="Capstone: enemies you knock into a wall are stunned for 1.5 seconds."

; --- Anchor: control and taunt ---

[node_challengers_roar]

name="Challenger's Roar"
branch="anchor"
tier=1
kind="active"
cost=1
ability="challengers_roar"
description="Roar: enemies within 8 m are taunted (they fight you) for 4 seconds and slowed for 3. Costs 25 Ember."

[node_thick_hide]

name="Thick Hide"
branch="anchor"
tier=1
kind="passive"
cost=1
effect="damage_taken"
amount=-0.05
description="Take 5% less damage."

[node_unbowed]

name="Unbowed"
branch="anchor"
tier=2
kind="active"
cost=1
ability="unbowed"
description="Immune to all crowd control for 4 seconds. Costs 25 Ember."

[node_rooted_stance]

name="Rooted Stance"
branch="anchor"
tier=2
kind="passive"
cost=1
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_immovable]

name="Immovable"
branch="anchor"
tier=3
kind="passive"
cost=2
effect="damage_taken"
amount=-0.08
description="Take a further 8% less damage."

[node_anchor]

name="Anchor"
branch="anchor"
tier=4
kind="passive"
cost=2
effect="roar_guard"
applies_to="challengers_roar"
; The stacking buff given (data/status_effects.cfg: Defiant) and the stacks
; per enemy taunted.
status="defiant"
amount=1
description="Capstone: Challenger's Roar gives you 6% damage reduction for each enemy it taunts (up to 5)."
