; Husk: a slow, heavy-hitting melee enemy. Server only (clients just draw it),
; so editing this file only needs a server restart. Times are in seconds.

[stats]

max_health=600.0
; Chasing speed, meters per second.
move_speed=3.5
; Wandering speed around its camp, meters per second.
wander_speed=1.5
; Speed when walking back to its camp after being pulled too far, m/s.
return_speed=6.0
; Degrees per second it turns toward its target (also while winding up a swing).
turn_speed=270.0
; Multiplies the stagger time of hits it takes. 0 = never staggered.
stagger_multiplier=1.0
; Seconds after dying before it respawns at its camp.
respawn_time=10.0

[ai]

; Notices players within this many meters while idle.
aggro_range=8.0
; Gives up and walks home if it gets this far from its camp (meters).
leash_range=25.0
; Starts a swing when its target is this close (meters).
attack_range=1.8
; Seconds between the end of one swing and the start of the next.
attack_cooldown=1.0
; Wanders within this many meters of its camp while idle.
wander_radius=4.0
; Seconds it pauses between wandering moves (random, up to this long).
wander_pause=3.0

[loot]

; Loot table it drops from (a [table_<id>] in data/loot.cfg). Every player who
; damaged it gets their own roll when it dies (personal loot). "" = no loot.
table="husk"

[threat]

; Who it fights. Each player it's fighting has a threat number; it targets the
; highest, but only switches when someone has more than switch_ratio x its
; current target's threat. Dying, leaving, or the Husk walking home (leash)
; wipes a player's threat. A taunt (status "taunted") forces its target to the
; taunter and lifts the taunter's threat to switch_ratio x the highest.
; Threat per point of damage a player deals to it (hits, projectiles, bleed).
per_damage=1.0
; Threat per point of health a player heals onto someone this Husk already has
; threat on (the healer draws aggro).
per_heal=0.5
; Threat a player gets the first time they come within aggro_range, so it
; notices players who haven't hit it yet. Ties go to whoever came close first.
proximity=10.0
; A challenger takes the Husk's attention only with more than this many times
; the current target's threat (1.1 = 10% more). At least 1.
switch_ratio=1.1
; Fraction of every player's threat lost per second (0 = never fades). Applies
; to everyone alike, so it only matters against new threat.
decay_per_second=0.02

[attack]

damage=120.0
; Seconds the player is staggered when hit. 0 = no stagger.
stagger=0.3
block_stamina_damage=35.0
breaks_block=false
; The windup is the telegraph: the Husk glows red while winding up.
windup=0.6
active=0.15
recovery=0.6
; Movement speed while swinging, as a fraction of move_speed.
move_multiplier=0.0
range=2.0
width=1.6
height=2.2
; Knockback on a player it hits (not blocked), meters away from the Husk over
; force_duration seconds. 0 = none. (Keys as in data/weapon_broadsword.cfg; the
; smoke test turns this on to exercise forced movement on players.)
force_direction="away"
force_distance=0.0
force_duration=0.3
; Launch height on a player it hits, meters. 0 = none.
force_height=0.0
; Status put on a player it damages: an id from data/status_effects.cfg, "" =
; none. (The smoke test sets "bleed" to exercise damage over time every run.)
applies_status=""
