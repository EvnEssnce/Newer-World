; Husk: a slow, heavy-hitting melee enemy. Server only (clients just draw it),
; so editing this file only needs a server restart. Times are in seconds.

[stats]

max_health=600.0
; Chasing speed, meters per second.
move_speed=3.5
; Wandering speed around its camp, meters per second.
wander_speed=1.5
; Speed when walking back to its camp after being pulled too far, m/s.
return_speed=6.0
; Degrees per second it turns toward its target (also while winding up a swing).
turn_speed=270.0
; Multiplies the stagger time of hits it takes. 0 = never staggered.
stagger_multiplier=1.0
; Seconds after dying before it respawns at its camp.
respawn_time=10.0

[ai]

; Notices players within this many meters while idle.
aggro_range=8.0
; Gives up and walks home if it gets this far from its camp (meters).
leash_range=25.0
; Starts a swing when its target is this close (meters).
attack_range=1.8
; Seconds between the end of one swing and the start of the next.
attack_cooldown=1.0
; Wanders within this many meters of its camp while idle.
wander_radius=4.0
; Seconds it pauses between wandering moves (random, up to this long).
wander_pause=3.0

[attack]

damage=120.0
; Seconds the player is staggered when hit. 0 = no stagger.
stagger=0.3
block_stamina_damage=35.0
breaks_block=false
; The windup is the telegraph: the Husk glows red while winding up.
windup=0.6
active=0.15
recovery=0.6
; Movement speed while swinging, as a fraction of move_speed.
move_multiplier=0.0
range=2.0
width=1.6
height=2.2
