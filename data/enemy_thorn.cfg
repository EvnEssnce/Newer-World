; Thornling: a small, fast pack skirmisher. It darts in with a lunging bite
; that bleeds, then backs off until its next bite (hit-and-run). Camps of two.
; Server only (clients just draw it), so editing this file only needs a server
; restart. Times are in seconds.

[stats]

; Shown over it (its name label).
name="Thornling"
; Health points.
max_health=320.0
; Chasing speed, meters per second.
move_speed=5.5
; Wandering speed around its camp, meters per second.
wander_speed=2.0
; Speed when walking back to its camp after being pulled too far, m/s.
return_speed=7.0
; Degrees per second it turns toward its target (also while winding up a bite).
turn_speed=540.0
; Multiplies the stagger time of hits it takes. 0 = never staggered. Above 1:
; light, easily knocked off balance.
stagger_multiplier=1.2
; Seconds after dying before it respawns at its camp.
respawn_time=12.0
; Seconds without taking damage before it heals to full and goes back to its
; camp. 0 = never (it heals when it walks home after leashing instead).
reset_time=0.0
; Its "weapon" gear score: how well its bites get through players' armor
; (data/gear.cfg [armor]). Doesn't change its damage.
gear_score=125

[ai]

; Notices players within this many meters while idle. Keep it at 10 or less so
; its camp doesn't pull players walking past the middle of the test map.
aggro_range=9.0
; Gives up and walks home if it gets this far from its camp (meters).
leash_range=22.0
; Starts a bite when its target is this close (meters). Farther than the bite's
; reach (range below) because it lunges forward while biting.
attack_range=2.4
; Seconds between the end of one bite and the start of the next.
attack_cooldown=1.4
; Between bites (while attack_cooldown runs) it backs away from a target nearer
; than this many meters, still facing it, then circles back in. 0 = stands its ground.
keep_distance=4.0
; Speed while backing away, meters per second.
retreat_speed=4.0
; Wanders within this many meters of its camp while idle.
wander_radius=3.0
; Seconds it pauses between wandering moves (random, up to this long).
wander_pause=2.0
; true = never moves, turns or swings (the training dummy). false for real enemies.
stationary=false

[navigation]

; Walking around obstacles (crates, a Shield Wall) on the server's navigation
; mesh (map-wide settings in data/navigation.cfg). false = walks straight at
; its target and stalls against whatever is in the way.
enabled=true
; Seconds between asking for a new path while walking somewhere.
repath_interval=0.5
; Also asks for a new path when its target has moved this many meters from
; where the current path ends.
repath_distance=1.0
; Meters from a path corner at which it counts as reached (heads for the next).
waypoint_reach=0.3

[loot]

; Loot table it drops from (a [table_<id>] in data/loot.cfg). Every player who
; damaged it gets their own roll when it dies (personal loot). "" = no loot.
table="thorn"

[progression]

; Character XP every player who damaged it gets when it dies (XP points; each
; contributor gets the whole amount). Character level 1 -> 2 takes 400
; (data/progression.cfg).
kill_xp=40
; Weapon mastery XP every contributor gets when it dies (XP points), split over
; the weapons that dealt their damage by how much each dealt (Wing abilities
; count for no weapon). Mastery level 1 -> 2 takes 200.
mastery_xp=30

[threat]

; Who it fights. Each player it's fighting has a threat number; it targets the
; highest, but only switches when someone has more than switch_ratio x its
; current target's threat. Dying, leaving, or it walking home (leash) wipes a
; player's threat. A taunt (status "taunted") forces its target to the taunter
; and lifts the taunter's threat to switch_ratio x the highest.
; Threat per point of damage a player deals to it (hits, projectiles, bleed).
per_damage=1.0
; Threat per point of health a player heals onto someone it already has threat
; on (the healer draws aggro).
per_heal=0.5
; Threat a player gets the first time they come within aggro_range, so it
; notices players who haven't hit it yet. Ties go to whoever came close first.
proximity=10.0
; A challenger takes its attention only with more than this many times the
; current target's threat (1.1 = 10% more). At least 1.
switch_ratio=1.1
; Fraction of every player's threat lost per second (0 = never fades). Applies
; to everyone alike, so it only matters against new threat.
decay_per_second=0.02

[attack]

; A quick lunging bite. Health damage on a player it hits (before armor).
damage=55.0
; Seconds the player is staggered when hit. 0 = no stagger.
stagger=0.15
; Stamina a blocking player loses instead of health.
block_stamina_damage=20.0
; true = the bite breaks a raised guard (guard-break stagger). It doesn't.
breaks_block=false
; The windup is the telegraph: it glows red while winding up. Short: watch it.
windup=0.35
; Seconds the bite's hitbox is live.
active=0.15
; Seconds after the bite before it can do anything else (then it backs off).
recovery=0.35
; Movement speed while biting, as a fraction of move_speed: it keeps closing
; in during the whole bite (the lunge).
move_multiplier=0.8
; The bite's hitbox in front of it, meters: reach forward, width, height.
range=1.6
width=1.2
height=1.6
; Knockback on a player it hits (not blocked), meters away from it over
; force_duration seconds. 0 = none.
force_direction="away"
force_distance=0.0
force_duration=0.2
; Launch height on a player it hits, meters. 0 = none.
force_height=0.0
; Status put on a player it damages (not blocked, evaded or parried): an id
; from data/status_effects.cfg, "" = none. Each bite adds a Bleed stack.
applies_status="bleed"
