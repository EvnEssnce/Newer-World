; Juggernaut class: a melee tank that controls the fight by moving enemies
; around. Picked per character with the --class=juggernaut launch flag (or
; run_local_test.ps1 -Class juggernaut) and fixed. The server only lets a
; Juggernaut equip the weapons listed here. Server and clients both read this
; file.

[class]

; Shown in the UI.
name="Juggernaut"
; Every weapon this class can equip (ids of data/weapon_<id>.cfg). No other
; class can use them.
weapons=["halberd", "greataxe", "war_hammer"]
; The two weapons a new character starts with equipped, in slot order (the first
; one is out at spawn; X swaps to the second).
default_loadout=["halberd", "war_hammer"]

[level_bonus]

; Each character level past a full Wing tree (levels 21-30: the Wing points the
; level gives beyond the tree's [tree] points, data/progression.cfg) is one
; bonus point for this stat. Server decides; the K panel's Wings tab shows it.
; stat: one of max_health, damage, move_speed, dodge_cost, ember_cost, healing.
stat="max_health"
; Health points each point adds to max health (20: +200 at level 30).
per_point=20.0
