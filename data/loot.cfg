; Rarity tiers and loot tables. Server only: restart the server after editing.
; Run tools\roll_loot.ps1 to see what a table actually drops over 50,000 kills.

[rarities]

; Best last. Loot tables weight these by id.
order=["common", "rare", "epic", "legendary"]

; Each tier: how many bonus stats (affixes, see data/affixes.cfg) an item of that
; rarity rolls, and the color its name is shown in.
[common]
name="Common"
affixes=0
color=Color(0.85, 0.85, 0.85, 1)

[rare]
name="Rare"
affixes=1
color=Color(0.3, 0.6, 1.0, 1)

[epic]
name="Epic"
affixes=2
color=Color(0.7, 0.35, 0.95, 1)

[legendary]
name="Legendary"
affixes=3
color=Color(1.0, 0.6, 0.15, 1)

; --- Drops on the ground and the inventory ---

[drops]

; Seconds a drop stays on the ground before it disappears.
lifetime=120.0
; Meters (horizontal) from a drop within which F picks it up.
pickup_range=2.5
; Meters from where the enemy died that each drop lands, in a random direction
; (so it isn't hidden under the body, and several players' drops spread out).
scatter=1.0

[inventory]

; Item slots in a player's inventory. A full inventory leaves loot on the ground.
slots=40

; --- Loot tables (one section each, named table_<id>) ---
; drop_chance: chance (0-1) that a kill drops anything, rolled separately for each
;   player who damaged the enemy (personal loot).
; rolls: items per drop.
; gear_score_min/max: each item's gear score is rolled evenly in this range.
; items: item id (data/items.cfg) -> relative weight.
; rarity_weights: rarity id -> relative weight.

[table_husk]
drop_chance=0.6
rolls=1
gear_score_min=101
gear_score_max=140
items={"iron_broadsword": 4, "iron_spear": 4, "iron_hatchets": 4, "iron_halberd": 4, "iron_greataxe": 4, "iron_maul": 4, "iron_talons": 4, "iron_knives": 4, "ashwood_longbow": 4, "iron_crossbow": 4, "cinder_wraps": 4, "emberwood_staff": 4, "lifeweave_gauntlet": 4, "oakheart_shortstaffs": 4, "dawnwood_longstaff": 4, "padded_cap": 8, "padded_jerkin": 8, "padded_leggings": 8, "cinder_plumes": 5, "ironquill_pinions": 5, "ashen_vanes": 5, "galeborn_plumes": 5, "sunfire_pinions": 5, "halo_pinions": 5}
rarity_weights={"common": 78, "rare": 18, "epic": 3.3, "legendary": 0.7}

; --- Camp enemies (Milestone 6, build order 5.1): higher gear score bands than
; the Husk's, for characters from about level 10 to 30. Same item pool.

; Thornling (data/enemy_thorn.cfg): fast pack skirmishers, two to a camp. Weak
; alone, so a lower drop chance than the Husk's but a higher gear score band.
[table_thorn]
drop_chance=0.45
rolls=1
gear_score_min=110
gear_score_max=150
items={"iron_broadsword": 4, "iron_spear": 4, "iron_hatchets": 4, "iron_halberd": 4, "iron_greataxe": 4, "iron_maul": 4, "iron_talons": 6, "iron_knives": 6, "ashwood_longbow": 6, "iron_crossbow": 4, "cinder_wraps": 4, "emberwood_staff": 4, "lifeweave_gauntlet": 4, "oakheart_shortstaffs": 4, "dawnwood_longstaff": 4, "padded_cap": 8, "padded_jerkin": 8, "padded_leggings": 8, "cinder_plumes": 5, "ironquill_pinions": 5, "ashen_vanes": 5, "galeborn_plumes": 5, "sunfire_pinions": 5, "halo_pinions": 5}
rarity_weights={"common": 70, "rare": 24, "epic": 5, "legendary": 1}

; Cinder Seer (data/enemy_seer.cfg): ranged casters. Leans to caster weapons and
; Wing Enhancements.
[table_seer]
drop_chance=0.6
rolls=1
gear_score_min=120
gear_score_max=160
items={"iron_broadsword": 3, "iron_spear": 3, "iron_hatchets": 3, "iron_halberd": 3, "iron_greataxe": 3, "iron_maul": 3, "iron_talons": 3, "iron_knives": 3, "ashwood_longbow": 3, "iron_crossbow": 3, "cinder_wraps": 6, "emberwood_staff": 6, "lifeweave_gauntlet": 6, "oakheart_shortstaffs": 6, "dawnwood_longstaff": 6, "padded_cap": 6, "padded_jerkin": 6, "padded_leggings": 6, "cinder_plumes": 7, "ironquill_pinions": 7, "ashen_vanes": 7, "galeborn_plumes": 7, "sunfire_pinions": 7, "halo_pinions": 7}
rarity_weights={"common": 62, "rare": 28, "epic": 8, "legendary": 2}

; Cragmaw (data/enemy_crag.cfg): a lone bruiser with a long respawn. Always
; drops, two items, the best band and odds of the camps.
[table_crag]
drop_chance=1.0
rolls=2
gear_score_min=135
gear_score_max=175
items={"iron_broadsword": 4, "iron_spear": 4, "iron_hatchets": 4, "iron_halberd": 5, "iron_greataxe": 5, "iron_maul": 5, "iron_talons": 4, "iron_knives": 4, "ashwood_longbow": 4, "iron_crossbow": 4, "cinder_wraps": 4, "emberwood_staff": 4, "lifeweave_gauntlet": 4, "oakheart_shortstaffs": 4, "dawnwood_longstaff": 4, "padded_cap": 9, "padded_jerkin": 9, "padded_leggings": 9, "cinder_plumes": 5, "ironquill_pinions": 5, "ashen_vanes": 5, "galeborn_plumes": 5, "sunfire_pinions": 5, "halo_pinions": 5}
rarity_weights={"common": 45, "rare": 38, "epic": 14, "legendary": 3}
