; How an enemy's numbers grow with its gear score. Every kind's file
; (data/enemy_<kind>.cfg) holds its stats at its own [stats] gear_score; a camp
; placed at another gear score (a world marker's metadata/gear_score, later a
; zone's) scales them by (1 + rate) per 5 gear score above (or below) that:
; e.g. a rate of 0.016 is x1.38 at +100 GS and x4.9 at +500. Speeds, timings,
; ranges and AI never scale (they're the kind's feel). Its gear score also sets
; how well its hits get through armor (data/gear.cfg) and its drops' gear score
; (data/loot.cfg). Server and clients read it: restart both after editing.

[scaling]

; Max health growth per 5 gear score (fraction). Steeper than players' damage
; curve (0.0112, data/gear.cfg), since players also gain from levels and trees.
health_per_5=0.016
; Hit damage (and the stamina a blocked hit costs) growth per 5 gear score
; (fraction). 0.0112 matches the gear score curve players' weapons follow.
damage_per_5=0.0112
; Kill XP and mastery XP growth per 5 gear score (fraction).
xp_per_5=0.016
