; Greataxe, a Juggernaut weapon: a two-handed axe. Heavy, wide cleaves; pulls
; enemies in, then punishes the clump. Slower and heavier than the Fighter's
; weapons. The server and the client's own prediction both read this file:
; restart the server AND clients after editing. Times are in seconds (rounded
; to physics ticks, 60 per second), distances in meters. See
; data/weapon_broadsword.cfg for what every key means.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Greataxe"
; Placeholder model to draw (cosmetic only): a big two-handed axe.
model="greataxe"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.0
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_greataxe.cfg.
abilities=["vortex", "charging_chop", "grounding_blow", "executioners_swing", "iron_hide", "hurl"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack (slower
; than the Fighter's 720: a heavy weapon).
turn_speed=540.0

[light]

; A wide diagonal cleave: shorter than the Halberd, much wider.
damage=100.0
stagger=0.0
block_stamina_damage=25.0
breaks_block=false
windup=0.26
active=0.14
recovery=0.45
move_multiplier=0.35
; Meters forward from your center, meters wide, meters tall.
range=2.2
width=2.8
height=2.0

[heavy]

; A huge overhead chop.
damage=260.0
stagger=0.5
block_stamina_damage=55.0
breaks_block=true
windup=0.6
active=0.15
recovery=0.7
move_multiplier=0.1
range=2.6
width=2.2
height=2.4

; --- Abilities ---

[ability_vortex]

; Spin with the axe held out: each of the hit windows hits everything around
; you and pulls it in toward you (stopping [force] pull_gap short, see
; data/combat.cfg). The Maelstrom capstone doubles the radius (server).
name="Vortex"
cooldown=12.0
; Per hit window: a target caught by all three takes 3x this.
damage=70.0
stagger=0.0
block_stamina_damage=20.0
breaks_block=false
windup=0.25
; Each hit window lasts this long...
active=0.1
; ...there are this many...
windows=3
; ...and one starts every this many seconds.
window_interval=0.2
recovery=0.45
; You can still walk (slowly) while spinning.
move_multiplier=0.4
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=3.5
width=0.0
height=2.0
; Pulled up to this many meters toward you per window (ends pull_gap short).
force_direction="toward"
force_distance=6.0
force_duration=0.25

[ability_charging_chop]

; Run forward, then finish with a chop where you stop. The chop's hit window
; starts right after the run ends.
name="Charging Chop"
cooldown=10.0
damage=180.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=false
windup=0.55
active=0.15
recovery=0.5
move_multiplier=0.0
turn_speed=0.0
shape="box"
range=2.4
width=2.2
height=2.2
; Meters run forward, from dash_start to dash_end (seconds from the start).
dash_distance=6.0
dash_start=0.05
dash_end=0.5

[ability_grounding_blow]

; Slam the axe into the ground: hits everything around you and slows it.
name="Grounding Blow"
cooldown=11.0
damage=110.0
stagger=0.2
block_stamina_damage=30.0
breaks_block=false
windup=0.4
active=0.12
recovery=0.5
move_multiplier=0.1
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=3.2
width=0.0
height=2.0
applies_status="slow"
; Seconds slowed (instead of the status's own 3 s).
status_duration=3.0

[ability_executioners_swing]

; A heavy finishing swing that deals more damage to targets low on health.
name="Executioner's Swing"
cooldown=10.0
damage=170.0
stagger=0.3
block_stamina_damage=40.0
breaks_block=false
windup=0.5
active=0.15
recovery=0.55
move_multiplier=0.1
turn_speed=360.0
shape="box"
range=2.6
width=2.4
height=2.4
; Below execute_threshold of the target's max health (fraction) this hit
; deals more damage, growing linearly from 0 at the threshold to
; execute_damage (fraction, 1.5 = +150%) at 0 health. Server only.
execute_damage=1.5
execute_threshold=0.3

[ability_iron_hide]

; Harden yourself: no hit of its own. Gives you Iron Hide
; (data/status_effects.cfg): less damage taken for every enemy near you.
name="Iron Hide"
cooldown=16.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.15
active=0.1
recovery=0.25
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="iron_hide"

[ability_hurl]

; Throw the greataxe (data/projectiles.cfg [projectile_greataxe]). It stops
; at the first target and slows it. The axe is back in your hands once its
; flight ends (no pickup yet).
name="Hurl"
cooldown=10.0
damage=120.0
stagger=0.2
block_stamina_damage=30.0
breaks_block=false
windup=0.3
active=0.05
recovery=0.4
move_multiplier=0.4
turn_speed=540.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="greataxe"
; Seconds from the start that it leaves your hands.
projectile_time=0.28
applies_status="slow"
; Seconds slowed (instead of the status's own 3 s).
status_duration=5.0
