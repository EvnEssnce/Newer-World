; Character progression (ProgressionDefs, game/progression/): a character level
; and, per weapon type, a weapon mastery level, each with XP into it. The server
; decides all of it. Restart the server and clients after editing.
;
; Every character starts at character level 1 and mastery level 1 in every
; weapon, with 0 XP. A level goes up when its XP reaches the XP to the next level;
; leftover XP carries over, and XP earned at the cap is dropped.
;
; Build order item 4. So far only the levels, XP and saving exist: nothing grants
; XP yet, and the trees still get their full points (data/mastery.cfg [rules]
; points, [tree] points in mastery_wings_<class>.cfg).

[character]

; Highest character level.
level_cap=20
; XP needed to go from character level L to L + 1 = round(xp_base * L ^ xp_exponent).
; With 400 and 1.5: level 1 -> 2 takes 400 XP, 5 -> 6 about 4,470, 10 -> 11
; about 12,650, 19 -> 20 about 33,100 (about 270,000 from 1 to 20).
; XP points (xp_base) and a unitless power (xp_exponent).
xp_base=400.0
xp_exponent=1.5
; Wing tree points per character level after the first (points; level L has
; (L - 1) x this). The Wing tree's own [tree] points still caps what's spent:
; with 1 and a 12-point tree, the tree is full at level 13.
wing_points_per_level=1

[weapon_mastery]

; Highest mastery level of one weapon type.
level_cap=20
; XP needed to go from mastery level L to L + 1 = round(xp_base * L ^ xp_exponent).
; With 200 and 1.5: level 1 -> 2 takes 200 XP, 10 -> 11 about 6,320, 19 -> 20
; about 16,560 (about 135,000 from 1 to 20).
; XP points (xp_base) and a unitless power (xp_exponent).
xp_base=200.0
xp_exponent=1.5
; That weapon's mastery tree points per mastery level after the first (points;
; level L has (L - 1) x this). With 1 and a cap of 20: 19 points, the full
; budget in data/mastery.cfg [rules] points.
points_per_level=1
