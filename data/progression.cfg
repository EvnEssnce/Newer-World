; Character progression (ProgressionDefs, game/progression/): a character level
; and, per weapon type, a weapon mastery level, each with XP into it. The server
; decides all of it. Restart the server and clients after editing.
;
; Every character starts at character level 1 and mastery level 1 in every
; weapon, with 0 XP. A level goes up when its XP reaches the XP to the next level;
; leftover XP carries over, and XP earned at the cap is dropped.
;
; XP comes from kills (each enemy file's [progression]: kill_xp for the character,
; mastery_xp for the weapons that dealt the damage) and gathering ([sources]
; below). The levels give the tree points: a weapon tree may spend
; start_points + (mastery level - 1) x points_per_level, the Wing tree
; wing_start_points + (character level - 1) x wing_points_per_level, never more
; than the tree's own budget (data/mastery.cfg [rules] points, [tree] points in
; mastery_wings_<class>.cfg). A build over that is cut down when the character
; joins (a free respec). data/testing.cfg [progression] full_points gives every
; tree its full budget instead (bots, playtests).

[character]

; Highest character level.
level_cap=30
; XP needed to go from character level L to L + 1 = round(xp_base * L ^ xp_exponent).
; With 400 and 1.5: level 1 -> 2 takes 400 XP, 5 -> 6 about 4,470, 10 -> 11
; about 12,650, 29 -> 30 about 62,500 (about 756,000 from 1 to 30).
; XP points (xp_base) and a unitless power (xp_exponent).
xp_base=400.0
xp_exponent=1.5
; Wing tree points at character level 1 (points).
wing_start_points=2
; Wing tree points per character level after the first (points; level L has
; wing_start_points + (L - 1) x this). The Wing tree's own [tree] points still
; caps what's spent: with 2, 1 and a 12-point tree, the tree is full at level 11.
wing_points_per_level=1

[weapon_mastery]

; Highest mastery level of one weapon type.
level_cap=20
; XP needed to go from mastery level L to L + 1 = round(xp_base * L ^ xp_exponent).
; With 200 and 1.5: level 1 -> 2 takes 200 XP, 10 -> 11 about 6,320, 19 -> 20
; about 16,560 (about 135,000 from 1 to 20).
; XP points (xp_base) and a unitless power (xp_exponent).
xp_base=200.0
xp_exponent=1.5
; That weapon's mastery tree points at mastery level 1 (points).
start_points=3
; That weapon's mastery tree points per mastery level after the first (points;
; level L has start_points + (L - 1) x this). With 3, 1 and data/mastery.cfg's
; 19 points, the tree is full at mastery level 17.
points_per_level=1

[sources]

; Character XP for each finished gather, any node kind (XP points). Kill XP is in
; each enemy file ([progression] kill_xp).
gather_xp=15
