; Longbow mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's:
;   heavy_pierce  (server) heavy shots with this weapon pierce `amount` targets
;   free_draw     light and heavy attacks with this weapon don't slow your
;                 walking. The one tree effect that reaches the predicted
;                 simulation: the server puts it into PlayerState (a server
;                 event, like ability slots).

[tree]

; Branch ids, in display order, and their names.
branches=["marksman", "skirmisher"]
branch_names=["Marksman", "Skirmisher"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["piercing_shot", "steady_aim", "hunters_mark", "arrow_rain", "backstep_shot", "quick_shots", "snare_arrow", "rapid_nock"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["piercing_shot", "snare_arrow", "backstep_shot"]

; --- Marksman: charged and precision shots ---

[node_piercing_shot]

name="Piercing Shot"
branch="marksman"
tier=1
kind="active"
cost=1
ability="piercing_shot"
description="An arrow that passes through up to 4 targets."

[node_steady_aim]

name="Steady Aim"
branch="marksman"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.15
description="Full-draw (heavy) shots deal 15% more damage."

[node_hunters_mark]

name="Hunter's Mark"
branch="marksman"
tier=2
kind="active"
cost=1
ability="hunters_mark"
description="Mark a target: it takes 15% more damage from you for 8 s."

[node_arrow_rain]

name="Arrow Rain"
branch="marksman"
tier=2
kind="active"
cost=1
ability="arrow_rain"
description="Seven arrows lobbed onto an area about 14 m ahead."

[node_eagle_eye]

name="Eagle Eye"
branch="marksman"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Longbow abilities deal 10% more damage."

[node_deadeye]

name="Deadeye"
branch="marksman"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="heavy"
amount=0.1
description="Full-draw shots deal another 10% more damage."

[node_true_flight]

name="True Flight"
branch="marksman"
tier=4
kind="passive"
cost=2
effect="heavy_pierce"
amount=20
description="Capstone: full-draw shots pierce through every target in a line."

; --- Skirmisher: quick shots and moving while you shoot ---

[node_backstep_shot]

name="Backstep Shot"
branch="skirmisher"
tier=1
kind="active"
cost=1
ability="backstep_shot"
description="Hop 3.5 m backward and fire."

[node_quick_shots]

name="Quick Shots"
branch="skirmisher"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Quick (light) shots deal 10% more damage."

[node_snare_arrow]

name="Snare Arrow"
branch="skirmisher"
tier=2
kind="active"
cost=1
ability="snare_arrow"
description="Root the first target hit for 1.5 s."

[node_rapid_nock]

name="Rapid Nock"
branch="skirmisher"
tier=2
kind="active"
cost=1
ability="rapid_nock"
description="Your shots fire much faster for 4 s."

[node_fleet_archer]

name="Fleet Archer"
branch="skirmisher"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your Longbow attacks deal 5% more damage."

[node_nimble_guard]

name="Nimble Guard"
branch="skirmisher"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina while the Longbow is out."

[node_running_shot]

name="Running Shot"
branch="skirmisher"
tier=4
kind="passive"
cost=2
effect="free_draw"
description="Capstone: no movement slowdown while drawing or shooting."
