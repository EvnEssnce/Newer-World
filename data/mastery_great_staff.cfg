; Great Staff mastery tree. Server and clients both read this file. Rules
; (point budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (server):
;   zone_grow     your pulse zones that apply the status `applies_to` (burning
;                 ground) grow by amount x their size each pulse, up to
;                 `threshold` x
;   focus_refund  an ability started within `threshold` s of landing a heavy
;                 (a charged cast) refunds its Ember cost

[tree]

; Branch ids, in display order, and their names.
branches=["conflagration", "focus"]
branch_names=["Conflagration", "Focus"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["meteor_fall", "kindled_staff", "flame_wall", "pyroclasm", "firebrand", "steady_focus", "searing_ray", "blink"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["firebrand", "meteor_fall", "searing_ray"]

; --- Conflagration: area and burns ---

[node_meteor_fall]

name="Meteor Fall"
branch="conflagration"
tier=1
kind="active"
cost=1
ability="meteor_fall"
description="A meteor strikes 10 m ahead after 1.2 s: 220 damage in 3.5 m."

[node_kindled_staff]

name="Kindled Staff"
branch="conflagration"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Fire bolts deal 10% more damage."

[node_flame_wall]

name="Flame Wall"
branch="conflagration"
tier=2
kind="active"
cost=1
ability="flame_wall"
description="A 6 m line of fire 5 m ahead for 5 s: whatever crosses it burns."

[node_pyroclasm]

name="Pyroclasm"
branch="conflagration"
tier=2
kind="active"
cost=1
ability="pyroclasm"
description="A point-blank blast that knocks everything around you 4 m away."

[node_cinder_storm]

name="Cinder Storm"
branch="conflagration"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Great Staff abilities deal 10% more damage."

[node_heat_haze]

name="Heat Haze"
branch="conflagration"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina while the staff is out."

[node_wildfire_spread]

name="Wildfire Spread"
branch="conflagration"
tier=4
kind="passive"
cost=2
effect="zone_grow"
applies_to="burn"
amount=0.15
; Grows at most to this many times its size.
threshold=2.0
description="Capstone: your burning ground spreads, growing 15% each pulse up to twice its size."

; --- Focus: single target and charged spells ---

[node_firebrand]

name="Firebrand"
branch="focus"
tier=1
kind="active"
cost=1
ability="firebrand"
description="A fast bolt that applies 2 stacks of Burn. Costs 5 Ember."

[node_steady_focus]

name="Steady Focus"
branch="focus"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.15
description="Charged fireballs (heavy) deal 15% more damage."

[node_searing_ray]

name="Searing Ray"
branch="focus"
tier=2
kind="active"
cost=1
ability="searing_ray"
description="A 10 m channeled beam whose six pulses each hit 30% harder than the last."

[node_blink]

name="Blink"
branch="focus"
tier=2
kind="active"
cost=1
ability="blink"
description="Teleport 7 m the way you're moving."

[node_arcane_edge]

name="Arcane Edge"
branch="focus"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.06
description="All your Great Staff attacks deal 6% more damage."

[node_burning_focus]

name="Burning Focus"
branch="focus"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="searing_ray"
amount=0.2
description="Searing Ray deals 20% more damage."

[node_clear_mind]

name="Clear Mind"
branch="focus"
tier=4
kind="passive"
cost=2
effect="focus_refund"
; Seconds after a heavy hit.
threshold=3.0
description="Capstone: an ability cast within 3 s of landing a charged fireball costs no Ember."
