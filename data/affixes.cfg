; Bonus stats (affixes) that items roll by rarity. No attributes (design decision);
; these modify combat numbers directly. Server only: restart the server after editing.
;
; One section per affix. An item never rolls the same affix twice, and only rolls
; affixes whose slots include its own slot.
; min_per_100_gs / max_per_100_gs: the value is rolled evenly between these, then
;   multiplied by gear_score / 100. Percent stats are fractions (0.05 = +5%).

[damage]
name="Blaze"
stat="damage_pct"
min_per_100_gs=0.02
max_per_100_gs=0.06
slots=["weapon", "hands"]

[crit]
name="Sear"
stat="crit_chance"
min_per_100_gs=0.01
max_per_100_gs=0.04
slots=["weapon", "hands", "head"]

[vitality]
name="Hearth"
stat="max_health"
min_per_100_gs=20.0
max_per_100_gs=60.0
slots=["head", "chest", "legs"]

[endurance]
name="Ferocity"
stat="max_stamina"
min_per_100_gs=4.0
max_per_100_gs=12.0
slots=["chest", "legs", "feet"]

[recovery]
name="Rage"
stat="stamina_regen_pct"
min_per_100_gs=0.04
max_per_100_gs=0.12
slots=["chest", "feet"]

[warding]
name="Scorch"
; Blocked hits cost this much less stamina.
stat="block_stamina_reduction"
min_per_100_gs=0.04
max_per_100_gs=0.10
slots=["weapon", "hands", "chest"]
