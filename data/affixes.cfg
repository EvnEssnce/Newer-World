; Bonus stats (affixes) that items roll by rarity. No attributes (design decision);
; these modify combat numbers directly. Server and clients both read this file.
;
; One section per affix. An item never rolls the same affix twice, and only rolls
; affixes whose slots include its own slot (weapon, head, chest, legs, wings).
; min_per_100_gs / max_per_100_gs: the value is rolled evenly between these, then
;   multiplied by gear_score / 100. Percent stats are fractions (0.05 = +5%).

[damage]
name="Blaze"
; More damage with every attack and ability (Wing abilities included).
stat="damage_pct"
min_per_100_gs=0.02
max_per_100_gs=0.06
slots=["weapon", "wings"]

[crit]
name="Sear"
; Chance for a hit to crit (x [crit] damage_multiplier in data/combat.cfg).
stat="crit_chance"
min_per_100_gs=0.01
max_per_100_gs=0.04
slots=["weapon", "head", "wings"]

[vitality]
name="Hearth"
stat="max_health"
min_per_100_gs=20.0
max_per_100_gs=60.0
slots=["head", "chest", "legs"]

[warding]
name="Scorch"
; Blocked hits cost this much less stamina.
stat="block_stamina_reduction"
min_per_100_gs=0.04
max_per_100_gs=0.10
slots=["weapon", "chest", "legs"]

[mending]
name="Tend"
; More healing received (Pyre Heart, the Mantle of Renewal, allies' heals).
stat="healing_pct"
min_per_100_gs=0.03
max_per_100_gs=0.08
slots=["head", "chest", "legs"]

[kindling]
name="Kindle"
; More Ember gained (from damage dealt and taken, and from healing).
stat="ember_gain_pct"
min_per_100_gs=0.03
max_per_100_gs=0.08
slots=["head", "wings"]

; Off until stamina gear stats are built (stamina is predicted by the client, so
; these need to be synced first): slots=[] means nothing rolls them.

[endurance]
name="Ferocity"
stat="max_stamina"
min_per_100_gs=4.0
max_per_100_gs=12.0
slots=[]

[recovery]
name="Rage"
stat="stamina_regen_pct"
min_per_100_gs=0.04
max_per_100_gs=0.12
slots=[]
