; Cragmaw: a lone, slow, rock-hided bruiser; a mini-boss for a group or a strong
; solo player. Its one attack is a slow frontal ground slam that breaks guards
; and knocks back: dodge the long red windup, then punish the recovery or get
; behind it (it turns slowly). Server only (clients just draw it), so editing
; this file only needs a server restart. Times are in seconds.

[stats]

; Name shown over it.
name="Cragmaw"
; Health points.
max_health=2400.0
; Chasing speed, meters per second (slower than a walking player).
move_speed=2.6
; Wandering speed around its spot, meters per second.
wander_speed=1.0
; Speed when walking back to its spot after being pulled too far, m/s.
return_speed=5.0
; Degrees per second it turns toward its target (also while winding up a slam).
; Slow on purpose: players can circle it and hit its sides and back.
turn_speed=150.0
; Multiplies the stagger time of hits it takes (0.25 = a quarter as long).
; 0 = never staggered.
stagger_multiplier=0.25
; Seconds after dying before it respawns at its spot.
respawn_time=45.0
; Seconds without taking damage before it heals to full and goes back to its
; spot. 0 = never (it heals when it walks home after leashing instead).
reset_time=0.0
; Its "weapon" gear score: how well its slams get through players' armor
; (data/gear.cfg [armor]). Doesn't change its damage. Higher than the Husk's 120.
gear_score=160

[ai]

; Notices players within this many meters while idle. Keep at most 8 so it
; doesn't pull players just walking past.
aggro_range=7.0
; Gives up and walks home if it gets this far from its spot (meters).
leash_range=18.0
; Starts a slam when its target is this close (meters).
attack_range=2.6
; Seconds between the end of one slam and the start of the next.
attack_cooldown=1.8
; Wanders within this many meters of its spot while idle.
wander_radius=3.0
; Seconds it pauses between wandering moves (random, up to this long).
wander_pause=4.0
; true = never moves, turns or swings (the training dummy). false for real enemies.
stationary=false

[navigation]

; Walking around obstacles (crates, a Shield Wall) on the server's navigation
; mesh (map-wide settings in data/navigation.cfg). false = walks straight at
; its target and stalls against whatever is in the way.
enabled=true
; Seconds between asking for a new path while walking somewhere.
repath_interval=0.5
; Also asks for a new path when its target has moved this many meters from
; where the current path ends.
repath_distance=1.0
; Meters from a path corner at which it counts as reached (heads for the next).
waypoint_reach=0.3

[loot]

; Loot table it drops from (a [table_<id>] in data/loot.cfg). Every player who
; damaged it gets their own roll when it dies (personal loot). "" = no loot.
table="crag"

[progression]

; Character XP every player who damaged it gets when it dies (XP points; each
; contributor gets the whole amount). Character level 1 -> 2 takes 400
; (data/progression.cfg).
kill_xp=220
; Weapon mastery XP every contributor gets when it dies (XP points), split over
; the weapons that dealt their damage by how much each dealt (Wing abilities
; count for no weapon). Mastery level 1 -> 2 takes 200.
mastery_xp=160

[threat]

; Who it fights. Each player it's fighting has a threat number; it targets the
; highest, but only switches when someone has more than switch_ratio x its
; current target's threat. Dying, leaving, or it walking home (leash) wipes a
; player's threat. A taunt (status "taunted") forces its target to the taunter
; and lifts the taunter's threat to switch_ratio x the highest.
; Threat per point of damage a player deals to it (hits, projectiles, bleed).
per_damage=1.0
; Threat per point of health a player heals onto someone it already has
; threat on (the healer draws aggro).
per_heal=0.5
; Threat a player gets the first time they come within aggro_range, so it
; notices players who haven't hit it yet. Ties go to whoever came close first.
proximity=10.0
; A challenger takes its attention only with more than this many times the
; current target's threat (1.1 = 10% more). At least 1.
switch_ratio=1.1
; Fraction of every player's threat lost per second (0 = never fades). Applies
; to everyone alike, so it only matters against new threat.
decay_per_second=0.02

[attack]

; The ground slam: both fists come down in a cone in front of it.
; Damage points per hit (before the player's armor).
damage=240.0
; Seconds the player is staggered when hit. 0 = no stagger.
stagger=0.8
; Stamina a blocking player loses instead of health (a guard break takes it too).
block_stamina_damage=70.0
; true = a raised guard doesn't save you: the slam breaks it (guard-break stagger).
breaks_block=true
; Seconds of windup: the telegraph (it glows red and raises its fists). Long,
; so it's the cue to dodge out of the cone or behind it.
windup=1.2
; Seconds the hitbox is live (the fists hitting the ground).
active=0.15
; Seconds before it can act again after the slam: the punish window.
recovery=1.0
; Movement speed while slamming, as a fraction of move_speed (0 = plants its feet).
move_multiplier=0.0
; "radial" = a circle around it; with arc, only that part of it in front (a cone).
shape="radial"
; Width of the cone in front, degrees (0 = the whole circle).
arc=120.0
; Radius of the slam, meters from its center.
range=3.2
; Unused by a radial slam (a box attack's width, meters); required by the loader.
width=3.2
; Height of the hitbox from its feet, meters.
height=2.2
; Knockback on a player it hits (not blocked): "away" from it, meters over
; force_duration seconds. 0 = none.
force_direction="away"
force_distance=3.0
force_duration=0.35
; Launch height on a player it hits, meters. 0 = none.
force_height=0.0
; Status put on a player it damages: an id from data/status_effects.cfg, "" = none.
applies_status=""
