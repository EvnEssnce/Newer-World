; Longstaff mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (server):
;   zone_ally_status  allies in your zone of the kind `applies_to` get `status`
;                     each pulse
;   judgment_mark     an enemy whose swing reaches an ally of yours standing in
;                     your zone of the kind `applies_to` gets `status` from you

[tree]

; Branch ids, in display order, and their names.
branches=["sanctuary", "judgment"]
branch_names=["Sanctuary", "Judgment"]

[default]

; What a new character starts with (must follow the rules).
nodes=["sanctified_ground", "hallowed", "benediction", "guardians_leap", "sweeping_rebuke", "stern_hand", "smite", "staff_spin"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["sanctified_ground", "sweeping_rebuke", "smite"]

; --- Sanctuary: areas that protect and heal ---

[node_sanctified_ground]

name="Sanctified Ground"
branch="sanctuary"
tier=1
kind="active"
cost=1
ability="sanctified_ground"
description="Plant the staff: for 8 s a 4 m circle heals allies and burns enemies."

[node_hallowed]

name="Hallowed"
branch="sanctuary"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light sweeps deal 10% more damage."

[node_benediction]

name="Benediction"
branch="sanctuary"
tier=2
kind="active"
cost=1
ability="benediction"
description="Heal yourself and every ally within 8 m for 200. Long cooldown."

[node_guardians_leap]

name="Guardian's Leap"
branch="sanctuary"
tier=2
kind="active"
cost=1
ability="guardians_leap"
description="Leap 7 m and land with a blow, shielding allies around you."

[node_blessed_ground]

name="Blessed Ground"
branch="sanctuary"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Longstaff abilities deal (and heal) 10% more."

[node_warding_staff]

name="Warding Staff"
branch="sanctuary"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.2
description="Blocked hits cost 20% less stamina with the longstaff out."

[node_sanctuary]

name="Sanctuary"
branch="sanctuary"
tier=4
kind="passive"
cost=2
effect="zone_ally_status"
applies_to="sanctified_ground"
status="sanctified"
description="Capstone: allies on your Sanctified Ground take 15% less damage."

; --- Judgment: punishing attackers ---

[node_sweeping_rebuke]

name="Sweeping Rebuke"
branch="judgment"
tier=1
kind="active"
cost=1
ability="sweeping_rebuke"
description="A wide sweep that knocks enemies back 3.5 m."

[node_stern_hand]

name="Stern Hand"
branch="judgment"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.15
description="Heavy blows deal 15% more damage."

[node_smite]

name="Smite"
branch="judgment"
tier=2
kind="active"
cost=1
ability="smite"
description="An overhead blow that stuns for 1.2 s."

[node_staff_spin]

name="Staff Spin"
branch="judgment"
tier=2
kind="active"
cost=1
ability="staff_spin"
description="Spin the staff while you walk: deflects projectiles and catches anything close."

[node_righteous]

name="Righteous"
branch="judgment"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.06
description="All your Longstaff attacks deal 6% more damage."

[node_heavy_judgment]

name="Heavy Judgment"
branch="judgment"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="smite"
amount=0.2
description="Smite deals 20% more damage."

[node_judgment]

name="Judgment"
branch="judgment"
tier=4
kind="passive"
cost=2
effect="judgment_mark"
applies_to="sanctified_ground"
status="judged"
description="Capstone: enemies who hit an ally on your Sanctified Ground are Judged: 20% more damage taken for 5 s."
