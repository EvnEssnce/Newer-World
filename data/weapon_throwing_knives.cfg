; Throwing Knives, an Assassin weapon: short-to-mid range. Fast and cheap
; throws with poison, slows and marks, made to pair with the Dual Talons:
; soften a target, then close in. Every throw is a feather-styled knife
; ([projectile_knife] in data/projectiles.cfg). The server and the client's
; own prediction both read this file: restart the server AND clients after
; editing. Times are in seconds (rounded to physics ticks, 60 per second). See
; data/weapon_broadsword.cfg for what every key means and data/weapon_spear.cfg
; for projectile / projectile_time / projectile_count / projectile_spread.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Throwing Knives"
; Placeholder model to draw (cosmetic only): a knife in each hand.
model="throwing_knives"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.6
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_throwing_knives.cfg.
abilities=["fan_of_knives", "pinning_knife", "marked_blade", "venom_coat"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=900.0

[light]

; One quick knife (its damage is the knife's hit).
damage=32.0
stagger=0.0
block_stamina_damage=8.0
breaks_block=false
windup=0.1
active=0.05
recovery=0.2
move_multiplier=0.8
; No hitbox of its own: the knife does the hitting.
shape="none"
range=0.0
width=0.0
height=0.0
projectile="knife"
; Seconds from the start of the throw to the knife leaving the hand.
projectile_time=0.08

[heavy]

; Three knives at once, fanned out (damage per knife).
damage=42.0
stagger=0.15
block_stamina_damage=12.0
breaks_block=false
windup=0.3
active=0.05
recovery=0.35
move_multiplier=0.5
shape="none"
range=0.0
width=0.0
height=0.0
projectile="knife"
projectile_time=0.28
projectile_count=3
; Degrees between the outermost knives.
projectile_spread=16.0
; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---

[ability_fan_of_knives]

; A short cone of knives: five at once, spread wide (damage per knife).
name="Fan of Knives"
cooldown=8.0
damage=40.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.2
active=0.05
recovery=0.3
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="knife"
projectile_time=0.18
projectile_count=5
projectile_spread=50.0

[ability_pinning_knife]

; A heavier knife aimed low: the target is slowed.
name="Pinning Knife"
cooldown=7.0
damage=55.0
stagger=0.0
block_stamina_damage=15.0
breaks_block=false
windup=0.2
active=0.05
recovery=0.3
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="knife"
projectile_time=0.18
applies_status="slow"
status_stacks=1
; Seconds the slow lasts (instead of the status's own duration).
status_duration=3.0

[ability_marked_blade]

; Marks the target (Marked, data/status_effects.cfg): your next melee hit on
; it (the Talons, not a knife) deals 50% more damage and uses the mark up.
name="Marked Blade"
cooldown=10.0
damage=40.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.2
active=0.05
recovery=0.3
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="knife"
projectile_time=0.18
applies_status="marked"

