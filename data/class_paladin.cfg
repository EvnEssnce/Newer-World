; Paladin class: a melee tank and healer. Heals by being in the fight, uses its
; wings as shields, cleanses teammates and supports their Rebirths. Picked per
; character with the --class=paladin launch flag (or run_local_test.ps1 -Class
; paladin) and fixed. The server only lets a Paladin equip the weapons listed
; here. Server and clients both read this file.

[class]

; Shown in the UI.
name="Paladin"
; Every weapon this class can equip (ids of data/weapon_<id>.cfg). No other
; class can use them.
weapons=["dual_shortstaffs", "longstaff"]
; The two weapons a new character starts with equipped, in slot order (the first
; one is out at spawn; X swaps to the second).
default_loadout=["dual_shortstaffs", "longstaff"]

[level_bonus]

; Each character level past a full Wing tree (levels 21-30: the Wing points the
; level gives beyond the tree's [tree] points, data/progression.cfg) is one
; bonus point for this stat. Server decides; the K panel's Wings tab shows it.
; stat: one of max_health, damage, move_speed, dodge_cost, ember_cost, healing.
stat="healing"
; Fraction more healing done per point (0.02: +20% at level 30).
per_point=0.02
