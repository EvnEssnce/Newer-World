; Dual Shortstaffs, a Paladin weapon. Fast twin staves: your hits heal the allies
; around you.
; The server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second), distances in meters. See data/weapon_broadsword.cfg for
; what every key means (parry_arc / counter: its Riposte), data/weapon_great_staff.cfg
; and data/weapon_gauntlet.cfg for the healing keys, data/zones.cfg for zones.
;
; Paladin keys (server):
;   self_heal          heals you once
;   ally_status        a status for the allies its hitbox touches (not you)
;   cleanses           removes debuffs from you and the allies it touches
;   grants_rebirth     you and the allies it touches get an extra Rebirth that
;                      ignores the cooldown, taken back after blessing_time s
;   revives            its last hit window raises fallen allies it touches
;   heals_lowest_ally  a damaging hit heals the lowest-health ally within
;                      heal_radius m (you included) this much
;   deflects           (abilities) hostile projectiles reaching you while it's
;                      active (windup to its last hit window) are stopped

[weapon]

; Shown on the HUD and in the mastery panel.
name="Dual Shortstaffs"
; Placeholder model to draw (cosmetic only).
model="dual_shortstaffs"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.2
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_dual_shortstaffs.cfg.
abilities=["consecrating_strikes", "twin_guard", "uplifting_blow", "spinning_staves", "rush_to_aid", "rebuke", "twin_guard_counter"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A quick strike with one staff.
damage=45.0
stagger=0.0
block_stamina_damage=12.0
breaks_block=false
windup=0.08
active=0.08
recovery=0.18
move_multiplier=0.7
shape="box"
range=1.8
width=1.8
height=2.0

[heavy]

; Both staves brought down together: breaks a guard.
damage=130.0
stagger=0.35
block_stamina_damage=35.0
breaks_block=true
windup=0.3
active=0.1
recovery=0.35
move_multiplier=0.35
shape="box"
range=2.2
width=2.0
height=2.2
; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3
; A status for whoever it damages ("" = none). The smoke test turns one on.
applies_status=""
; --- Abilities ---

[ability_consecrating_strikes]

; No hit of its own: for 6 s every step one of your attacks connects heals
; you and allies within 6 m (Consecrating, data/status_effects.cfg).
name="Consecrating Strikes"
cooldown=16.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.15
move_multiplier=0.7
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="consecrating"

[ability_twin_guard]

; A parry stance with both staves crossed: a hit from the front in its window
; is negated and answered by the counter below.
name="Twin Guard"
cooldown=9.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.0
active=0.5
recovery=0.3
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
; Degrees in front that count.
parry_arc=140.0
; The ability that answers a parried hit.
counter="twin_guard_counter"

[ability_uplifting_blow]

