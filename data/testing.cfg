; Test-only switches. Server and clients both read this file (the server
; decides; clients only use it to show or hide the UI). Turn these off before
; playtesting with other people.

[class_change]

; true: the K panel shows a Class picker, and the server lets a player switch
; to another class in-game (only out of combat, alive, and not mid-attack,
; ability, swap, gear change, roll or stagger). A switch is a clean start: the
; new class's default build, full health and stamina, no statuses, Ember at its
; resting level, every cooldown cleared; gear the new class can't wear goes
; back to the bag. false: neither the picker nor the request exists.
enabled=true

[tradeskills]

; XP points every tradeskill gets when a player joins (server), to see the
; Tradeskills panel (P) and the level-up feed lines without gathering. 0 = off.
join_xp=0

[progression]

; true: every mastery and Wing tree gets its full points (data/mastery.cfg
; [rules] points, [tree] points) whatever the character's levels, as before
; build order item 4.3 (bots and the smoke test; playtests that want every
; ability). false: the points the levels give (data/progression.cfg). Server
; decides; restart it after editing.
full_points=false
