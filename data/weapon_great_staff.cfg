; Great Staff, a Mage weapon. Area damage and big spells, fire-themed.
; The Mage has no mana: abilities cost Ember (ember_cost), and the Mage gains
; Ember twice as fast (data/class_mage.cfg ember_gain). The server and the
; client's own prediction both read this file: restart the server AND clients
; after editing. Times are in seconds (rounded to physics ticks, 60 per second),
; distances in meters. See data/weapon_broadsword.cfg for what every key means,
; data/weapon_spear.cfg for projectiles, data/zones.cfg for zones.
;
; Mage keys (server):
;   window_ramp   each hit window after the first deals this fraction more
;                 (window i: 1 + window_ramp x i): a ramping channel
;   lifesteal     fraction of the damage it deals that heals you
;   ally_heal     allies its hitbox touches are healed this much per window
;   ally_shield   you and the allies its hitbox touches get Ward (absorbs this
;                 much damage; data/status_effects.cfg)
;   allies_only   true = its hitbox never touches enemies

[weapon]

; Shown on the HUD and in the mastery panel.
name="Great Staff"
; Placeholder model to draw (cosmetic only).
model="great_staff"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.3
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_great_staff.cfg.
abilities=["firebrand", "meteor_fall", "flame_wall", "searing_ray", "blink", "pyroclasm"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A fire bolt.
damage=40.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.2
active=0.05
recovery=0.25
move_multiplier=0.6
shape="none"
range=0.0
width=0.0
height=0.0
projectile="staff_bolt"
projectile_time=0.18

[heavy]

; A charged fireball: burns what it hits.
damage=120.0
stagger=0.25
block_stamina_damage=25.0
breaks_block=false
windup=0.6
active=0.05
recovery=0.35
move_multiplier=0.35
shape="none"
range=0.0
width=0.0
height=0.0
projectile="fireball"
projectile_time=0.58
applies_status="burn"
status_stacks=2

; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

