; Spear mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg. Skewer, Javelin Cast and Perforate will join the
; tree once status effects and projectiles exist.

[tree]

; Branch ids, in display order, and their names.
branches=["lancer", "impaler"]
branch_names=["Lancer", "Impaler"]

[default]

; What a new character starts with (must follow the rules).
nodes=["lunge", "measured_thrust", "low_sweep", "vault"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["lunge", "low_sweep", "vault"]

; --- Lancer: reach, sweeps, zone control ---

[node_lunge]

name="Lunge"
branch="lancer"
tier=1
kind="active"
cost=1
ability="lunge"
description="Dash forward and finish with a long-reach thrust."

[node_measured_thrust]

name="Measured Thrust"
branch="lancer"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_low_sweep]

name="Low Sweep"
branch="lancer"
tier=2
kind="active"
cost=1
ability="low_sweep"
description="A wide, low sweep that knocks enemies back and down."

[node_wide_arc]

name="Wide Arc"
branch="lancer"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="low_sweep"
amount=0.25
description="Low Sweep deals 25% more damage."

[node_driving_lunge]

name="Driving Lunge"
branch="lancer"
tier=3
kind="upgrade"
cost=1
effect="damage"
applies_to="lunge"
amount=0.3
description="Lunge deals 30% more damage."

[node_long_haft]

name="Long Haft"
branch="lancer"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_hold_the_line]

name="Hold the Line"
branch="lancer"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): enemies who move into your reach while you hold block are poked and slowed."

