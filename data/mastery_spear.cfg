; Spear mastery tree. Server and clients both read this file. Rules (point
; budget, tier gates) are in data/mastery.cfg; node keys are explained in
; data/mastery_broadsword.cfg.

[tree]

; Branch ids, in display order, and their names.
branches=["lancer", "impaler"]
branch_names=["Lancer", "Impaler"]

[default]

; What a new character starts with (must follow the rules).
nodes=["lunge", "measured_thrust", "low_sweep", "skewer", "vault", "javelin_cast", "perforate"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["lunge", "low_sweep", "vault"]

; --- Lancer: reach, sweeps, zone control ---

[node_lunge]

name="Lunge"
branch="lancer"
tier=1
kind="active"
cost=1
ability="lunge"
description="Dash forward and finish with a long-reach thrust."

[node_measured_thrust]

name="Measured Thrust"
branch="lancer"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_low_sweep]

name="Low Sweep"
branch="lancer"
tier=2
kind="active"
cost=1
ability="low_sweep"
description="A wide, low sweep that knocks enemies back and down."

[node_skewer]

name="Skewer"
branch="lancer"
tier=2
kind="active"
cost=1
ability="skewer"
description="A narrow thrust that roots the target in place for 1.5 seconds."

[node_wide_arc]

name="Wide Arc"
branch="lancer"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="low_sweep"
amount=0.25
description="Low Sweep deals 25% more damage."

[node_driving_lunge]

name="Driving Lunge"
branch="lancer"
tier=3
kind="upgrade"
cost=1
effect="damage"
applies_to="lunge"
amount=0.3
description="Lunge deals 30% more damage."

[node_long_haft]

name="Long Haft"
branch="lancer"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_hold_the_line]

name="Hold the Line"
branch="lancer"
tier=4
kind="passive"
cost=2
effect="hold_the_line"
; The internal ability that pokes (data/weapon_spear.cfg [ability_line_poke]:
; reach box, damage, slow, per-target cooldown).
applies_to="line_poke"
description="While you hold block, enemies who step into your reach are poked and slowed."

; --- Impaler: armor piercing, bleeds, finishers ---

[node_vault]

name="Vault"
branch="impaler"
tier=1
kind="active"
cost=1
ability="vault"
description="Plant the spear and vault backward out of melee."

[node_piercing_point]

name="Piercing Point"
branch="impaler"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.1
description="Heavy attacks deal 10% more damage."

[node_impaling_strikes]

name="Impaling Strikes"
branch="impaler"
tier=2
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.05
description="All your Spear attacks and abilities deal 5% more damage."

[node_perforate]

name="Perforate"
branch="impaler"
tier=2
kind="active"
cost=1
ability="perforate"
description="Five quick thrusts; each one adds a stack of bleed."

[node_cold_steel]

name="Cold Steel"
branch="impaler"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Abilities deal 10% more damage."

[node_finishing_thrust]

name="Finishing Thrust"
branch="impaler"
tier=4
kind="passive"
cost=2
effect="execute_damage"
; Most extra damage (fraction), reached as the target's health nears 0.
amount=0.6
; Below this fraction of the target's max health the bonus starts, growing
; linearly from 0 here to `amount` at 0 health.
threshold=0.3
description="Your Spear deals more damage to targets below 30% health, up to 60% more as they near death."

; --- Projectile abilities ---

[node_javelin_cast]

name="Javelin Cast"
branch="impaler"
tier=1
kind="active"
cost=1
ability="javelin_cast"
description="Throw a conjured spear that slows the target for 3 seconds."
