; War Hammer mastery tree. Server and clients both read this file. Rules
; (point budget, tier gates) are in data/mastery.cfg; node keys are explained
; in data/mastery_broadsword.cfg. Effects only this tree uses (server-side):
;   "heavy_shockwave": every `amount`-th heavy attack with the War Hammer sends
;     out the internal ability `applies_to`'s projectile (Earthshaker).
;   "heavy_breaks_block": War Hammer heavy attacks always break blocks
;     (Breaker).

[tree]

; Branch ids, in display order, and their names.
branches=["earthshaker", "breaker"]
branch_names=["Earthshaker", "Breaker"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["seismic_slam", "heavy_head", "clout", "crushing_blows", "upheaval", "shockwave", "rolling_thunder", "shatter", "steadfast"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["seismic_slam", "clout", "upheaval"]

; --- Earthshaker: area stuns and knockdowns ---

[node_seismic_slam]

name="Seismic Slam"
branch="earthshaker"
tier=1
kind="active"
cost=1
ability="seismic_slam"
description="Slam the ground: everything in a cone in front of you is knocked down and back."

[node_heavy_head]

name="Heavy Head"
branch="earthshaker"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.1
description="Heavy attacks deal 10% more damage."

[node_upheaval]

name="Upheaval"
branch="earthshaker"
tier=2
kind="active"
cost=1
ability="upheaval"
description="Drive the hammer into the ground: everything around you is thrown into the air."

[node_shockwave]

name="Shockwave"
branch="earthshaker"
tier=2
kind="active"
cost=1
ability="shockwave"
description="Send a wave rolling along the ground in front of you. It passes through everything and staggers."

[node_rolling_thunder]

name="Rolling Thunder"
branch="earthshaker"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="seismic_slam"
amount=0.25
description="Seismic Slam deals 25% more damage."

[node_earthbreaker]

name="Earthbreaker"
branch="earthshaker"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Abilities deal 10% more damage."

[node_earthshaker]

name="Earthshaker"
branch="earthshaker"
tier=4
kind="passive"
cost=2
effect="heavy_shockwave"
; The internal ability (data/weapon_war_hammer.cfg) whose wave is sent.
applies_to="aftershock"
; Every this-many-th heavy attack sends one.
amount=3
description="Capstone: every 3rd heavy attack also sends out a shockwave."

; --- Breaker: armor break and block break ---

[node_clout]

name="Clout"
branch="breaker"
tier=1
kind="active"
cost=1
ability="clout"
description="A brutal blow that stuns one target for 1.5 seconds."

[node_crushing_blows]

name="Crushing Blows"
branch="breaker"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_shatter]

name="Shatter"
branch="breaker"
tier=2
kind="active"
cost=1
ability="shatter"
description="An armor-breaking blow: the target takes 15% more damage for 8 seconds (stacks twice)."

[node_steadfast]

name="Steadfast"
branch="breaker"
tier=2
kind="active"
cost=1
ability="steadfast"
description="For 4 seconds you can't be staggered, stunned, knocked back, pulled or launched."

[node_skull_splitter]

name="Skull Splitter"
branch="breaker"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="clout"
amount=0.3
description="Clout deals 30% more damage."

[node_iron_will]

name="Iron Will"
branch="breaker"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_breaker]

name="Breaker"
branch="breaker"
tier=4
kind="passive"
cost=2
effect="heavy_breaks_block"
description="Capstone: your heavy attacks always break a block."
