; Juggernaut Wing abilities: knockback and crowd control. Two Wing slots, on Z
; and C, that stay the same when you swap weapons. Which abilities are learned
; and slotted comes from the Wing tree (data/mastery_wings_juggernaut.cfg). The
; server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds and are rounded to
; physics ticks (60 per second).
;
; Same keys as data/wings_fighter.cfg (ember_cost) and the weapon abilities
; (data/weapon_broadsword.cfg), plus a second status for the same targets:
;   applies_status_2, status_stacks_2, status_duration_2  like applies_status,
;               status_stacks and status_duration (Challenger's Roar).

[wings]

; Shown in the mastery panel's Wings tab.
name="Juggernaut Wings"
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["gale_burst", "challengers_roar", "meteor_drop", "unbowed"]

[ability_gale_burst]

; The wings beat outward: everything around you is knocked back.
name="Gale Burst"
ember_cost=20.0
cooldown=12.0
damage=60.0
stagger=0.3
block_stamina_damage=25.0
breaks_block=false
windup=0.2
active=0.1
recovery=0.3
move_multiplier=0.3
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=4.0
width=0.0
height=2.2
; Knocked back this many meters over force_duration seconds (the Tempest
; Wings passives push farther).
force_direction="away"
force_distance=3.5
force_duration=0.4

[ability_challengers_roar]

; A roar that challenges everything near you: enemies are Taunted (they fight
; you; data/status_effects.cfg) and Slowed. No damage. A guard facing you
; blocks it.
name="Challenger's Roar"
ember_cost=25.0
cooldown=15.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.25
active=0.1
recovery=0.35
move_multiplier=0.3
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=8.0
width=0.0
height=2.5
applies_status="taunted"
status_stacks=1
applies_status_2="slow"
status_stacks_2=1
; Seconds of Slow.
status_duration_2=3.0

[ability_meteor_drop]

; Leaps high on the wings and crashes down ahead: everything around the
; landing is launched into the air.
name="Meteor Drop"
ember_cost=30.0
cooldown=16.0
damage=160.0
stagger=0.5
block_stamina_damage=45.0
breaks_block=false
; The windup is the climb; the hit window (active) is the crash, around the
; landing (dash_end). Seconds.
windup=0.55
active=0.15
recovery=0.45
move_multiplier=0.0
turn_speed=0.0
shape="radial"
; Hit radius around the landing, meters.
range=3.0
width=0.0
height=2.2
; Leap: meters forward between dash_start and dash_end (seconds), speeding up
; (dash_ease="in") so it falls onto the spot.
dash_distance=6.0
dash_start=0.05
dash_end=0.6
dash_ease="in"
; Peak height of the leap, meters, at leap_peak (fraction of the dash).
; Cosmetic only.
leap_height=4.0
leap_peak=0.4
; Launch: peak height in meters, plus this much knockback.
force_direction="away"
force_distance=1.0
force_height=1.8
force_duration=0.3

[ability_unbowed]

; Unbowed (data/status_effects.cfg): immune to all crowd control (stagger,
; stun, knockback, slow, root, taunt) for a few seconds.
name="Unbowed"
ember_cost=25.0
cooldown=20.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.2
move_multiplier=0.6
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="unbowed"
self_status_stacks=1
