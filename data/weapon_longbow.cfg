; Longbow, a Ranger weapon. Long range: quick shots, or hold for a full draw that
; hits hard. Rewards keeping your distance.
; The server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second). See data/weapon_broadsword.cfg for what every key
; means and data/weapon_spear.cfg for projectile / projectile_time /
; projectile_count / projectile_spread. Every attack's damage is its
; projectile's hit (data/projectiles.cfg).

[weapon]

; Shown on the HUD and in the mastery panel.
name="Longbow"
; Placeholder model to draw (cosmetic only).
model="longbow"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; A bow makes a poor guard.
block_stamina_multiplier=1.7
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_longbow.cfg.
abilities=["piercing_shot", "arrow_rain", "snare_arrow", "backstep_shot", "hunters_mark", "rapid_nock"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A quick shot, loosed half-drawn.
damage=45.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.2
active=0.05
recovery=0.25
move_multiplier=0.6
shape="none"
range=0.0
width=0.0
height=0.0
projectile="arrow"
projectile_time=0.18

[heavy]

; A full draw: hold to draw, the arrow flies at the end of the windup.
; The Skirmisher capstone lets you walk at full speed while drawing.
damage=140.0
stagger=0.3
block_stamina_damage=30.0
breaks_block=false
windup=0.6
active=0.05
recovery=0.3
move_multiplier=0.35
shape="none"
range=0.0
width=0.0
height=0.0
projectile="arrow"
projectile_time=0.58

; --- Abilities ---

[ability_piercing_shot]

