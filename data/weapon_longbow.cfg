shape="none"
range=0.0
width=0.0
height=0.0
projectile="arrow_piercing"
projectile_time=0.38

[ability_arrow_rain]

; Loose a volley high into the air: arrows keep falling on a circle 12 m ahead
; for a few seconds (data/zones.cfg [zone_arrow_rain]: its damage per pulse).
name="Arrow Rain"
cooldown=12.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.35
active=0.05
recovery=0.35
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
; The zone (data/zones.cfg), placed zone_time s after the start, zone_distance
; m ahead (no aim pitch yet).
zone="arrow_rain"
zone_time=0.35
zone_distance=12.0

