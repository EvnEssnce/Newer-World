; Item definitions: what an item is before its rarity, gear score and bonus stats
; are rolled. One section per item; the section name is the item id that loot
; tables use. Server and clients both read this file (clients show item names).
;
; slot: weapon, head, chest, legs or wings (a Wing Enhancement).
; weapon: for weapons, the weapon type (data/weapon_<type>.cfg holds its attacks).
;   Weapons are class-locked (design/classes.md): only a class whose weapon list
;   has that type equips it.
; class: for Wing Enhancements, the only class that equips it. Head, chest and
;   legs fit every class.
; primary_stat / primary_base: the item's main stat, its value at the base gear
;   score (data/gear.cfg); it grows with gear score on New World's curve.
;   weapon_power: percent of the weapon file's damage. 100 = the file's numbers
;     (a gear score 100 weapon hits for its listed damage).
;   wing_power: the same for Wing abilities' damage and healing.
;   armor: armor rating; reduces hit damage (data/gear.cfg [armor]).

; --- Fighter weapons ---

[iron_broadsword]
name="Iron Broadsword"
slot="weapon"
weapon="broadsword"
primary_stat="weapon_power"
primary_base=100.0

