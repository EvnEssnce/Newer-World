; Item definitions: what an item is before its rarity, gear score and bonus stats
; are rolled. One section per item; the section name is the item id that loot
; tables use. Server only: restart the server after editing.
;
; slot: weapon, head, chest, hands, legs or feet.
; weapon: for weapons, the weapon type (data/weapon_<type>.cfg holds its attacks).
;   Weapons are class-locked (design/classes.md): only that weapon's class equips it.
; primary_stat / primary_per_gear_score: the item's main stat, scaling with gear score.
;   weapon_power: percent of the weapon file's damage. 100 = exactly the file's numbers,
;     so 1.0 per gear score means a gear score 100 weapon hits for its listed damage.
;   armor: flat armor rating (how armor reduces damage is decided when equipping exists).

[iron_broadsword]
name="Iron Broadsword"
slot="weapon"
weapon="broadsword"
primary_stat="weapon_power"
primary_per_gear_score=1.0

[iron_hatchets]
name="Iron Hatchets"
slot="weapon"
weapon="dual_axes"
primary_stat="weapon_power"
primary_per_gear_score=1.0

