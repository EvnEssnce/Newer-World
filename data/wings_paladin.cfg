; Paladin Wing abilities: defensive wings and cleansing. Two Wing slots, on Z and
; C, that stay the same when you swap weapons. Which abilities are learned and
; slotted comes from the Wing tree (data/mastery_wings_paladin.cfg). The server
; and the client's own prediction both read this file: restart the server AND
; clients after editing. Times are in seconds (60 ticks per second). Keys as in
; data/wings_fighter.cfg, the weapon files and data/weapon_dual_shortstaffs.cfg
; (the Paladin's support keys).

[wings]

; Shown in the mastery panel's Wings tab.
name="Paladin Wings"
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["sheltering_wings", "cleansing_flame", "guardian_wing", "phoenix_blessing", "kindle_life"]

[ability_sheltering_wings]

; Spread the wings into a barrier 1.5 m in front of you for 4 s: hostile
; projectiles stop at it (data/zones.cfg [zone_sheltering_wings]); people walk
; through.
name="Sheltering Wings"
ember_cost=20.0
cooldown=14.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.05
recovery=0.2
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
; The zone (data/zones.cfg), placed zone_time s after the start, zone_distance m ahead.
zone="sheltering_wings"
zone_time=0.1
zone_distance=1.5

