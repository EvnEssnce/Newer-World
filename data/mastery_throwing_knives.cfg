; Throwing Knives mastery tree. Server and clients both read this file. Rules
; (point budget, tier gates) are in data/mastery.cfg; node keys are explained
; in data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (all server-side):
;   heal_cut      healing on a target carrying your status `applies_to` (your
;                 poison) is cut by amount (fraction), whichever weapon is out
;   knife_flurry  every amount-th light or heavy throw with this weapon also
;                 sends out the ability `applies_to` (Fan of Knives) for free
;                 (no cooldown used)
;
; Not built yet (design/classes.md): Ricochet (a knife bouncing between up to
; 3 targets) and Recall (pulling stuck knives back).

[tree]

; Branch ids, in display order, and their names.
branches=["venom", "flurry"]
branch_names=["Venom", "Flurry"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["pinning_knife", "venom_coat", "marked_blade", "fan_of_knives"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["fan_of_knives", "pinning_knife", "venom_coat"]

; --- Venom: poison and debuffs ---

[node_pinning_knife]

name="Pinning Knife"
branch="venom"
tier=1
kind="active"
cost=1
ability="pinning_knife"
description="A heavier knife that slows the target for 3 s."

[node_venom_coat]

name="Venom Coat"
branch="venom"
tier=1
kind="active"
cost=1
ability="venom_coat"
description="Coat your blades: your next 5 hits poison the target."

[node_barbed_tips]

name="Barbed Tips"
branch="venom"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light throws deal 10% more damage."

