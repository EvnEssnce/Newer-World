; Assassin class: a melee damage dealer with a short-range throwing option. Wins
; by being somewhere unexpected: hits from behind (backstabs), reads, combos.
; Picked per character with the --class=assassin launch flag (or
; run_local_test.ps1 -Class assassin) and fixed. The server only lets an
; Assassin equip the weapons listed here. Server and clients both read this
; file.

[class]

; Shown in the UI.
name="Assassin"
; Every weapon this class can equip (ids of data/weapon_<id>.cfg). No other
; class can use them.
weapons=["dual_talons", "throwing_knives"]
; The two weapons a new character starts with equipped, in slot order (the first
; one is out at spawn; X swaps to the second).
default_loadout=["dual_talons", "throwing_knives"]
