; Firebolts, a Ranger weapon. Hand-fired burning feathers at short-to-mid range, as fast
; as you can click. Every hit adds a stack of Burn; Ignite cashes them in.
; The server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second). See data/weapon_broadsword.cfg for what every key
; means and data/weapon_spear.cfg for projectile / projectile_time /
; projectile_count / projectile_spread. Every attack's damage is its
; projectile's hit (data/projectiles.cfg).

[weapon]

; Shown on the HUD and in the mastery panel.
name="Firebolts"
; Placeholder model to draw (cosmetic only).
model="firebolts"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; Bare hands: a poor guard.
block_stamina_multiplier=1.6
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_firebolts.cfg.
abilities=["scatterflame", "ignite", "flare", "overheat"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=900.0

[light]

; One firebolt; adds a stack of Burn.
damage=26.0
stagger=0.0
block_stamina_damage=6.0
breaks_block=false
windup=0.08
active=0.05
recovery=0.14
move_multiplier=0.75
shape="none"
range=0.0
width=0.0
height=0.0
projectile="firebolt"
projectile_time=0.06
applies_status="burn"
status_stacks=1

[heavy]

; Three firebolts at once (damage per bolt), each adding Burn.
damage=60.0
stagger=0.15
block_stamina_damage=12.0
breaks_block=false
windup=0.3
active=0.05
recovery=0.3
move_multiplier=0.45
shape="none"
range=0.0
width=0.0
height=0.0
projectile="firebolt"
projectile_time=0.28
projectile_count=3
projectile_spread=10.0
applies_status="burn"
status_stacks=1

