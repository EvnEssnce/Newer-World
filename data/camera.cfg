; Third-person camera tuning, and the aim (crosshair) it gives. The server reads
; pivot_height, shoulder_offset, distance and [aim] too: it rebuilds each
; player's aim ray from them (AimRay), so restart the server AND clients after
; editing those.

[camera]

; Degrees of rotation per pixel of mouse movement.
mouse_sensitivity=0.15
; Distance from the orbit point to the camera, meters.
distance=4.5
; Height of the orbit point above the player's feet, meters.
pivot_height=1.6
; Over-the-shoulder offset: meters the orbit point (and so the camera and the
; screen-centre crosshair) sits to the right of the player. 0 = straight behind,
; with the crosshair on the player's own head.
shoulder_offset=0.7
; Pitch limits in degrees. Negative looks down at the player.
min_pitch=-70.0
max_pitch=35.0
; Starting pitch in degrees.
start_pitch=-20.0

[aim]

; Meters the crosshair's aim reaches: the aim point is the first wall, ground or
; hostile body along the camera's line within this distance, else the point at
; this distance. Projectiles fly toward it.
max_distance=100.0
; Meters an aim point must be ahead of a projectile's release point (along the
; aim) for the throw to head at it; closer (a wall right in front, something
; beside you), it flies along the camera's line instead.
min_ahead=1.0
