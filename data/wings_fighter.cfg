; Fighter Wing abilities (the phoenix half of the class). Two Wing slots, on Z
; and C, that stay the same when you swap weapons. Which abilities are learned
; and slotted comes from the Wing tree (data/mastery_wings_fighter.cfg). The
; server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds and are rounded to
; physics ticks (60 per second).
;
; Abilities use the same keys as weapon abilities (see data/weapon_broadsword.cfg
; for what every key means; status keys are at its end), plus:
;   ember_cost  Ember spent when it starts. It can't start with less Ember
;               (a press stays buffered for [abilities] buffer in combat.cfg).

[wings]

; Shown in the mastery panel's Wings tab.
name="Fighter Wings"
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["ember_mantle", "wingbeat_surge", "pyre_heart", "diving_strike"]

[ability_ember_mantle]

; Wings wrap around you: heavy damage reduction (Warded, data/status_effects.cfg)
; for its duration. No hit of its own.
name="Ember Mantle"
ember_cost=25.0
cooldown=15.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.2
move_multiplier=0.6
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="damage_reduction"
self_status_stacks=1

[ability_wingbeat_surge]

; A beat of the wings: your attacks deal bonus damage (Empowered,
; data/status_effects.cfg) for its duration.
name="Wingbeat Surge"
ember_cost=25.0
cooldown=15.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.1
recovery=0.2
move_multiplier=0.6
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="damage_up"
self_status_stacks=1

[ability_pyre_heart]

; Burns Ember to heal over time (Pyre Heart, data/status_effects.cfg).
name="Pyre Heart"
ember_cost=30.0
cooldown=20.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.15
active=0.1
recovery=0.25
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="pyre_heart"
self_status_stacks=1

[ability_diving_strike]

; A wing-assisted leap forward that slams down, hitting everything around the
; landing spot. Like Crashing Leap, but farther and higher.
name="Diving Strike"
ember_cost=20.0
cooldown=12.0
damage=150.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=false
windup=0.55
active=0.12
recovery=0.4
move_multiplier=0.0
turn_speed=0.0
shape="radial"
; Slam radius around you, meters.
range=2.5
width=0.0
height=2.0
; Leap: meters forward, between dash_start and dash_end (seconds). With the
; 2.5 m slam radius it lands on targets from about 2.5 m to 7.5 m ahead.
dash_distance=5.0
dash_start=0.05
dash_end=0.55
; Peak height of the leap, meters. Cosmetic only (the body itself stays on its
; ground path).
leap_height=2.5
