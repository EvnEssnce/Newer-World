recovery=0.45
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="bolt"
projectile_time=0.28
projectile_count=4
projectile_spread=8.0

[ability_scatter_bolt]

