; Crossbow, a Ranger weapon. Medium range, heavy bolts: each light shot is followed by a
; long reload (its recovery), so it's burst, then a vulnerable moment.
; The server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second). See data/weapon_broadsword.cfg for what every key
; means and data/weapon_spear.cfg for projectile / projectile_time /
; projectile_count / projectile_spread. Every attack's damage is its
; projectile's hit (data/projectiles.cfg).

[weapon]

; Shown on the HUD and in the mastery panel.
name="Crossbow"
; Placeholder model to draw (cosmetic only).
model="crossbow"
; Multiplies the stamina a blocked hit costs while this weapon is out.
; The stock takes a hit better than a bow.
block_stamina_multiplier=1.4
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_crossbow.cfg.
abilities=["concussive_bolt", "bolt_barrage", "scatter_bolt", "quick_reload"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A bolt, then the reload (recovery).
damage=70.0
stagger=0.0
block_stamina_damage=15.0
breaks_block=false
windup=0.12
active=0.05
recovery=0.55
move_multiplier=0.6
shape="none"
range=0.0
width=0.0
height=0.0
projectile="bolt"
projectile_time=0.1

[heavy]

; A heavy bolt, cranked tight: breaks a guard.
damage=160.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=true
windup=0.45
active=0.05
recovery=0.6
move_multiplier=0.4
shape="none"
range=0.0
width=0.0
height=0.0
projectile="bolt"
projectile_time=0.43

; --- Abilities ---

[ability_concussive_bolt]

; A blunt bolt that knocks the target back.
name="Concussive Bolt"
cooldown=9.0
damage=80.0
stagger=0.3
block_stamina_damage=20.0
breaks_block=false
windup=0.27
active=0.05
recovery=0.35
move_multiplier=0.5
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
projectile="bolt"
projectile_time=0.25
; Knocked back this many meters over force_duration seconds.
force_direction="away"
force_distance=3.0
force_duration=0.35

[ability_bolt_barrage]

; Empties the magazine: four bolts at once in a tight spread (damage per bolt).
name="Bolt Barrage"
cooldown=10.0
