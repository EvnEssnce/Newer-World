; Combat tuning. The server and the client's own prediction both read this file:
; restart the server AND clients after editing. Times are in seconds and are
; rounded to physics ticks (60 per second, so about 0.0167 s each).

[health]

max=1000.0

[death]

; Seconds a defeated player stays down before respawning with full health and stamina.
respawn_time=5.0

[stamina]

max=100.0
; Stamina regained per second once regen has started.
regen_per_second=35.0
; Seconds after a dodge ends before stamina starts coming back.
regen_delay=0.6

[block]

; Hold right click to block hits from the front. Blocked hits cost stamina
; (block_stamina_damage in the weapon file) instead of health.
; Width of the protected arc in front of the blocker, degrees.
arc=120.0
; Fraction of a blocked hit's damage that still gets through. 0 = none.
damage_taken=0.0
; Movement speed while blocking, as a fraction of normal speed.
move_multiplier=0.5
; Stamina regen speed while blocking, as a fraction of normal.
regen_multiplier=0.5
; While blocking, the character turns toward where the camera looks at up to
; this many degrees per second.
turn_speed=720.0
; Seconds a blocker is staggered when their guard breaks (a heavy attack, or a
; hit with more stamina damage than they have left).
guard_break_stagger=1.2

[swap]

; Press X to swap between your two equipped weapons. Not possible mid-attack,
; mid-ability or mid-roll (the press is buffered). While swapping you can move
; but not attack, block, dodge or use abilities.
; Seconds a weapon swap takes.
duration=0.35
; A swap pressed this many seconds before it's possible still happens as soon as
; it becomes possible.
buffer=0.25

[abilities]

; An ability (Q / E / R) pressed this many seconds before it's possible
; (mid-attack, mid-roll, mid-swap, or just before its cooldown ends) still
; happens as soon as it becomes possible.
buffer=0.3

[dodge]

; Stamina spent per dodge. You can't dodge with less than this.
stamina_cost=30.0
; Seconds the roll lasts. Movement input is ignored during the roll.
duration=0.5
; Meters covered by the roll.
distance=4.5
; Window, in seconds from the start of the roll, where hits can't land (i-frames).
iframe_start=0.0
iframe_end=0.3
; Seconds after a roll ends before you can dodge again (a press during it is
; buffered, see buffer below).
cooldown=0.3
; Dodges allowed per time in the air (resets on landing). 0 means ground only.
; An air dodge only changes horizontal movement; gravity keeps acting as normal.
air_dodges=1
; A dodge pressed this many seconds before it's possible (mid-roll, or
; still in the air) still happens as soon as it becomes possible.
buffer=0.2

[force]

; Forced movement: attacks that knock back, pull or launch what they hit (the
; force_* keys on an attack in data/weapon_<id>.cfg or data/enemy_<kind>.cfg).
; While being moved, a player or enemy can't act: it interrupts their attack,
; ability, dodge, swap or guard like a stagger. Hits during i-frames, blocked or
; parried hits, and hits between party members never move anyone. These are the
; limits shared by every attack.
; Farthest any single hit can push or pull, meters.
max_distance=6.0
; Highest any single hit can launch, meters (peak height of the launch).
max_height=2.0
; A pull stops this far from the puller (center to center), meters, so the
; target ends up in front of them rather than on top of them.
pull_gap=1.3

[crit]

; Critical hits (server; shown as "Critical!"): the Halberd's Headsman capstone
; (heavies on staggered targets), the Dual Talons' Predator capstone
; (backstabs) and Primed (Feint), and gear crit chance.
; Damage multiplier of a critical hit (1.5 = +50%).
damage_multiplier=1.5

[backstab]

; A backstab (the Assassin's Dual Talons: Backstab passives, the Predator
; capstone's crits) is a hit from behind the target, or on an enemy that's
; fighting someone else or nobody. Server only.
; Width of the arc behind a target that counts as "behind", degrees (180 =
; the whole back half). Measured from where the hit comes from (a projectile:
; back along its path).
rear_arc=180.0
; true = a hit on an enemy whose target isn't you (idle, or chasing another
; player) is a backstab wherever you stand.
unaware_enemies=true
