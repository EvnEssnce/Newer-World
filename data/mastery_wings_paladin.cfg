; Paladin Wing tree. Server and clients both read this file. Same node keys as
; the weapon trees (explained in data/mastery_broadsword.cfg) and the same tier
; gates (data/mastery.cfg); active nodes unlock the Wing abilities of
; data/wings_paladin.cfg for the Z and C slots. Respecs are free. Effects as in
; data/mastery_wings_fighter.cfg, plus (server):
;   wall_reflect      projectiles your wall of the kind `applies_to` stops fly
;                     back the way they came, now yours
;   cleanse_rebirth   your cleanses (cleanses=true) also take amount seconds off
;                     the Rebirth cooldown of each ally they touch
;   rebirth_discount  allies dying within `threshold` m of you need amount less
;                     Ember to Rebirth
;   blessing_ember    your Phoenix Blessing (grants_rebirth) also refills the
;                     Ember of each ally it touches to at least amount

[tree]

; Branch ids, in display order, and their names.
branches=["aegis", "purifier"]
branch_names=["Aegis", "Purifier"]
; Points this tree can spend (a flat budget, like the other Wing trees).
points=12

[default]

; What a new character starts with (must follow the rules).
nodes=["sheltering_wings", "guardian_wing", "cleansing_flame", "phoenix_blessing"]
; Abilities in slots ("" = empty). Each must be unlocked by `nodes`.
slots=["sheltering_wings", "cleansing_flame"]

; --- Aegis: protecting others ---

[node_sheltering_wings]

name="Sheltering Wings"
branch="aegis"
tier=1
kind="active"
cost=1
ability="sheltering_wings"
description="A barrier of wings in front of you for 4 s: hostile projectiles stop at it. Costs 20 Ember."

[node_guardian_wing]

name="Guardian Wing"
branch="aegis"
tier=1
kind="active"
cost=1
ability="guardian_wing"
description="Link to allies in front of you: for 8 s you take 30% of their damage. Costs 20 Ember."

[node_steadfast_heart]

name="Steadfast Heart"
branch="aegis"
tier=2
kind="passive"
cost=2
effect="damage_taken"
amount=-0.05
description="Take 5% less damage."

[node_bulwark_plumes]

name="Bulwark Plumes"
branch="aegis"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_mirror_aegis]

name="Mirror Aegis"
branch="aegis"
tier=4
kind="passive"
cost=2
effect="wall_reflect"
applies_to="sheltering_wings"
description="Capstone: Sheltering Wings reflect projectiles back at whoever threw them."

; --- Purifier: cleansing and Rebirth support ---

[node_cleansing_flame]

name="Cleansing Flame"
branch="purifier"
tier=1
kind="active"
cost=1
ability="cleansing_flame"
description="Remove every debuff from you and allies within 8 m. Costs 15 Ember."

[node_phoenix_blessing]

name="Phoenix Blessing"
branch="purifier"
tier=1
kind="active"
cost=1
ability="phoenix_blessing"
description="For 30 s you and allies within 8 m get an extra Rebirth that ignores the cooldown. Costs 40 Ember."

[node_kindle_life]

name="Kindle Life"
branch="purifier"
tier=2
kind="active"
cost=1
ability="kindle_life"
description="Channel 2 s over fallen allies to raise them, whatever their Ember or cooldown. Costs 30 Ember."

[node_purging_fire]

name="Purging Fire"
branch="purifier"
tier=2
kind="passive"
cost=1
effect="cleanse_rebirth"
; Seconds off the Rebirth cooldown of each ally touched.
amount=30
description="Cleansing Flame also takes 30 s off the Rebirth cooldown of each ally it touches."

[node_ember_vigil]

name="Ember Vigil"
branch="purifier"
tier=3
kind="passive"
cost=2
effect="rebirth_discount"
amount=10
; Meters from you.
threshold=10.0
description="Allies within 10 m of you need 10 less Ember to Rebirth."

[node_everflame]

name="Everflame"
branch="purifier"
tier=4
kind="passive"
cost=2
effect="blessing_ember"
amount=50
description="Capstone: Phoenix Blessing also refills each ally's Ember to at least 50."
