; Longstaff, a Paladin weapon. A melee quarterstaff with reach and sweeps that
; protects an area.
; The server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second), distances in meters. See data/weapon_broadsword.cfg for
; what every key means (parry_arc / counter: its Riposte), data/weapon_great_staff.cfg
; and data/weapon_gauntlet.cfg for the healing keys, data/zones.cfg for zones.
;
; Paladin keys (server):
;   self_heal          heals you once
;   ally_status        a status for the allies its hitbox touches (not you)
;   cleanses           removes debuffs from you and the allies it touches
;   grants_rebirth     you and the allies it touches get an extra Rebirth that
;                      ignores the cooldown, taken back after blessing_time s
;   revives            its last hit window raises fallen allies it touches
;   heals_lowest_ally  a damaging hit heals the lowest-health ally within
;                      heal_radius m (you included) this much
;   deflects           (abilities) hostile projectiles reaching you while it's
;                      active (windup to its last hit window) are stopped

[weapon]

; Shown on the HUD and in the mastery panel.
name="Longstaff"
; Placeholder model to draw (cosmetic only).
model="longstaff"
; Multiplies the stamina a blocked hit costs while this weapon is out.
block_stamina_multiplier=1.0
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_longstaff.cfg.
abilities=["sanctified_ground", "sweeping_rebuke", "guardians_leap", "staff_spin", "smite", "benediction"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack.
turn_speed=720.0

[light]

; A reaching sweep.
damage=60.0
stagger=0.0
block_stamina_damage=15.0
breaks_block=false
windup=0.15
active=0.1
recovery=0.25
move_multiplier=0.5
shape="box"
range=2.8
width=2.4
height=2.0

[heavy]

; A heavy two-handed blow: breaks a guard.
damage=160.0
stagger=0.4
block_stamina_damage=40.0
breaks_block=true
windup=0.45
active=0.12
recovery=0.45
move_multiplier=0.3
shape="box"
range=3.0
width=2.0
height=2.2
; Knockback, meters away (0 = none). The smoke test turns it on.
force_direction="away"
force_distance=0.0
force_duration=0.3

; --- Abilities ---

[ability_sanctified_ground]

; Plant the staff: a circle around you heals allies and burns enemies for 8 s
; (data/zones.cfg [zone_sanctified_ground]).
name="Sanctified Ground"
cooldown=18.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.3
active=0.05
recovery=0.3
move_multiplier=0.2
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
; The zone (data/zones.cfg), placed zone_time s after the start, zone_distance m ahead.
zone="sanctified_ground"
zone_time=0.3
zone_distance=0.0

[ability_sweeping_rebuke]

; A wide sweep that knocks enemies back.
name="Sweeping Rebuke"
cooldown=10.0
damage=90.0
stagger=0.3
block_stamina_damage=25.0
breaks_block=false
windup=0.25
active=0.12
recovery=0.3
move_multiplier=0.3
turn_speed=720.0
shape="box"
range=3.0
width=5.0
height=2.0
force_direction="away"
force_distance=3.5
force_duration=0.35

[ability_guardians_leap]

; Leap 7 m (aim at an ally) and land with a blow: enemies around you are hit,
; allies around you shielded (Ward 80).
name="Guardian's Leap"
cooldown=14.0
damage=60.0
stagger=0.2
block_stamina_damage=20.0
breaks_block=false
windup=0.45
active=0.1
recovery=0.3
move_multiplier=0.0
turn_speed=0.0
shape="radial"
range=2.5
width=0.0
height=2.0
dash_distance=7.0
dash_start=0.05
dash_end=0.45
; Peak height, meters. Cosmetic only.
leap_height=1.5
ally_shield=80.0

[ability_staff_spin]

; Spin the staff in front of you while you walk: it deflects projectiles and
; catches anything close.
name="Staff Spin"
cooldown=12.0
damage=25.0
stagger=0.0
block_stamina_damage=10.0
breaks_block=false
windup=0.1
active=0.08
recovery=0.25
move_multiplier=0.8
turn_speed=720.0
shape="radial"
range=2.2
width=0.0
height=2.0
windows=5
window_interval=0.25
deflects=true

[ability_smite]

; An overhead blow that stuns (data/status_effects.cfg).
name="Smite"
cooldown=12.0
damage=150.0
stagger=0.3
block_stamina_damage=35.0
breaks_block=false
windup=0.4
active=0.12
recovery=0.4
move_multiplier=0.2
turn_speed=720.0
shape="box"
range=2.6
width=1.6
height=2.0
applies_status="stun"
; Seconds stunned.
status_duration=1.2

[ability_benediction]

; A great blessing: heals you and every ally within 8 m by 200. Long cooldown.
name="Benediction"
cooldown=40.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.5
active=0.1
recovery=0.4
move_multiplier=0.0
turn_speed=0.0
shape="radial"
range=8.0
width=0.0
height=2.0
ally_heal=200.0
self_heal=200.0
allies_only=true
