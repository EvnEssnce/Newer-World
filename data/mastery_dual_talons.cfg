; Dual Talons mastery tree. Server and clients both read this file. Rules
; (point budget, tier gates) are in data/mastery.cfg; node keys are explained
; in data/mastery_broadsword.cfg.
;
; Effects besides the Broadsword's (all server-side):
;   backstab_damage  +amount (fraction) damage on backstabs (data/combat.cfg
;                    [backstab]: a hit from behind, or on an enemy that isn't
;                    fighting you) with `applies_to` (like "damage")
;   crit_backstab    backstabs with `applies_to` are critical hits
;                    (data/combat.cfg [crit])
;   ramp_on_hit      each step one of this weapon's attacks connects gives you a
;                    stack of the status `applies_to` (Talon Storm: attack
;                    speed per stack)

[tree]

; Branch ids, in display order, and their names.
branches=["predator", "tempest"]
branch_names=["Predator", "Tempest"]

[default]

; What a new character starts with (must follow the rules): every ability
; learned.
nodes=["pounce", "backstab", "eviscerate", "feint", "talon_spin", "rending_talons", "hook_talon"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["pounce", "rending_talons", "feint"]

; --- Predator: backstabs and finishers ---

[node_pounce]

name="Pounce"
branch="predator"
tier=1
kind="active"
cost=1
ability="pounce"
description="Leap 5 m onto a target, raking it as you land."

[node_backstab]

name="Backstab"
branch="predator"
tier=1
kind="passive"
cost=1
effect="backstab_damage"
applies_to="all"
amount=0.2
description="Backstabs (hits from behind, or on an enemy fighting someone else) deal 20% more damage."

[node_eviscerate]

name="Eviscerate"
branch="predator"
tier=2
kind="active"
cost=1
ability="eviscerate"
description="A finisher: up to double damage on targets below 35% health."

[node_feint]

name="Feint"
branch="predator"
tier=2
kind="active"
cost=1
ability="feint"
description="A fake attack. If it's blocked or dodged (or lands on an enemy mid-swing), your next hit crits."

[node_killing_edge]

name="Killing Edge"
branch="predator"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="eviscerate"
amount=0.2
description="Eviscerate deals 20% more damage."

[node_from_the_shadows]

name="From the Shadows"
branch="predator"
tier=3
kind="passive"
cost=2
effect="backstab_damage"
applies_to="heavy"
amount=0.25
description="Heavy attacks deal another 25% more damage as backstabs."

[node_ruthless]

name="Ruthless"
branch="predator"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Talon abilities deal 10% more damage."

[node_unseen_strike]

name="Unseen Strike"
branch="predator"
tier=4
kind="passive"
cost=2
effect="crit_backstab"
applies_to="all"
description="Capstone: every backstab is a critical hit."

; --- Tempest: combos and speed ---

[node_talon_spin]

name="Talon Spin"
branch="tempest"
tier=1
kind="active"
cost=1
ability="talon_spin"
description="A spinning flurry around you: three hits."

[node_rending_talons]

name="Rending Talons"
branch="tempest"
tier=1
kind="active"
cost=1
ability="rending_talons"
description="A cross-slash that makes the target bleed."

[node_quick_claws]

name="Quick Claws"
branch="tempest"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_hook_talon]

name="Hook Talon"
branch="tempest"
tier=2
kind="active"
cost=1
ability="hook_talon"
description="Hook the first target in a 3.5 m line and pull it a step toward you."

[node_whirling_claws]

name="Whirling Claws"
branch="tempest"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="talon_spin"
amount=0.2
description="Talon Spin deals 20% more damage."

[node_bloodletter]

name="Bloodletter"
branch="tempest"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="all"
amount=0.06
description="All your Talon attacks deal 6% more damage."

[node_light_footed]

name="Light-Footed"
branch="tempest"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.25
description="Blocked hits cost 25% less stamina while the Talons are out."

[node_talon_storm]

name="Talon Storm"
branch="tempest"
tier=4
kind="passive"
cost=2
effect="ramp_on_hit"
applies_to="talon_storm"
description="Capstone: every hit in an unbroken combo makes your light and heavy attacks 4% faster, up to 32% (8 hits); it fades 1.5 s after your last hit."
