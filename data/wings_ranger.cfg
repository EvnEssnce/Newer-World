; Ranger Wing abilities: creating distance. Two Wing slots, on Z and C, that stay
; the same when you swap weapons. Which abilities are learned and slotted comes
; from the Wing tree (data/mastery_wings_ranger.cfg). The server and the
; client's own prediction both read this file: restart the server AND clients
; after editing. Times are in seconds and are rounded to physics ticks (60 per
; second).
;
; Same keys as data/wings_fighter.cfg (ember_cost) and the weapon abilities
; (data/weapon_broadsword.cfg), plus:
;   launch_height  meters: a real jump (predicted, unlike leap_height) thrown
;                  launch_time seconds after the start (Updraft)
;   launch_time

[wings]

; Shown in the mastery panel's Wings tab.
name="Ranger Wings"
; Ability pool, in order (ids of the [ability_<id>] sections below).
abilities=["gust_roll", "tailwind", "backdraft", "updraft"]

[ability_gust_roll]

; Your wings catch the wind: for a few seconds every roll is a long glide (Gust
; Roll, data/status_effects.cfg). No hit of its own.
name="Gust Roll"
ember_cost=15.0
cooldown=12.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.05
recovery=0.1
move_multiplier=0.8
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="gust_roll"

[ability_tailwind]

; A wind at your back: faster walking and cheaper rolls (Tailwind). No hit.
name="Tailwind"
ember_cost=20.0
cooldown=15.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.05
recovery=0.1
move_multiplier=0.8
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="tailwind"

[ability_backdraft]

; A blast of the wings: everything around you is knocked away.
name="Backdraft"
ember_cost=20.0
cooldown=12.0
damage=40.0
stagger=0.2
block_stamina_damage=20.0
breaks_block=false
windup=0.15
active=0.1
recovery=0.25
move_multiplier=0.3
turn_speed=0.0
shape="radial"
; Radius around you, meters.
range=4.0
width=0.0
height=2.2
; Knocked back this many meters over force_duration seconds.
force_direction="away"
force_distance=3.0
force_duration=0.35

[ability_updraft]

; Your wings throw you upward, then you float down slowly (Updraft), free to
; shoot on the way. No hit of its own. A cheap version of the design's hover.
name="Updraft"
ember_cost=25.0
cooldown=14.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.05
active=0.05
recovery=0.1
move_multiplier=1.0
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
launch_height=3.5
launch_time=0.05
self_status="updraft"
