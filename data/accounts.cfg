; Accounts, passwords and character names. The server decides (clients use the
; same values only to explain a refusal before sending). Names are unique
; ignoring case (the database enforces it). Restart the server after editing.

[account]

; Fewest and most characters in an account (login) name.
name_min=3
name_max=20
; Every character an account name may contain (case matters: list both).
name_chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_"
; Most characters one account can have.
max_characters=8

[character]

; Fewest and most characters in a character name (shown over the player).
name_min=3
name_max=16
; Every character a character name may contain. The first one must be a
; letter (checked separately).
name_chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

[password]

; Fewest and most characters in a password.
min_length=6
max_length=64
; PBKDF2-HMAC-SHA256 iterations for new password hashes: higher = slower to
; guess from a stolen database, and slower to log in (~1 microsecond each in
; GDScript, on a worker thread, so the server tick doesn't wait). Changing it
; only affects new hashes: each stored hash keeps its own count.
iterations=310000
