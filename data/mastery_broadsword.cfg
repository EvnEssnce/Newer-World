; Broadsword mastery tree. Server and clients both read this file. Rules
; (point budget, tier gates) are in data/mastery.cfg.
;
; Each [node_<id>] section is one node:
;   name         shown in the mastery panel
;   branch       which of the two branches ([tree] branches) it belongs to
;   tier         1-3, or 4 for the capstone
;   kind         "active" (unlocks an ability for your slots), "passive" (always
;                on) or "upgrade" (changes one of your abilities)
;   cost         points it takes
;   description  shown in the mastery panel
;   ability      (active nodes) the ability id from data/weapon_broadsword.cfg
;   effect       (passive/upgrade) what it does, all applied by the server:
;                  "damage": +amount (fraction) damage on `applies_to` = "light",
;                    "heavy", "abilities", "all" or one ability id
;                  "low_health_damage": +amount damage while your health is
;                    below `threshold` (fraction of max)
;                  "block_stamina": blocked hits cost amount (fraction, negative
;                    = cheaper) more stamina
;                  "none": not built yet (shown, costs points, does nothing)

[tree]

; Branch ids, in display order, and their names.
branches=["vanguard", "keen_edge"]
branch_names=["Vanguard", "Keen Edge"]

[default]

; What a new character starts with (must follow the rules).
nodes=["shield_charge", "stalwart", "riposte", "whirlwind_edge", "honed_blade"]
; Abilities in slots Q, E, R ("" = empty). Each must be unlocked by `nodes`.
slots=["whirlwind_edge", "shield_charge", "riposte"]

; --- Vanguard: blocking, shield work ---

[node_shield_charge]

name="Shield Charge"
branch="vanguard"
tier=1
kind="active"
cost=1
ability="shield_charge"
description="Charge forward behind your shield. The first enemy hit is staggered."

[node_stalwart]

name="Stalwart"
branch="vanguard"
tier=1
kind="passive"
cost=1
effect="block_stamina"
amount=-0.15
description="Blocked hits cost 15% less stamina."

[node_riposte]

name="Riposte"
branch="vanguard"
tier=2
kind="active"
cost=1
ability="riposte"
description="Brief parry stance. A hit from the front is negated and answered with a counter strike."

[node_battering_charge]

name="Battering Charge"
branch="vanguard"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="shield_charge"
amount=0.3
description="Shield Charge deals 30% more damage."

[node_punishing_counter]

name="Punishing Counter"
branch="vanguard"
tier=3
kind="upgrade"
cost=1
effect="damage"
applies_to="riposte_counter"
amount=0.4
description="Riposte's counter strike deals 40% more damage."

[node_iron_guard]

name="Iron Guard"
branch="vanguard"
tier=3
kind="passive"
cost=2
effect="block_stamina"
amount=-0.15
description="Blocked hits cost a further 15% less stamina."

[node_perfect_guard]

name="Perfect Guard"
branch="vanguard"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): a perfectly timed block staggers the attacker."

; --- Keen Edge: damage ---

[node_whirlwind_edge]

name="Whirlwind Edge"
branch="keen_edge"
tier=1
kind="active"
cost=1
ability="whirlwind_edge"
description="Spin and hit everything around you."

[node_honed_blade]

name="Honed Blade"
branch="keen_edge"
tier=1
kind="passive"
cost=1
effect="damage"
applies_to="light"
amount=0.1
description="Light attacks deal 10% more damage."

[node_bladestorm]

name="Bladestorm"
branch="keen_edge"
tier=2
kind="upgrade"
cost=1
effect="damage"
applies_to="whirlwind_edge"
amount=0.25
description="Whirlwind Edge deals 25% more damage."

[node_heavy_hand]

name="Heavy Hand"
branch="keen_edge"
tier=2
kind="passive"
cost=1
effect="damage"
applies_to="heavy"
amount=0.1
description="Heavy attacks deal 10% more damage."

[node_keen_focus]

name="Keen Focus"
branch="keen_edge"
tier=3
kind="passive"
cost=2
effect="damage"
applies_to="abilities"
amount=0.1
description="Abilities deal 10% more damage."

[node_third_strike]

name="Third Strike"
branch="keen_edge"
tier=4
kind="passive"
cost=2
effect="none"
description="Capstone (not built yet): the third light attack in a chain always crits."
