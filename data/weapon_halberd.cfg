; Halberd, a Juggernaut weapon: a long pole with an axe head and a hook. Reach
; plus sweeps; controls lanes. Slower and heavier than the Fighter's weapons.
; The server and the client's own prediction both read this file: restart the
; server AND clients after editing. Times are in seconds (rounded to physics
; ticks, 60 per second), distances in meters. See data/weapon_broadsword.cfg
; for what every key means.

[weapon]

; Shown on the HUD and in the mastery panel.
name="Halberd"
; Placeholder model to draw (cosmetic only): a pole with an axe head.
model="halberd"
; Multiplies the stamina a blocked hit costs while this weapon is out (the long
; haft spreads the blow: a slightly sturdier guard than 1.0).
block_stamina_multiplier=0.9
; Ability pool, in order. Which ones a player can slot is decided by
; data/mastery_halberd.cfg.
abilities=["hooking_pull", "wide_reap", "pole_vault", "brace", "cleaving_arc", "crowd_sweep"]

[attacks]

; Hold the attack button this long to do a heavy attack instead of a light one.
heavy_hold_time=0.25
; An attack pressed this many seconds before it's possible still happens as
; soon as it becomes possible.
buffer=0.3
; Degrees per second the facing follows the camera during an attack (slower
; than the Fighter's 720: a heavy weapon).
turn_speed=540.0

[light]

; A reaching sweep of the axe head, right to left: long and fairly wide.
damage=95.0
stagger=0.0
block_stamina_damage=24.0
breaks_block=false
windup=0.24
active=0.14
recovery=0.42
move_multiplier=0.35
; Meters forward from your center, meters wide, meters tall.
range=3.0
width=2.0
height=2.0

[heavy]

; An overhead chop at full reach.
damage=240.0
stagger=0.5
block_stamina_damage=50.0
breaks_block=true
windup=0.55
active=0.15
recovery=0.65
move_multiplier=0.1
range=3.4
width=1.2
height=2.4

; --- Abilities ---

[ability_hooking_pull]

; Hooks the first target in a long, narrow line and drags it to you (stops
; [force] pull_gap short of you, data/combat.cfg). Marks it Hooked
; (data/status_effects.cfg): with the Warden capstone your next hit on it
; staggers.
name="Hooking Pull"
cooldown=10.0
damage=60.0
stagger=0.2
block_stamina_damage=20.0
breaks_block=false
windup=0.3
active=0.12
recovery=0.45
move_multiplier=0.2
turn_speed=360.0
shape="box"
range=5.5
width=1.0
height=2.0
; Only the first target it touches (everything touched on that same tick is
; still hit).
max_targets=1
; Pulled up to this many meters toward you, over this many seconds.
force_direction="toward"
force_distance=4.5
force_duration=0.35
applies_status="hooked"

[ability_wide_reap]

; A huge horizontal sweep in front of you.
name="Wide Reap"
cooldown=9.0
damage=150.0
stagger=0.3
block_stamina_damage=35.0
breaks_block=false
windup=0.35
active=0.18
recovery=0.5
move_multiplier=0.15
turn_speed=0.0
shape="box"
range=3.6
; Meters wide: about three times the light sweep.
width=6.0
height=2.0

[ability_pole_vault]

; Plant the pole and vault forward; the landing knocks back everything around
; you. The hit window is right after the dash ends (the landing).
name="Pole Vault"
cooldown=12.0
damage=90.0
stagger=0.3
block_stamina_damage=25.0
breaks_block=false
windup=0.55
active=0.12
recovery=0.45
move_multiplier=0.0
turn_speed=0.0
shape="radial"
; Radius of the landing's hit, meters.
range=2.3
width=0.0
height=2.0
; Meters vaulted forward, from dash_start to dash_end (seconds from the start).
dash_distance=6.0
dash_start=0.05
dash_end=0.5
; Cosmetic arc: peak height in meters.
leap_height=1.6
; Knockback on landing, meters away from you.
force_direction="away"
force_distance=2.5
force_duration=0.3

[ability_brace]

; Plant the halberd: no hit of its own. Gives you Braced
; (data/status_effects.cfg): no knockback, pull or launch for its duration,
; and whoever charges into you is staggered (see charge_stagger there).
name="Brace"
cooldown=14.0
damage=0.0
stagger=0.0
block_stamina_damage=0.0
breaks_block=false
windup=0.1
active=0.2
recovery=0.25
move_multiplier=0.3
turn_speed=720.0
shape="none"
range=0.0
width=0.0
height=0.0
self_status="braced"

[ability_cleaving_arc]

; A big overhead chop that leaves the target Exposed (takes more damage).
name="Cleaving Arc"
cooldown=10.0
damage=200.0
stagger=0.4
block_stamina_damage=45.0
breaks_block=false
windup=0.5
active=0.15
recovery=0.55
move_multiplier=0.1
turn_speed=360.0
shape="box"
range=3.2
width=1.6
height=2.6
applies_status="exposed"
status_stacks=1

[ability_crowd_sweep]

; A low, wide push with the haft: little damage, shoves everything in front of
; you back a few meters.
name="Crowd Sweep"
cooldown=12.0
damage=70.0
stagger=0.2
block_stamina_damage=25.0
breaks_block=false
windup=0.3
active=0.2
recovery=0.45
move_multiplier=0.2
turn_speed=0.0
shape="box"
range=3.0
width=4.5
height=2.0
; Meters pushed straight away from you, over this many seconds.
force_direction="away"
force_distance=4.0
force_duration=0.4
